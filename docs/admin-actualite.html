<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administration de l'actualité</title>
<!--
  Interface de tri des articles d'actualité, jumelle d'admin-ressources.html.

  Elle lit contenu/articles.yml par l'API GitHub, colore chaque entrée selon
  son jugement (vert publié, rouge refusé, neutre en attente), et permet de
  trancher : Garder, Refuser, remettre En attente, écrire la note qui
  remplace le titre du média sur la carte. La publication fait UN commit qui
  réécrit le registre au format en sections d'articles.py, régénère la liste
  de la page Actualité et la pose dans theme/composants/actualite.html et
  docs/actualite.html. Cloudflare Pages redéploie tout seul.

  La récolte, elle, reste sur ton poste : c'est articles.py --chercher qui
  lit les fils de presse. Cette page ne fait que juger ce qui a été récolté.

  Garde-fous : lecture sans perte exigée (chaque ligne du registre doit être
  comprise, sinon la page se met hors service), réécriture identique octet
  pour octet à ce qu'écrirait articles.py, et blocage si un commit étranger
  est arrivé entre le chargement et la publication.
-->
<style>
:root {
  --encre: #26221c; --encre-doux: #57503f; --encre-pale: #8a8272;
  --fond: #f6f3ec; --surface: #fffdf8; --surface-2: #efe9dd;
  --trait: #d8d0bf; --accent: #1f4e5f; --accent-fonce: #143540;
  --alerte: #8a2f2b; --ok: #2f6b3a; --rayon: 6px;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Georgia, "Times New Roman", serif; background: var(--fond); color: var(--encre); line-height: 1.5; }
main { max-width: 66rem; margin: 0 auto; padding: 1.5rem 1rem 5rem; }
h1 { font-size: 1.35rem; letter-spacing: -.01em; margin: 0 0 .2rem; }
.sous-titre { margin: 0 0 1.4rem; color: var(--encre-doux); font-size: .95rem; }
.panneau { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 1.1rem 1.2rem; margin: 0 0 1rem; }
.panneau h2 { font-size: 1rem; margin: 0 0 .6rem; }
label { display: block; font-size: .82rem; color: var(--encre-doux); margin: .6rem 0 .15rem; font-family: system-ui, sans-serif; }
input[type="password"], input[type="search"], select, input.note {
  font-family: system-ui, sans-serif; font-size: .92rem; color: var(--encre);
  background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); padding: .42rem .6rem;
}
input[type="password"] { width: 100%; }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button { font-family: system-ui, sans-serif; font-weight: 600; font-size: .88rem; border-radius: 100px;
  padding: .45rem 1.1rem; cursor: pointer; border: 1px solid var(--accent-fonce);
  background: var(--accent-fonce); color: #fff; transition: background .15s; }
button:hover { background: var(--accent); }
button.secondaire { background: transparent; color: var(--accent-fonce); }
button.secondaire:hover { background: var(--surface-2); }
button[disabled] { opacity: .45; cursor: not-allowed; }
.message { padding: .7rem .9rem; border-radius: var(--rayon); font-size: .9rem; margin: 0 0 1rem;
  font-family: system-ui, sans-serif; display: none; }
.message.visible { display: block; }
.message--erreur { background: #f6e4e2; border: 1px solid var(--alerte); color: var(--alerte); }
.message--ok { background: #e3efe4; border: 1px solid var(--ok); color: var(--ok); }
.message--info { background: var(--surface-2); border: 1px solid var(--trait); color: var(--encre-doux); }
.aide { font-size: .82rem; color: var(--encre-doux); font-family: system-ui, sans-serif; margin: .5rem 0 0; }
.filtres { display: flex; gap: .6rem; flex-wrap: wrap; margin: 0 0 .9rem; }
.filtres input[type="search"] { flex: 1 1 12rem; }
.carte { border: 1px solid var(--trait); border-left: 5px solid var(--encre-pale);
  border-radius: 0 var(--rayon) var(--rayon) 0; background: var(--surface);
  padding: .75rem .95rem; margin: 0 0 .65rem; }
.carte--o { border-left-color: var(--ok); background: #f2f8f2; }
.carte--n { border-left-color: var(--alerte); background: #faf1f0; }
.carte--douteux { border-left-color: #b8860b; background: #fdf6de; }
.carte__haut { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
.carte__statut { font-family: system-ui, sans-serif; font-size: .62rem; letter-spacing: .08em;
  text-transform: uppercase; color: #fff; background: var(--encre-pale); border-radius: 100px; padding: .14rem .6rem; }
.carte--o .carte__statut { background: var(--ok); }
.carte--n .carte__statut { background: var(--alerte); }
.carte--douteux .carte__statut { background: #b8860b; }
.carte__territoire { font-family: system-ui, sans-serif; font-size: .68rem; letter-spacing: .06em;
  text-transform: uppercase; color: var(--encre-pale); }
.carte__date { font-family: ui-monospace, monospace; font-size: .72rem; color: var(--encre-pale); margin-left: auto; }
.carte__titre { display: block; font-weight: 700; font-size: .98rem; line-height: 1.3; margin: .25rem 0 .1rem; }
.carte__titre a { color: var(--encre); text-decoration: none; }
.carte__titre a:hover { color: var(--accent); text-decoration: underline; }
.carte__media { font-size: .8rem; color: var(--encre-doux); }
.carte__pied { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-top: .5rem; }
.carte__pied .note { flex: 1 1 16rem; }
.carte__pied button { padding: .28rem .8rem; font-size: .78rem; }
button.garder { background: var(--ok); border-color: var(--ok); }
button.garder:hover { background: #3d8049; }
button.refuser { background: var(--alerte); border-color: var(--alerte); }
button.refuser:hover { background: #a13f3a; }
button.attente { background: transparent; color: var(--encre-doux); border-color: var(--trait); }
button.attente:hover { background: var(--surface-2); }
.carte.est-change { outline: 2px dashed var(--accent); outline-offset: 2px; }
.barre-etat { position: sticky; bottom: 0; background: var(--accent-fonce); color: #fff; border-radius: var(--rayon);
  padding: .7rem 1rem; display: none; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
  font-family: system-ui, sans-serif; font-size: .9rem; box-shadow: 0 -2px 12px rgba(0,0,0,.15); }
.barre-etat.visible { display: flex; }
.barre-etat button { background: #fff; color: var(--accent-fonce); border-color: #fff; }
.barre-etat button:hover { background: var(--surface-2); }
.compteurs { font-family: system-ui, sans-serif; font-size: .82rem; color: var(--encre-doux); margin: 0 0 .8rem; }
.compteurs b { color: var(--encre); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Administration de l'actualité</h1>
  <p class="sous-titre">Juge les articles récoltés : vert publié, rouge refusé, neutre en attente.</p>

  <p class="message" id="msg" role="status"></p>

  <section class="panneau" id="ecran-jeton">
    <h2>Connexion</h2>
    <label for="jeton">Jeton d'accès GitHub (le même que pour les ressources)</label>
    <input type="password" id="jeton" autocomplete="off" spellcheck="false" placeholder="github_pat_...">
    <label style="display:flex;gap:.45rem;align-items:center;margin-top:.6rem;font-family:system-ui,sans-serif;font-size:.85rem;color:var(--encre)">
      <input type="checkbox" id="retenir" style="width:auto"> Se souvenir du jeton sur cet appareil
    </label>
    <p class="aide">La récolte des fils de presse reste sur ton poste (articles.py --chercher); ici tu juges ce qui a été récolté et la page Actualité se met à jour en un commit.</p>
    <p style="margin-top:.8rem"><button id="btn-connexion">Charger le registre</button></p>
  </section>

  <section id="ecran-registre" hidden>
    <p class="compteurs" id="compteurs"></p>
    <div class="filtres">
      <select id="filtre-statut">
        <option value="">Tous les statuts</option>
        <option value="attente">À juger</option>
        <option value="o">Publiés</option>
        <option value="n">Refusés</option>
        <option value="douteux">Illisibles</option>
      </select>
      <select id="filtre-fiche"><option value="">Tous les territoires</option></select>
      <input type="search" id="filtre-texte" placeholder="Un mot du titre ou du média">
    </div>
    <div id="liste"></div>

    <div class="barre-etat" id="barre-etat">
      <span id="resume-changements"></span>
      <span>
        <button class="secondaire" id="btn-abandonner" style="color:#fff;border-color:#fff;background:transparent">Tout abandonner</button>
        <button id="btn-publier">Publier les changements</button>
      </span>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";

  var DEPOT = { proprietaire: "merciermathieu5", nom: "MonsieurUniversSocial", branche: "main" };
  var REGISTRE = "contenu/articles.yml";
  var COMPOSANT = "theme/composants/actualite.html";
  var PAGE = "docs/actualite.html";
  var LEXIQUE = "outils/lexique_actualite.yml";
  var API = "https://api.github.com";

  // ------------------------------------------------------------------
  // Fonctions pures, exposées sur window.AdminActualite pour le test.
  // Elles reproduisent à l'octet près ce qu'écrit outils/articles.py.
  // ------------------------------------------------------------------

  var CHAMPS = ["fiche", "media", "date", "titre", "garder", "note"];

  function statutDe(garder) {
    var g = (garder || "").trim().toUpperCase();
    if (g.indexOf("O") === 0) return "o";
    if (g.indexOf("N") === 0) return "n";
    if (g) return "douteux";
    return "attente";
  }

  function citer(valeur) {
    return '"' + String(valeur == null ? "" : valeur)
      .replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
  }
  function deciter(brut) {
    var v = brut.trim();
    if (v.length >= 2 && v[0] === '"' && v[v.length - 1] === '"') {
      v = v.slice(1, -1);
    }
    return v.replace(/\\"/g, '"').replace(/\\\\/g, "\\");
  }

  // Lecture SANS PERTE du registre : chaque ligne doit être comprise, sinon
  // elle est consignée dans "restes" et la page refusera de servir.
  function analyserRegistre(texte) {
    var lignes = texte.split("\n");
    var entete = [];
    var articles = [];
    var restes = [];
    var courant = null;
    var apresArticles = false;
    for (var i = 0; i < lignes.length; i++) {
      var ligne = lignes[i];
      if (!apresArticles) {
        entete.push(ligne);
        if (ligne === "articles:") apresArticles = true;
        else if (!(ligne.charAt(0) === "#" || ligne.trim() === "")) {
          restes.push((i + 1) + " : " + ligne);
        }
        continue;
      }
      if (ligne.trim() === "" || /^\s*#/.test(ligne)) continue;
      var debut = ligne.match(/^  - adresse: (.*)$/);
      if (debut) {
        courant = { adresse: deciter(debut[1]) };
        articles.push(courant);
        continue;
      }
      var champ = ligne.match(/^    (\w+): (.*)$/);
      if (champ && courant && CHAMPS.indexOf(champ[1]) >= 0) {
        courant[champ[1]] = deciter(champ[2]);
        continue;
      }
      if (champ && courant && champ[1] === "echecs") {
        courant.echecs = parseInt(champ[2], 10);
        continue;
      }
      restes.push((i + 1) + " : " + ligne);
    }
    return { entete: entete.join("\n"), articles: articles, restes: restes };
  }

  // L'ordre canonique du registre : les trois sections, chacune triée
  // (date, fiche) décroissant, tri stable. C'est l'ordre du fichier écrit,
  // donc l'ordre dans lequel articles.py relira les entrées : la liste HTML
  // doit partir de lui, sinon les dates ex aequo se rangent autrement ici
  // et là-bas.
  function ordonnerCanonique(articles) {
    var tries = articles.slice().sort(function (a, b) {
      var ca = (a.date || "") + "\u0000" + (a.fiche || "");
      var cb = (b.date || "") + "\u0000" + (b.fiche || "");
      return ca < cb ? 1 : ca > cb ? -1 : 0;
    });
    var rangs = { attente: 0, douteux: 0, o: 1, n: 2 };
    var sections = [[], [], []];
    for (var i = 0; i < tries.length; i++) {
      sections[rangs[statutDe(tries[i].garder)]].push(tries[i]);
    }
    return sections;
  }

  // Réécriture identique à ecrire_registre() : trois sections commentées,
  // tri (date, fiche) décroissant à l'intérieur de chacune.
  function serialiserRegistre(entete, articles) {
    var sections = ordonnerCanonique(articles);
    var BANDEAUX = ["À JUGER", "PUBLIÉS (O)", "REFUSÉS (N)"];
    var lignes = [entete];
    for (var s = 0; s < sections.length; s++) {
      var retenus = sections[s];
      if (!retenus.length) continue;
      lignes.push("");
      lignes.push("  # ---------------- " + BANDEAUX[s] + " ----------------");
      for (var i = 0; i < retenus.length; i++) {
        var a = retenus[i];
        lignes.push("  - adresse: " + citer(a.adresse));
        lignes.push("    fiche: " + citer(a.fiche));
        lignes.push("    media: " + citer(a.media));
        lignes.push("    date: " + citer(a.date));
        lignes.push("    titre: " + citer(a.titre));
        lignes.push("    garder: " + citer(a.garder));
        lignes.push("    note: " + citer(a.note));
        if (a.echecs) lignes.push("    echecs: " + a.echecs);
        lignes.push("");
      }
    }
    return lignes.join("\n").replace(/\s+$/, "") + "\n";
  }

  // Reproduction de html.escape() de Python, guillemets compris.
  function echapper(texte) {
    return String(texte == null ? "" : texte)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#x27;");
  }

  // Reproduction de couper_titre() : « Section | Titre » donne les deux.
  function couperTitre(titre) {
    var t = titre || "";
    var i = t.indexOf(" | ");
    if (i >= 0) {
      var chapeau = t.slice(0, i);
      var reste = t.slice(i + 3);
      if (chapeau.length <= 60 && reste.trim()) {
        return [chapeau.trim(), reste.trim()];
      }
    }
    return ["", t.trim()];
  }

  // Reproduction de la boucle de publier() : les O dans l'ordre du registre
  // réécrit, puis triés par date décroissante, note qui remplace le titre.
  function serialiserListe(articles, noms) {
    var prets = ordonnerCanonique(articles)[1];
    prets.sort(function (a, b) {
      var da = a.date || "", db = b.date || "";
      return da < db ? 1 : da > db ? -1 : 0;
    });
    var lignes = [];
    for (var i = 0; i < prets.length; i++) {
      var a = prets[i];
      var nom = noms[a.fiche] || "";
      if (!nom) continue;
      var coupe = couperTitre(a.titre || "");
      var chapeau = coupe[0], titre = coupe[1];
      if ((a.note || "").trim()) { chapeau = ""; titre = a.note.trim(); }
      lignes.push('    <li data-fiche="' + echapper(a.fiche)
        + '" data-source="' + echapper(a.media || "")
        + '" data-date="' + echapper(a.date || "")
        + '" data-territoire="' + echapper(nom)
        + '" data-chapeau="' + echapper(chapeau)
        + '"><a href="' + echapper(a.adresse) + '">'
        + echapper(titre) + "</a></li>");
    }
    return lignes;
  }

  function remplacerListe(texte, lignes) {
    var motif = /(<ul data-matiere="geographie">)[\s\S]*?(<\/ul>)/;
    if (!motif.test(texte)) return null;
    var corps = lignes.length ? "\n" + lignes.join("\n") : "";
    return texte.replace(motif, function (m, ouverture, fermeture) {
      return ouverture + corps + "\n  " + fermeture;
    });
  }

  // Les noms de territoires, lus dans le lexique : nom nu ou entre guillemets.
  function analyserNoms(texteLexique) {
    var noms = {};
    var motif = /"(\d+)":\s*\n\s*nom: (.*)/g;
    var m;
    while ((m = motif.exec(texteLexique)) !== null) {
      var nom = m[2].trim();
      if (nom.length >= 2 && nom[0] === '"' && nom[nom.length - 1] === '"') {
        nom = nom.slice(1, -1);
      }
      noms[m[1]] = nom;
    }
    return noms;
  }

  window.AdminActualite = {
    analyserRegistre: analyserRegistre, serialiserRegistre: serialiserRegistre,
    serialiserListe: serialiserListe, remplacerListe: remplacerListe,
    analyserNoms: analyserNoms, couperTitre: couperTitre,
    echapper: echapper, statutDe: statutDe, citer: citer, deciter: deciter
  };

  // ------------------------------------------------------------------
  // La page vivante. Le test jsdom s'arrête ici.
  // ------------------------------------------------------------------
  if (!document.getElementById("ecran-jeton")) return;

  var etat = {
    jeton: null, headSha: null,
    entete: "", articles: [], origine: [],
    fichiers: {}, noms: {}, canonique: false
  };

  var el = function (id) { return document.getElementById(id); };
  function message(texte, genre) {
    var m = el("msg");
    m.textContent = texte;
    m.className = "message visible message--" + (genre || "info");
    if (genre === "ok") setTimeout(function () { m.className = "message"; }, 7000);
  }

  function api(chemin, options) {
    options = options || {};
    options.headers = {
      "Authorization": "Bearer " + etat.jeton,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    };
    if (options.corps) {
      options.method = options.method || "POST";
      options.body = JSON.stringify(options.corps);
      options.headers["Content-Type"] = "application/json";
      delete options.corps;
    }
    return fetch(API + chemin, options).then(function (r) {
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (d) {
        throw new Error("GitHub " + r.status + (d.message ? " : " + d.message : ""));
      });
      return r.json();
    });
  }
  function decoderBase64(b64) {
    var brut = atob(b64.replace(/\n/g, ""));
    var octets = new Uint8Array(brut.length);
    for (var i = 0; i < brut.length; i++) octets[i] = brut.charCodeAt(i);
    return new TextDecoder("utf-8").decode(octets);
  }
  function encoderBase64(texte) {
    var octets = new TextEncoder().encode(texte);
    var brut = "";
    for (var i = 0; i < octets.length; i++) brut += String.fromCharCode(octets[i]);
    return btoa(brut);
  }

  function charger() {
    var jeton = el("jeton").value.trim();
    if (!jeton) { message("Colle d'abord ton jeton GitHub.", "erreur"); return; }
    etat.jeton = jeton;
    try { sessionStorage.setItem("jeton-admin", jeton); } catch (e) {}
    // La case décide du souvenir durable : cochée, le jeton reste dans ce
    // navigateur; décochée, tout souvenir durable est effacé.
    try {
      if (el("retenir").checked) localStorage.setItem("jeton-admin", jeton);
      else localStorage.removeItem("jeton-admin");
    } catch (e) {}
    el("btn-connexion").disabled = true;
    message("Chargement du registre...");
    var base = "/repos/" + DEPOT.proprietaire + "/" + DEPOT.nom;
    Promise.all([
      api(base + "/git/ref/heads/" + DEPOT.branche),
      api(base + "/contents/" + REGISTRE + "?ref=" + DEPOT.branche),
      api(base + "/contents/" + COMPOSANT + "?ref=" + DEPOT.branche),
      api(base + "/contents/" + PAGE + "?ref=" + DEPOT.branche),
      api(base + "/contents/" + LEXIQUE + "?ref=" + DEPOT.branche)
    ]).then(function (r) {
      etat.headSha = r[0].object.sha;
      var texteRegistre = decoderBase64(r[1].content);
      etat.fichiers[COMPOSANT] = decoderBase64(r[2].content);
      etat.fichiers[PAGE] = decoderBase64(r[3].content);
      etat.noms = analyserNoms(decoderBase64(r[4].content));

      var lu = analyserRegistre(texteRegistre);
      if (lu.restes.length) {
        throw new Error("Le registre contient " + lu.restes.length
          + " ligne(s) que cette page ne comprend pas (première : ligne "
          + lu.restes[0] + "). Par prudence, rien n'est modifiable.");
      }
      // Le garde-fou de fidélité : relire ce qu'on réécrirait doit redonner
      // les mêmes données, champ pour champ.
      var refait = analyserRegistre(serialiserRegistre(lu.entete, lu.articles));
      if (JSON.stringify(refait.articles.slice().sort(parAdresse))
          !== JSON.stringify(lu.articles.slice().sort(parAdresse))) {
        throw new Error("La réécriture du registre ne conserverait pas les "
          + "données à l'identique. Par prudence, rien n'est modifiable.");
      }
      etat.canonique = serialiserRegistre(lu.entete, lu.articles) === texteRegistre;
      if (!remplacerListe(etat.fichiers[COMPOSANT], [])
          || !remplacerListe(etat.fichiers[PAGE], [])) {
        throw new Error("La liste de la page Actualité est introuvable dans "
          + "un des deux fichiers HTML.");
      }
      etat.entete = lu.entete;
      etat.articles = lu.articles;
      etat.origine = JSON.parse(JSON.stringify(lu.articles));
      garnirFiltreFiches();
      dessiner();
      el("ecran-jeton").hidden = true;
      el("ecran-registre").hidden = false;
      var avis = "Registre chargé : " + lu.articles.length + " articles.";
      if (!etat.canonique) {
        avis += " Il sera réécrit au format en sections à ta première publication.";
      }
      message(avis, "ok");
    }).catch(function (e) {
      el("btn-connexion").disabled = false;
      message(e.message, "erreur");
    });
  }
  function parAdresse(a, b) { return a.adresse < b.adresse ? -1 : 1; }

  function garnirFiltreFiches() {
    var menu = el("filtre-fiche");
    menu.textContent = "";
    var tout = document.createElement("option");
    tout.value = ""; tout.textContent = "Tous les territoires";
    menu.appendChild(tout);
    Object.keys(etat.noms).sort().forEach(function (numero) {
      var o = document.createElement("option");
      o.value = numero;
      o.textContent = numero + " - " + etat.noms[numero];
      menu.appendChild(o);
    });
  }

  function changements() {
    var publies = 0, refuses = 0, remis = 0, notes = 0;
    for (var i = 0; i < etat.articles.length; i++) {
      var a = etat.articles[i], o = etat.origine[i];
      if (a.garder !== o.garder) {
        var st = statutDe(a.garder);
        if (st === "o") publies++;
        else if (st === "n") refuses++;
        else remis++;
      } else if ((a.note || "") !== (o.note || "")) {
        notes++;
      }
    }
    return { publies: publies, refuses: refuses, remis: remis, notes: notes,
             total: publies + refuses + remis + notes };
  }

  function dessiner() {
    var liste = el("liste");
    liste.textContent = "";
    var fStatut = el("filtre-statut").value;
    var fFiche = el("filtre-fiche").value;
    var fTexte = el("filtre-texte").value.trim().toLowerCase();
    var comptes = { attente: 0, o: 0, n: 0, douteux: 0 };
    var ordre = { attente: 0, douteux: 0, o: 1, n: 2 };
    var indices = etat.articles.map(function (a, i) { return i; });
    indices.sort(function (x, y) {
      var a = etat.articles[x], b = etat.articles[y];
      var oa = ordre[statutDe(a.garder)], ob = ordre[statutDe(b.garder)];
      if (oa !== ob) return oa - ob;
      var da = a.date || "", db = b.date || "";
      return da < db ? 1 : da > db ? -1 : x - y;
    });
    indices.forEach(function (i) {
      var a = etat.articles[i];
      var st = statutDe(a.garder);
      comptes[st]++;
      if (fStatut && st !== fStatut) return;
      if (fFiche && a.fiche !== fFiche) return;
      if (fTexte && ((a.titre || "") + " " + (a.media || "")).toLowerCase().indexOf(fTexte) < 0) return;
      liste.appendChild(carte(i));
    });
    el("compteurs").innerHTML = "";
    var c = el("compteurs");
    c.appendChild(texteGras("À juger : ", comptes.attente + comptes.douteux));
    c.appendChild(document.createTextNode(" · "));
    c.appendChild(texteGras("Publiés : ", comptes.o));
    c.appendChild(document.createTextNode(" · "));
    c.appendChild(texteGras("Refusés : ", comptes.n));
    if (comptes.douteux) {
      c.appendChild(document.createTextNode(" · dont "));
      c.appendChild(texteGras("illisibles : ", comptes.douteux));
    }
    barre();
  }
  function texteGras(texte, valeur) {
    var s = document.createElement("span");
    s.appendChild(document.createTextNode(texte));
    var b = document.createElement("b");
    b.textContent = String(valeur);
    s.appendChild(b);
    return s;
  }

  function carte(i) {
    var a = etat.articles[i];
    var o = etat.origine[i];
    var st = statutDe(a.garder);
    var noeud = document.createElement("article");
    noeud.className = "carte carte--" + st
      + ((a.garder !== o.garder || (a.note || "") !== (o.note || "")) ? " est-change" : "");

    var haut = document.createElement("div");
    haut.className = "carte__haut";
    var badge = document.createElement("span");
    badge.className = "carte__statut";
    badge.textContent = st === "o" ? "Publié" : st === "n" ? "Refusé"
      : st === "douteux" ? "garder : « " + a.garder + " »" : "À juger";
    haut.appendChild(badge);
    var territoire = document.createElement("span");
    territoire.className = "carte__territoire";
    territoire.textContent = a.fiche + " - " + (etat.noms[a.fiche] || "fiche inconnue");
    haut.appendChild(territoire);
    var date = document.createElement("span");
    date.className = "carte__date";
    date.textContent = (a.media || "") + " · " + (a.date || "");
    haut.appendChild(date);
    noeud.appendChild(haut);

    var titre = document.createElement("span");
    titre.className = "carte__titre";
    var lien = document.createElement("a");
    lien.href = a.adresse; lien.target = "_blank"; lien.rel = "noopener";
    lien.textContent = a.titre || a.adresse;
    titre.appendChild(lien);
    noeud.appendChild(titre);

    var pied = document.createElement("div");
    pied.className = "carte__pied";
    var bGarder = document.createElement("button");
    bGarder.className = "garder"; bGarder.textContent = "Garder";
    bGarder.disabled = st === "o";
    bGarder.addEventListener("click", function () { a.garder = "O"; dessiner(); });
    var bRefuser = document.createElement("button");
    bRefuser.className = "refuser"; bRefuser.textContent = "Refuser";
    bRefuser.disabled = st === "n";
    bRefuser.addEventListener("click", function () { a.garder = "N"; dessiner(); });
    var bAttente = document.createElement("button");
    bAttente.className = "attente"; bAttente.textContent = "En attente";
    bAttente.disabled = st === "attente";
    bAttente.addEventListener("click", function () { a.garder = ""; dessiner(); });
    var note = document.createElement("input");
    note.type = "text"; note.className = "note";
    note.placeholder = "Note facultative, remplace le titre sur la carte";
    note.value = a.note || "";
    note.addEventListener("change", function () { a.note = note.value.trim(); dessiner(); });
    pied.appendChild(bGarder); pied.appendChild(bRefuser); pied.appendChild(bAttente);
    pied.appendChild(note);
    noeud.appendChild(pied);
    return noeud;
  }

  function barre() {
    var c = changements();
    var b = el("barre-etat");
    if (!c.total) { b.className = "barre-etat"; return; }
    var morceaux = [];
    if (c.publies) morceaux.push(c.publies + " publié" + (c.publies > 1 ? "s" : ""));
    if (c.refuses) morceaux.push(c.refuses + " refusé" + (c.refuses > 1 ? "s" : ""));
    if (c.remis) morceaux.push(c.remis + " remis en attente");
    if (c.notes) morceaux.push(c.notes + " note" + (c.notes > 1 ? "s" : ""));
    el("resume-changements").textContent = "En attente de publication : " + morceaux.join(", ") + ".";
    b.className = "barre-etat visible";
  }

  function messageCommit() {
    var c = changements();
    var morceaux = [];
    if (c.publies) morceaux.push(c.publies + " publié" + (c.publies > 1 ? "s" : ""));
    if (c.refuses) morceaux.push(c.refuses + " refusé" + (c.refuses > 1 ? "s" : ""));
    if (c.remis) morceaux.push(c.remis + " remis en attente");
    if (c.notes) morceaux.push(c.notes + " note" + (c.notes > 1 ? "s" : ""));
    return "Actualité : " + morceaux.join(", ");
  }

  function publier() {
    var bouton = el("btn-publier");
    bouton.disabled = true;
    message("Publication en cours...");
    var base = "/repos/" + DEPOT.proprietaire + "/" + DEPOT.nom;
    var nouveauRegistre = serialiserRegistre(etat.entete, etat.articles);
    var lignesListe = serialiserListe(etat.articles, etat.noms);
    var contenus = [
      [REGISTRE, nouveauRegistre],
      [COMPOSANT, remplacerListe(etat.fichiers[COMPOSANT], lignesListe)],
      [PAGE, remplacerListe(etat.fichiers[PAGE], lignesListe)]
    ];
    api(base + "/git/ref/heads/" + DEPOT.branche).then(function (ref) {
      if (ref.object.sha !== etat.headSha) {
        throw new Error("Le dépôt a changé depuis le chargement (peut-être une "
          + "récolte de construire.bat). Recharge la page avant de publier.");
      }
      return Promise.all(contenus.map(function (paire) {
        return api(base + "/git/blobs", { corps: { content: encoderBase64(paire[1]), encoding: "base64" } });
      })).then(function (blobs) {
        return api(base + "/git/commits/" + etat.headSha).then(function (tete) {
          return api(base + "/git/trees", { corps: {
            base_tree: tete.tree.sha,
            tree: contenus.map(function (paire, i) {
              return { path: paire[0], mode: "100644", type: "blob", sha: blobs[i].sha };
            })
          } });
        });
      }).then(function (arbre) {
        return api(base + "/git/commits", { corps: {
          message: messageCommit(), tree: arbre.sha, parents: [etat.headSha]
        } });
      }).then(function (commit) {
        return api(base + "/git/refs/heads/" + DEPOT.branche, {
          method: "PATCH", corps: { sha: commit.sha }
        }).then(function () { return commit; });
      });
    }).then(function (commit) {
      message("Publié (commit " + commit.sha.slice(0, 7)
        + "). La page Actualité se met à jour dans les prochaines minutes.", "ok");
      etat.headSha = commit.sha;
      etat.fichiers[COMPOSANT] = remplacerListe(etat.fichiers[COMPOSANT], lignesListe);
      etat.fichiers[PAGE] = remplacerListe(etat.fichiers[PAGE], lignesListe);
      etat.origine = JSON.parse(JSON.stringify(etat.articles));
      etat.canonique = true;
      dessiner();
      bouton.disabled = false;
    }).catch(function (e) {
      message(e.message, "erreur");
      bouton.disabled = false;
    });
  }

  function abandonner() {
    if (!window.confirm("Abandonner tous les jugements non publiés ?")) return;
    etat.articles = JSON.parse(JSON.stringify(etat.origine));
    dessiner();
    message("Retour à l'état publié.", "ok");
  }

  el("btn-connexion").addEventListener("click", charger);
  el("jeton").addEventListener("keydown", function (e) { if (e.key === "Enter") charger(); });
  el("btn-publier").addEventListener("click", publier);
  el("btn-abandonner").addEventListener("click", abandonner);
  el("filtre-statut").addEventListener("change", dessiner);
  el("filtre-fiche").addEventListener("change", dessiner);
  el("filtre-texte").addEventListener("input", dessiner);

  try {
    var retenu = localStorage.getItem("jeton-admin");
    var garde = retenu || sessionStorage.getItem("jeton-admin");
    if (garde) el("jeton").value = garde;
    if (retenu) el("retenir").checked = true;
  } catch (e) {}
})();
</script>
</body>
</html>
