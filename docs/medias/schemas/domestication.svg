<svg viewBox="0 0 900 175" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="La domestication par sélection, de génération en génération">
  <style>
    .t { font-family: Archivo, sans-serif; }
    .l { font-size: 14px; fill: var(--encre); }
    .n { font-family: 'IBM Plex Mono', monospace; font-size: 13px; fill: var(--schema-cle); }
  </style>
  <text class="t n" x="8" y="22">GÉNÉRATION 1</text>
  <text class="t n" x="330" y="22">GÉNÉRATION 2</text>
  <text class="t n" x="650" y="22">APRÈS DES SIÈCLES</text>
  <g fill="var(--bloc-pale)">
    <circle cx="28" cy="66" r="11"/><circle cx="68" cy="66" r="15"/><circle cx="112" cy="66" r="9"/>
    <circle cx="152" cy="66" r="17"/><circle cx="196" cy="66" r="12"/>
  </g>
  <circle cx="68" cy="66" r="15" fill="var(--schema-accent)"/>
  <circle cx="152" cy="66" r="17" fill="var(--schema-accent)"/>
  <text class="t l" x="8" y="112">On garde les plus gros épis,</text>
  <text class="t l" x="8" y="132">les bêtes les plus dociles.</text>
  <path d="M236 66 h58 l-12 -10 M294 66 l-12 10" stroke="var(--bloc)" stroke-width="2.5" fill="none"/>
  <g fill="var(--bloc-pale)">
    <circle cx="348" cy="66" r="14"/><circle cx="392" cy="66" r="17"/><circle cx="436" cy="66" r="13"/>
    <circle cx="480" cy="66" r="18"/><circle cx="524" cy="66" r="15"/>
  </g>
  <circle cx="392" cy="66" r="17" fill="var(--schema-accent)"/>
  <circle cx="480" cy="66" r="18" fill="var(--schema-accent)"/>
  <text class="t l" x="330" y="112">On recommence, et encore.</text>
  <path d="M556 66 h58 l-12 -10 M614 66 l-12 10" stroke="var(--bloc)" stroke-width="2.5" fill="none"/>
  <g fill="var(--bloc)">
    <circle cx="676" cy="66" r="21"/><circle cx="730" cy="66" r="22"/>
    <circle cx="784" cy="66" r="21"/><circle cx="838" cy="66" r="22"/>
  </g>
  <text class="t l" x="650" y="112">L'espèce a changé. Elle ne peut</text>
  <text class="t l" x="650" y="132">plus se reproduire sans nous.</text>
</svg>
