<svg viewBox="0 0 1100 260" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Les quatre innovations agricoles du Moyen Âge : le moulin à vent, l'assolement triennal, le collier d'épaule et la charrue">
  <style>
    .ag-t { font-family: Archivo, sans-serif; }
    .ag-n { font-size: 14px; font-weight: 700; fill: var(--encre); }
    .ag-s { font-size: 12px; fill: var(--encre-doux); }
    .ag-carte { fill: var(--surface); stroke: var(--matiere-voile); stroke-width: 1.5; }
    .ag-p { stroke: var(--schema-accent); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .ag-pf { fill: var(--schema-accent); }
    .ag-pv { fill: var(--matiere-voile); }
  </style>
  <rect class="ag-carte" x="40" y="30" width="240" height="200" rx="10"/>
  <path class="ag-p" d="M 150 130 L 143 78 L 177 78 L 170 130 Z"/>
  <line class="ag-p" x1="160" y1="78" x2="184" y2="54"/>
  <line class="ag-p" x1="160" y1="78" x2="136" y2="54"/>
  <line class="ag-p" x1="160" y1="78" x2="184" y2="102"/>
  <line class="ag-p" x1="160" y1="78" x2="136" y2="102"/>
  <text class="ag-t ag-n" x="160" y="182" text-anchor="middle">Le moulin à vent</text>
  <text class="ag-t ag-s" x="160" y="206" text-anchor="middle">moudre le grain des récoltes</text>
  <rect class="ag-carte" x="310" y="30" width="240" height="200" rx="10"/>
  <circle class="ag-p" cx="430" cy="92" r="38"/>
  <line class="ag-p" x1="430" y1="92" x2="430" y2="54"/>
  <line class="ag-p" x1="430" y1="92" x2="397" y2="111"/>
  <line class="ag-p" x1="430" y1="92" x2="463" y2="111"/>
  <path class="ag-p" d="M 468 66 A 46 46 0 0 1 476 92"/>
  <polygon class="ag-pf" points="476,100 470,88 482,88"/>
  <text class="ag-t ag-n" x="430" y="182" text-anchor="middle">L'assolement triennal</text>
  <text class="ag-t ag-s" x="430" y="206" text-anchor="middle">la rotation des cultures</text>
  <rect class="ag-carte" x="580" y="30" width="240" height="200" rx="10"/>
  <ellipse class="ag-p" cx="700" cy="92" rx="34" ry="42"/>
  <ellipse class="ag-p" cx="700" cy="92" rx="18" ry="26"/>
  <text class="ag-t ag-n" x="700" y="182" text-anchor="middle">Le collier d'épaule</text>
  <text class="ag-t ag-s" x="700" y="206" text-anchor="middle">tirer des charges plus lourdes</text>
  <rect class="ag-carte" x="850" y="30" width="240" height="200" rx="10"/>
  <path class="ag-p" d="M 916 64 L 992 64 L 1004 52"/>
  <path class="ag-p" d="M 948 64 L 948 106 Q 948 126 972 126 L 992 126"/>
  <path class="ag-p" d="M 948 106 L 922 128"/>
  <text class="ag-t ag-n" x="970" y="182" text-anchor="middle">La charrue</text>
  <text class="ag-t ag-s" x="970" y="206" text-anchor="middle">labourer plus profondément</text>
</svg>
