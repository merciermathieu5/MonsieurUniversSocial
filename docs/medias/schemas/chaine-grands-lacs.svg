<svg viewBox="0 0 1100 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Les cinq Grands Lacs dans l'ordre d'ouest en est, du lac Supérieur au lac Ontario, avec leur superficie, jusqu'au fleuve Saint-Laurent">
  <style>
    .gl-t { font-family: Archivo, sans-serif; }
    .gl-c { font-size: 11px; font-weight: 600; fill: var(--encre-doux); }
    .gl-n { font-size: 16px; font-weight: 700; fill: var(--bloc-texte); }
    .gl-s { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 600; fill: var(--bloc-texte); }
    .gl-na { font-size: 16px; font-weight: 700; fill: var(--surface); }
    .gl-sa { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 600; fill: var(--surface); }
    .gl-fl { font-size: 12.5px; font-weight: 700; fill: var(--encre); }
    .gl-bt { font-size: 14.5px; font-weight: 700; fill: var(--encre); }
    .gl-bp { font-size: 12.5px; fill: var(--encre); }
    .gl-f { fill: none; stroke: var(--schema-trait); stroke-width: 2; }
  </style>

  <text class="gl-t gl-c" x="30" y="40">Les cinq lacs, d'ouest en est</text>

  <rect x="30" y="54" width="150" height="86" rx="5" fill="var(--bloc)"/>
  <text class="gl-t gl-n" x="48" y="86">Supérieur</text>
  <text class="gl-t gl-s" x="48" y="112">82 100 km²</text>
  <path class="gl-f" d="M188 97 H206 M199 91 L206 97 L199 103"/>

  <rect x="214" y="54" width="150" height="86" rx="5" fill="var(--bloc)"/>
  <text class="gl-t gl-n" x="232" y="86">Michigan</text>
  <text class="gl-t gl-s" x="232" y="112">57 800 km²</text>
  <path class="gl-f" d="M372 97 H390 M383 91 L390 97 L383 103"/>

  <rect x="398" y="54" width="150" height="86" rx="5" fill="var(--bloc)"/>
  <text class="gl-t gl-n" x="416" y="86">Huron</text>
  <text class="gl-t gl-s" x="416" y="112">59 600 km²</text>
  <path class="gl-f" d="M556 97 H574 M567 91 L574 97 L567 103"/>

  <rect x="582" y="54" width="150" height="86" rx="5" fill="var(--bloc)"/>
  <text class="gl-t gl-n" x="600" y="86">Érié</text>
  <text class="gl-t gl-s" x="600" y="112">25 700 km²</text>
  <path class="gl-f" d="M740 97 H758 M751 91 L758 97 L751 103"/>

  <rect x="766" y="54" width="150" height="86" rx="5" fill="var(--schema-accent)"/>
  <text class="gl-t gl-na" x="784" y="86">Ontario</text>
  <text class="gl-t gl-sa" x="784" y="112">18 960 km²</text>
  <path class="gl-f" d="M924 97 H950 M943 91 L950 97 L943 103"/>

  <text class="gl-t gl-fl" x="962" y="93">Le fleuve</text>
  <text class="gl-t gl-fl" x="962" y="111">Saint-Laurent</text>

  <rect x="30" y="176" width="1040" height="94" rx="5" fill="var(--matiere-voile)"/>
  <text class="gl-t gl-bt" x="52" y="202">Retiens l'ordre avec SMHÉO</text>
  <text class="gl-t gl-bp" x="52" y="226">Supérieur, Michigan, Huron, Érié, Ontario. Invente une phrase dont les initiales donnent SMHÉO, par exemple « Super ! Mon héros est Obélix ».</text>
  <text class="gl-t gl-bp" x="52" y="246">L'eau descend d'ouest en est, mais pas en ligne droite : le Michigan et le Supérieur se déversent tous deux dans le Huron, qui alimente l'Érié,</text>
  <text class="gl-t gl-bp" x="52" y="266">lequel tombe dans l'Ontario par les chutes du Niagara. Seul l'Ontario ouvre sur le Saint-Laurent, et donc sur le Québec et l'Atlantique.</text>
</svg>
