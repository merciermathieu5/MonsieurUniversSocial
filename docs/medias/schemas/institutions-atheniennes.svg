<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Les institutions politiques d'Athènes et les trois pouvoirs qu'elles exercent">
  <style>
    .ia-t { font-family: Archivo, sans-serif; }
    .ia-b { font-size: 17px; font-weight: 700; fill: var(--bloc-texte); }
    .ia-v { font-size: 13.5px; fill: var(--bloc-texte); }
    .ia-p { font-size: 13px; font-weight: 600; fill: var(--schema-cle); letter-spacing: 1px; }
    .ia-m { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; fill: var(--schema-accent); }
  </style>
  <rect x="290" y="14" width="420" height="58" rx="4" fill="var(--bloc)"/>
  <text class="ia-t ia-b" x="500" y="39" text-anchor="middle">Les citoyens d'Athènes</text>
  <text class="ia-t ia-v" x="500" y="60" text-anchor="middle">Environ 40 000 hommes, soit 10 % de la population.</text>
  <path d="M500 76 v18" stroke="var(--bloc)" stroke-width="2.5" fill="none"/>
  <path d="M170 94 h660" stroke="var(--bloc)" stroke-width="2.5" fill="none"/>
  <path d="M170 94 v22 l-9 -10 M170 116 l9 -10" stroke="var(--bloc)" stroke-width="2.5" fill="none"/>
  <path d="M500 94 v22 l-9 -10 M500 116 l9 -10" stroke="var(--bloc)" stroke-width="2.5" fill="none"/>
  <path d="M830 94 v22 l-9 -10 M830 116 l9 -10" stroke="var(--bloc)" stroke-width="2.5" fill="none"/>

  <text class="ia-t ia-p" x="170" y="146" text-anchor="middle">POUVOIR LÉGISLATIF</text>
  <rect x="20" y="160" width="300" height="120" rx="4" fill="var(--bloc)"/>
  <text class="ia-t ia-b" x="170" y="189" text-anchor="middle">L'ecclésia</text>
  <text class="ia-t ia-v" x="170" y="214" text-anchor="middle">L'assemblée de tous les citoyens.</text>
  <text class="ia-t ia-v" x="170" y="234" text-anchor="middle">Elle vote les lois et décide</text>
  <text class="ia-t ia-v" x="170" y="254" text-anchor="middle">de la guerre et de la paix.</text>
  <rect x="20" y="292" width="300" height="98" rx="4" fill="var(--bloc)" opacity=".85"/>
  <text class="ia-t ia-b" x="170" y="321" text-anchor="middle">La boulè</text>
  <text class="ia-t ia-v" x="170" y="346" text-anchor="middle">Un conseil de 500 citoyens</text>
  <text class="ia-t ia-v" x="170" y="366" text-anchor="middle">qui prépare les projets de lois.</text>
  <text class="ia-t ia-m" x="170" y="418" text-anchor="middle">Tirage au sort</text>

  <text class="ia-t ia-p" x="500" y="146" text-anchor="middle">POUVOIR EXÉCUTIF</text>
  <rect x="350" y="160" width="300" height="120" rx="4" fill="var(--bloc)"/>
  <text class="ia-t ia-b" x="500" y="189" text-anchor="middle">Les magistrats</text>
  <text class="ia-t ia-v" x="500" y="214" text-anchor="middle">Ils appliquent les décisions.</text>
  <text class="ia-t ia-v" x="500" y="234" text-anchor="middle">Les dix stratèges commandent</text>
  <text class="ia-t ia-v" x="500" y="254" text-anchor="middle">l'armée et la flotte.</text>
  <text class="ia-t ia-m" x="500" y="418" text-anchor="middle">Élection des stratèges</text>

  <text class="ia-t ia-p" x="830" y="146" text-anchor="middle">POUVOIR JUDICIAIRE</text>
  <rect x="680" y="160" width="300" height="120" rx="4" fill="var(--bloc)"/>
  <text class="ia-t ia-b" x="830" y="189" text-anchor="middle">L'héliée</text>
  <text class="ia-t ia-v" x="830" y="214" text-anchor="middle">Le grand tribunal populaire.</text>
  <text class="ia-t ia-v" x="830" y="234" text-anchor="middle">Ses 6 000 jurés jugent</text>
  <text class="ia-t ia-v" x="830" y="254" text-anchor="middle">les procès de la cité.</text>
  <text class="ia-t ia-m" x="830" y="418" text-anchor="middle">Tirage au sort</text>

  <line x1="20" y1="440" x2="980" y2="440" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="ia-t ia-v" x="500" y="463" text-anchor="middle" fill="var(--encre)">Le tirage au sort donne à chaque citoyen la même chance d'exercer une charge publique.</text>
</svg>
