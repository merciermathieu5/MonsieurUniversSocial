<svg viewBox="0 0 1100 352" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Ligne du temps de l'essor urbain et commercial, du Haut Moyen Âge au Bas Moyen Âge, avec la Paix de Dieu, les foires de Champagne et la peste noire">
  <style>
    .eu-t { font-family: Archivo, sans-serif; }
    .eu-e { font-size: 13.5px; fill: var(--encre); }
    .eu-d { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; fill: var(--schema-accent); }
    .eu-p1 { font-size: 14px; font-weight: 600; fill: var(--bloc-pale-texte); }
    .eu-p2 { font-size: 14px; font-weight: 600; fill: var(--surface); }
    .eu-p3 { font-size: 14px; font-weight: 600; fill: var(--bloc-texte); }
  </style>
  <rect x="70" y="178" width="480" height="34" fill="var(--bloc-pale)"/>
  <rect x="550" y="178" width="288" height="34" fill="var(--schema-accent)"/>
  <rect x="838" y="178" width="192" height="34" fill="var(--bloc)"/>
  <text class="eu-t eu-p1" x="310" y="200" text-anchor="middle">Haut Moyen Âge</text>
  <text class="eu-t eu-p2" x="694" y="200" text-anchor="middle">Moyen Âge central</text>
  <text class="eu-t eu-p3" x="934" y="200" text-anchor="middle">Bas Moyen Âge</text>
  <line x1="550" y1="164" x2="550" y2="170" stroke="var(--schema-accent)" stroke-width="2.5"/>
  <text class="eu-t eu-d" x="550" y="96" text-anchor="middle">Vers 1000</text>
  <text class="eu-t eu-e" x="550" y="117" text-anchor="middle">L'Église lance la Paix de</text>
  <text class="eu-t eu-e" x="550" y="138" text-anchor="middle">Dieu : moins de violence</text>
  <text class="eu-t eu-e" x="550" y="159" text-anchor="middle">envers les paysans.</text>
  <circle cx="550" cy="178" r="6.5" fill="var(--schema-accent)" stroke="var(--surface)" stroke-width="2"/>
  <line x1="722.8" y1="220" x2="722.8" y2="226" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="eu-t eu-d" x="722.8" y="248" text-anchor="middle">12e et 13e siècles</text>
  <text class="eu-t eu-e" x="722.8" y="269" text-anchor="middle">Les foires de Champagne</text>
  <text class="eu-t eu-e" x="722.8" y="290" text-anchor="middle">attirent les marchands</text>
  <text class="eu-t eu-e" x="722.8" y="311" text-anchor="middle">de toute l'Europe.</text>
  <circle cx="722.8" cy="212" r="6.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
  <line x1="883.1" y1="164" x2="883.1" y2="170" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="eu-t eu-d" x="883.1" y="96" text-anchor="middle">1347 à 1352</text>
  <text class="eu-t eu-e" x="883.1" y="117" text-anchor="middle">La peste noire emporte</text>
  <text class="eu-t eu-e" x="883.1" y="138" text-anchor="middle">une grande partie de la</text>
  <text class="eu-t eu-e" x="883.1" y="159" text-anchor="middle">population européenne.</text>
  <circle cx="883.1" cy="178" r="6.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
</svg>
