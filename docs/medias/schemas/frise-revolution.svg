<svg viewBox="0 0 1100 380" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Ligne du temps de la Révolution américaine, de la Proclamation royale de 1763 au Bill of Rights de 1791, à cheval sur les Temps modernes et l'Époque contemporaine">
  <style>
    .rv-t { font-family: Archivo, sans-serif; }
    .rv-e { font-size: 13.5px; fill: var(--encre); }
    .rv-d { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; fill: var(--schema-accent); }
    .rv-p1 { font-size: 14px; font-weight: 600; fill: var(--bloc-pale-texte); }
    .rv-p2 { font-size: 14px; font-weight: 700; fill: var(--surface); }
    .rv-l { stroke: var(--schema-trait); stroke-width: 1.5; fill: none; }
  </style>
  <rect x="70" y="190" width="696" height="34" fill="var(--bloc-pale)"/>
  <rect x="766" y="190" width="264" height="34" fill="var(--schema-accent)"/>
  <text class="rv-t rv-p1" x="418" y="212" text-anchor="middle">Les Temps modernes</text>
  <text class="rv-t rv-p2" x="898" y="212" text-anchor="middle">L'Époque contemporaine</text>

  <path class="rv-l" d="M 142 190 L 142 168"/>
  <text class="rv-t rv-d" x="142" y="102" text-anchor="middle">1763</text>
  <text class="rv-t rv-e" x="142" y="123" text-anchor="middle">La Proclamation</text>
  <text class="rv-t rv-e" x="142" y="144" text-anchor="middle">royale ferme l'Ouest.</text>
  <circle cx="142" cy="190" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="rv-l" d="M 382 190 L 382 168"/>
  <text class="rv-t rv-d" x="382" y="102" text-anchor="middle">1773</text>
  <text class="rv-t rv-e" x="382" y="123" text-anchor="middle">Le Boston Tea Party</text>
  <text class="rv-t rv-e" x="382" y="144" text-anchor="middle">défie la taxe sur le thé.</text>
  <circle cx="382" cy="190" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="rv-l" d="M 622 190 L 622 168"/>
  <text class="rv-t rv-d" x="622" y="102" text-anchor="middle">1783</text>
  <text class="rv-t rv-e" x="622" y="123" text-anchor="middle">Le traité de Paris</text>
  <text class="rv-t rv-e" x="622" y="144" text-anchor="middle">reconnaît les États-Unis.</text>
  <circle cx="622" cy="190" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="rv-l" d="M 814 190 L 814 178 L 934 160"/>
  <text class="rv-t rv-d" x="1030" y="102" text-anchor="end">1791</text>
  <text class="rv-t rv-e" x="1030" y="123" text-anchor="end">Le Bill of Rights</text>
  <text class="rv-t rv-e" x="1030" y="144" text-anchor="end">protège les droits.</text>
  <circle cx="814" cy="190" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="rv-l" d="M 310 224 L 310 236 L 232 254"/>
  <text class="rv-t rv-d" x="150" y="278" text-anchor="start">1770</text>
  <text class="rv-t rv-e" x="150" y="299" text-anchor="start">Le massacre</text>
  <text class="rv-t rv-e" x="150" y="320" text-anchor="start">de Boston.</text>
  <circle cx="310" cy="224" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="rv-l" d="M 430 224 L 430 246"/>
  <text class="rv-t rv-d" x="430" y="278" text-anchor="middle">1775</text>
  <text class="rv-t rv-e" x="430" y="299" text-anchor="middle">La bataille</text>
  <text class="rv-t rv-e" x="430" y="320" text-anchor="middle">de Lexington.</text>
  <circle cx="430" cy="224" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="rv-l" d="M 454 224 L 454 236 L 604 254"/>
  <text class="rv-t rv-d" x="604" y="278" text-anchor="middle">1776</text>
  <text class="rv-t rv-e" x="604" y="299" text-anchor="middle">La Déclaration</text>
  <text class="rv-t rv-e" x="604" y="320" text-anchor="middle">d'indépendance.</text>
  <circle cx="454" cy="224" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="rv-l" d="M 766 224 L 766 236 L 838 254"/>
  <text class="rv-t rv-d" x="838" y="278" text-anchor="middle">1789</text>
  <text class="rv-t rv-e" x="838" y="299" text-anchor="middle">Washington devient</text>
  <text class="rv-t rv-e" x="838" y="320" text-anchor="middle">le premier président.</text>
  <circle cx="766" cy="224" r="6.5" fill="var(--schema-accent)" stroke="var(--surface)" stroke-width="2"/>
</svg>
