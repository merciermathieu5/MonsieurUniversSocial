<svg viewBox="0 0 1100 380" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Ligne du temps de l'impérialisme en Afrique, du Grito de Dolores en 1810 à l'envoi des tirailleurs sénégalais en France en 1914">
  <style>
    .im-t { font-family: Archivo, sans-serif; }
    .im-e { font-size: 13.5px; fill: var(--encre); }
    .im-d { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; fill: var(--schema-accent); }
    .im-p { font-size: 14px; font-weight: 700; fill: var(--surface); }
    .im-l { stroke: var(--schema-trait); stroke-width: 1.5; fill: none; }
  </style>
  <rect x="70" y="190" width="960" height="34" fill="var(--schema-accent)"/>
  <text class="im-t im-p" x="550" y="212" text-anchor="middle">L'Époque contemporaine</text>

  <path class="im-l" d="M 262 190 L 262 168"/>
  <text class="im-t im-d" x="262" y="102" text-anchor="middle">1824</text>
  <text class="im-t im-e" x="262" y="123" text-anchor="middle">La bataille d'Ayacucho</text>
  <text class="im-t im-e" x="262" y="144" text-anchor="middle">libère l'Amérique du Sud.</text>
  <circle cx="262" cy="190" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="im-l" d="M 622 190 L 622 168"/>
  <text class="im-t im-d" x="622" y="102" text-anchor="middle">1869</text>
  <text class="im-t im-e" x="622" y="123" text-anchor="middle">Le canal de Suez est</text>
  <text class="im-t im-e" x="622" y="144" text-anchor="middle">ouvert à la navigation.</text>
  <circle cx="622" cy="190" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="im-l" d="M 902 190 L 902 168"/>
  <text class="im-t im-d" x="902" y="102" text-anchor="middle">1904</text>
  <text class="im-t im-e" x="902" y="123" text-anchor="middle">Les Héréros se soulèvent</text>
  <text class="im-t im-e" x="902" y="144" text-anchor="middle">dans le Sud-Ouest africain.</text>
  <circle cx="902" cy="190" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="im-l" d="M 150 224 L 150 246"/>
  <text class="im-t im-d" x="150" y="278" text-anchor="middle">1810</text>
  <text class="im-t im-e" x="150" y="299" text-anchor="middle">Le Grito de Dolores</text>
  <text class="im-t im-e" x="150" y="320" text-anchor="middle">soulève le Mexique.</text>
  <circle cx="150" cy="224" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="im-l" d="M 750 224 L 750 246"/>
  <text class="im-t im-d" x="750" y="278" text-anchor="middle">1885</text>
  <text class="im-t im-e" x="750" y="299" text-anchor="middle">L'Acte général de Berlin</text>
  <text class="im-t im-e" x="750" y="320" text-anchor="middle">est signé le 26 février.</text>
  <circle cx="750" cy="224" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="im-l" d="M 982 224 L 982 236 L 1006 254"/>
  <text class="im-t im-d" x="1030" y="278" text-anchor="end">1914</text>
  <text class="im-t im-e" x="1030" y="299" text-anchor="end">Les tirailleurs sénégalais</text>
  <text class="im-t im-e" x="1030" y="320" text-anchor="end">sont envoyés en France.</text>
  <circle cx="982" cy="224" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
</svg>
