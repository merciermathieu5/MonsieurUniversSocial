<svg viewBox="0 0 1100 330" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Le cinquième siècle athénien : guerres médiques, âge d'or de Périclès et guerre du Péloponnèse">
  <style>
    .cs-t { font-family: Archivo, sans-serif; }
    .cs-e { font-size: 14px; fill: var(--encre); }
    .cs-b { font-size: 14.5px; font-weight: 600; }
    .cs-d { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; fill: var(--schema-accent); }
  </style>
  <line x1="70" y1="270" x2="1030" y2="270" stroke="var(--bloc)" stroke-width="3"/>
  <text class="cs-t cs-d" x="70.0" y="296" text-anchor="middle">-500</text>
  <text class="cs-t cs-d" x="550.0" y="296" text-anchor="middle">-450</text>
  <text class="cs-t cs-d" x="1030.0" y="296" text-anchor="middle">-400</text>
  <line x1="550.0" y1="264" x2="550.0" y2="276" stroke="var(--bloc)" stroke-width="2"/>

  <circle cx="166.0" cy="270" r="6.5" fill="var(--schema-accent)" stroke="var(--surface)" stroke-width="2"/>
  <circle cx="262.0" cy="270" r="6.5" fill="var(--schema-accent)" stroke="var(--surface)" stroke-width="2"/>
  <text class="cs-t cs-d" x="166.0" y="26" text-anchor="middle">-490 et -480</text>
  <text class="cs-t cs-e" x="166.0" y="47" text-anchor="middle">Les guerres médiques : Athènes repousse</text>
  <text class="cs-t cs-e" x="166.0" y="66" text-anchor="middle">les Perses à Marathon, puis à Salamine.</text>
  <line x1="166.0" y1="76" x2="166.0" y2="262" stroke="var(--schema-trait)" stroke-width="1.5"/>

  <rect x="444.4" y="110" width="307.20000000000005" height="34" rx="4" fill="var(--bloc)"/>
  <text class="cs-t cs-b" x="454.4" y="132" fill="var(--bloc-texte)">L'âge d'or : Périclès dirige Athènes</text>
  <text class="cs-t cs-d" x="444.4" y="100" >-461 à -429</text>
  <line x1="444.4" y1="144" x2="444.4" y2="262" stroke="var(--schema-trait)" stroke-width="1.5"/>

  <rect x="732.4" y="190" width="259.20000000000005" height="34" rx="4" fill="var(--bloc-pale)"/>
  <text class="cs-t cs-b" x="722.4" y="212" text-anchor="end" fill="var(--encre)">La guerre du Péloponnèse : Athènes capitule devant Sparte</text>
  <text class="cs-t cs-d" x="732.4" y="180">-431 à -404</text>
  <line x1="732.4" y1="224" x2="732.4" y2="262" stroke="var(--schema-trait)" stroke-width="1.5"/>
</svg>
