<svg viewBox="0 0 1100 380" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Ligne du temps des droits civils au 20e siècle, des lois de Nuremberg de 1935 à l'élection de Nelson Mandela en 1994">
  <style>
    .dc-t { font-family: Archivo, sans-serif; }
    .dc-e { font-size: 13.5px; fill: var(--encre); }
    .dc-d { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; fill: var(--schema-accent); }
    .dc-p { font-size: 14px; font-weight: 700; fill: var(--surface); }
    .dc-l { stroke: var(--schema-trait); stroke-width: 1.5; fill: none; }
  </style>
  <rect x="70" y="190" width="960" height="34" fill="var(--schema-accent)"/>
  <text class="dc-t dc-p" x="550" y="212" text-anchor="middle">L'Époque contemporaine</text>

  <path class="dc-l" d="M 139 190 L 139 168"/>
  <text class="dc-t dc-d" x="139" y="102" text-anchor="middle">1935</text>
  <text class="dc-t dc-e" x="139" y="123" text-anchor="middle">Les lois de Nuremberg</text>
  <text class="dc-t dc-e" x="139" y="144" text-anchor="middle">sont adoptées.</text>
  <circle cx="139" cy="190" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="dc-l" d="M 413 190 L 413 168"/>
  <text class="dc-t dc-d" x="413" y="102" text-anchor="middle">1955</text>
  <text class="dc-t dc-e" x="413" y="123" text-anchor="middle">Rosa Parks refuse de</text>
  <text class="dc-t dc-e" x="413" y="144" text-anchor="middle">céder sa place.</text>
  <circle cx="413" cy="190" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="dc-l" d="M 893 190 L 893 168"/>
  <text class="dc-t dc-d" x="893" y="102" text-anchor="middle">1990</text>
  <text class="dc-t dc-e" x="893" y="123" text-anchor="middle">Nelson Mandela sort</text>
  <text class="dc-t dc-e" x="893" y="144" text-anchor="middle">de résidence surveillée.</text>
  <circle cx="893" cy="190" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="dc-l" d="M 317 224 L 317 246"/>
  <text class="dc-t dc-d" x="317" y="278" text-anchor="middle">1948</text>
  <text class="dc-t dc-e" x="317" y="299" text-anchor="middle">L'apartheid est instauré</text>
  <text class="dc-t dc-e" x="317" y="320" text-anchor="middle">en Afrique du Sud.</text>
  <circle cx="317" cy="224" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="dc-l" d="M 536 224 L 536 246"/>
  <text class="dc-t dc-d" x="536" y="278" text-anchor="middle">1964</text>
  <text class="dc-t dc-e" x="536" y="299" text-anchor="middle">Le Civil Rights Act est</text>
  <text class="dc-t dc-e" x="536" y="320" text-anchor="middle">signé le 2 juillet.</text>
  <circle cx="536" cy="224" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="dc-l" d="M 948 224 L 948 236 L 972 254"/>
  <text class="dc-t dc-d" x="1030" y="278" text-anchor="end">1994</text>
  <text class="dc-t dc-e" x="1030" y="299" text-anchor="end">Mandela devient</text>
  <text class="dc-t dc-e" x="1030" y="320" text-anchor="end">président.</text>
  <circle cx="948" cy="224" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
</svg>
