<svg viewBox="0 0 1100 250" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Les trois ordres de la société médiévale : ceux qui prient, ceux qui font la guerre et ceux qui travaillent">
  <style>
    .to-t { font-family: Archivo, sans-serif; }
    .to-t1 { font-size: 15px; font-weight: 700; fill: var(--surface); }
    .to-t2 { font-size: 15px; font-weight: 700; fill: var(--bloc-texte); }
    .to-t3 { font-size: 15px; font-weight: 700; fill: var(--bloc-pale-texte); }
    .to-s1 { font-size: 12.5px; fill: var(--surface); }
    .to-s2 { font-size: 12.5px; fill: var(--bloc-texte); }
    .to-s3 { font-size: 12.5px; fill: var(--bloc-pale-texte); }
  </style>
  <rect x="40" y="55" width="300" height="140" rx="6" fill="var(--schema-accent)"/>
  <text class="to-t to-t1" x="190" y="115" text-anchor="middle">Ceux qui prient</text>
  <text class="to-t to-s1" x="190" y="143" text-anchor="middle">Le clergé : moines, prêtres, évêques</text>
  <rect x="400" y="55" width="300" height="140" rx="6" fill="var(--bloc)"/>
  <text class="to-t to-t2" x="550" y="115" text-anchor="middle">Ceux qui font la guerre</text>
  <text class="to-t to-s2" x="550" y="143" text-anchor="middle">Princes, seigneurs et chevaliers</text>
  <rect x="760" y="55" width="300" height="140" rx="6" fill="var(--bloc-pale)"/>
  <text class="to-t to-t3" x="910" y="115" text-anchor="middle">Ceux qui travaillent</text>
  <text class="to-t to-s3" x="910" y="143" text-anchor="middle">Les paysans, la grande majorité</text>
</svg>
