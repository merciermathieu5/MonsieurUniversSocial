<svg viewBox="0 0 1100 330" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="L'organisation du clergé au Moyen Âge : le pape dirige le clergé séculier, évêques et prêtres, et le clergé régulier, abbés, moines et moniales">
  <style>
    .cg-t { font-family: Archivo, sans-serif; }
    .cg-pape { font-size: 15px; font-weight: 700; fill: var(--surface); }
    .cg-b1 { font-size: 14px; font-weight: 600; fill: var(--bloc-texte); }
    .cg-b2 { font-size: 14px; font-weight: 600; fill: var(--bloc-pale-texte); }
    .cg-m { font-size: 13.5px; font-weight: 600; fill: var(--encre); }
    .cg-a { font-size: 12.5px; fill: var(--encre-doux); }
  </style>
  <rect x="390" y="30" width="320" height="48" rx="5" fill="var(--schema-accent)"/>
  <text class="cg-t cg-pape" x="550" y="59" text-anchor="middle">Le pape, chef de l'Église</text>
  <line x1="550" y1="78" x2="550" y2="100" stroke="var(--schema-trait)" stroke-width="2"/>
  <line x1="310" y1="100" x2="790" y2="100" stroke="var(--schema-trait)" stroke-width="2"/>
  <line x1="310" y1="100" x2="310" y2="130" stroke="var(--schema-trait)" stroke-width="2"/>
  <line x1="790" y1="100" x2="790" y2="130" stroke="var(--schema-trait)" stroke-width="2"/>
  <rect x="120" y="130" width="380" height="44" rx="5" fill="var(--bloc)"/>
  <text class="cg-t cg-b1" x="310" y="158" text-anchor="middle">Le clergé séculier</text>
  <rect x="600" y="130" width="380" height="44" rx="5" fill="var(--bloc-pale)"/>
  <text class="cg-t cg-b2" x="790" y="158" text-anchor="middle">Le clergé régulier</text>
  <line x1="310" y1="174" x2="310" y2="200" stroke="var(--schema-trait)" stroke-width="2"/>
  <line x1="790" y1="174" x2="790" y2="200" stroke="var(--schema-trait)" stroke-width="2"/>
  <rect x="120" y="200" width="380" height="44" rx="5" fill="var(--matiere-voile)"/>
  <text class="cg-t cg-m" x="310" y="228" text-anchor="middle">Les évêques et les prêtres</text>
  <rect x="600" y="200" width="380" height="44" rx="5" fill="var(--matiere-voile)"/>
  <text class="cg-t cg-m" x="790" y="228" text-anchor="middle">Les abbés, les moines et les moniales</text>
  <text class="cg-t cg-a" x="310" y="278" text-anchor="middle">Ils vivent dans le siècle,</text>
  <text class="cg-t cg-a" x="310" y="296" text-anchor="middle">au milieu des fidèles.</text>
  <text class="cg-t cg-a" x="790" y="278" text-anchor="middle">Ils vivent selon une règle,</text>
  <text class="cg-t cg-a" x="790" y="296" text-anchor="middle">dans les abbayes et les couvents.</text>
</svg>
