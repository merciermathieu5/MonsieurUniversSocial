<svg viewBox="0 0 1100 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Les trois gestes du patrimoine bâti, conserver, restaurer et reconstituer, classés selon l'ampleur de l'intervention sur l'édifice">
  <style>
    .pv-t { font-family: Archivo, sans-serif; }
    .pv-cond { font-size: 11px; font-weight: 600; fill: var(--encre-doux); }
    .pv-h1 { font-size: 17px; font-weight: 700; fill: var(--bloc-pale-texte); }
    .pv-h2 { font-size: 17px; font-weight: 700; fill: var(--surface); }
    .pv-p1 { font-size: 12.5px; fill: var(--bloc-pale-texte); }
    .pv-p2 { font-size: 12.5px; fill: var(--surface); }
    .pv-bt { font-size: 14.5px; font-weight: 700; fill: var(--encre); }
    .pv-bp { font-size: 12.5px; fill: var(--encre); }
  </style>

  <text class="pv-t pv-cond" x="367" y="45" text-anchor="middle">Si l'édifice est abîmé</text>
  <text class="pv-t pv-cond" x="732" y="45" text-anchor="middle">S'il a disparu</text>

  <rect x="40" y="60" width="290" height="90" rx="5" fill="var(--bloc-pale)"/>
  <text class="pv-t pv-h1" x="60" y="93">Conserver</text>
  <text class="pv-t pv-p1" x="60" y="117">Maintenir un bâtiment dans son</text>
  <text class="pv-t pv-p1" x="60" y="136">état, en réparant ce qui s'use.</text>

  <path d="M 340 105 L 388 105 M 380 99 L 388 105 L 380 111" fill="none"
        stroke="var(--schema-trait)" stroke-width="2"/>

  <rect x="405" y="60" width="290" height="90" rx="5" fill="var(--schema-cle)"/>
  <text class="pv-t pv-h2" x="425" y="93">Restaurer</text>
  <text class="pv-t pv-p2" x="425" y="117">Redonner sa forme première à</text>
  <text class="pv-t pv-p2" x="425" y="136">un édifice endommagé.</text>

  <path d="M 705 105 L 753 105 M 745 99 L 753 105 L 745 111" fill="none"
        stroke="var(--schema-trait)" stroke-width="2"/>

  <rect x="770" y="60" width="290" height="90" rx="5" fill="var(--schema-accent)"/>
  <text class="pv-t pv-h2" x="790" y="93">Reconstituer</text>
  <text class="pv-t pv-p2" x="790" y="117">Rebâtir d'après des documents</text>
  <text class="pv-t pv-p2" x="790" y="136">ce qui avait disparu.</text>

  <rect x="40" y="195" width="1020" height="66" rx="5" fill="var(--matiere-voile)"/>
  <text class="pv-t pv-bt" x="62" y="222">Le degré d'intervention grandit de gauche à droite</text>
  <text class="pv-t pv-bp" x="62" y="245">Conserver touche le moins à l'édifice d'origine, reconstituer le plus. Le Vieux-Québec porte les trois à la fois.</text>
</svg>
