<svg viewBox="0 0 1100 390" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Ligne du temps de la fondation d'Athènes à la naissance de la démocratie en -507">
  <style>
    .fa-t { font-family: Archivo, sans-serif; }
    .fa-e { font-size: 13.5px; fill: var(--encre); }
    .fa-d { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; fill: var(--schema-accent); }
  </style>
  <rect x="70" y="182" width="960" height="16" rx="8" fill="var(--bloc)"/>
  <text class="fa-t fa-d" x="8" y="195">-800</text>
  <text class="fa-t fa-d" x="1092" y="195" text-anchor="end">-480</text>
  <line x1="220.0" y1="182" x2="220.0" y2="164" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="fa-t fa-d" x="220.0" y="99" text-anchor="middle">Vers -750</text>
  <text class="fa-t fa-e" x="220.0" y="120" text-anchor="middle">La cité-État d'Athènes est</text>
  <text class="fa-t fa-e" x="220.0" y="139" text-anchor="middle">fondée. Des aristocrates la</text>
  <text class="fa-t fa-e" x="220.0" y="158" text-anchor="middle">gouvernent : c'est l'oligarchie.</text>
  <circle cx="220.0" cy="190" r="6.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
  <line x1="607.0" y1="182" x2="607.0" y2="164" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="fa-t fa-d" x="607.0" y="99" text-anchor="middle">Vers -621</text>
  <text class="fa-t fa-e" x="607.0" y="120" text-anchor="middle">Dracon rédige le premier</text>
  <text class="fa-t fa-e" x="607.0" y="139" text-anchor="middle">code de lois écrit, le même</text>
  <text class="fa-t fa-e" x="607.0" y="158" text-anchor="middle">pour tous les citoyens.</text>
  <circle cx="607.0" cy="190" r="6.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
  <line x1="688.0" y1="198" x2="688.0" y2="216" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="fa-t fa-d" x="688.0" y="236" text-anchor="middle">Vers -594</text>
  <text class="fa-t fa-e" x="688.0" y="257" text-anchor="middle">Solon abolit l'esclavage</text>
  <text class="fa-t fa-e" x="688.0" y="276" text-anchor="middle">pour dettes et réduit le</text>
  <text class="fa-t fa-e" x="688.0" y="295" text-anchor="middle">pouvoir des aristocrates.</text>
  <circle cx="688.0" cy="190" r="6.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
  <line x1="949.0" y1="198" x2="949.0" y2="216" stroke="var(--schema-accent)" stroke-width="2.5"/>
  <text class="fa-t fa-d" x="949.0" y="236" text-anchor="middle">-507</text>
  <text class="fa-t fa-e" x="949.0" y="257" text-anchor="middle">Clisthène réforme les institutions :</text>
  <text class="fa-t fa-e" x="949.0" y="276" text-anchor="middle">la démocratie naît. Tous les citoyens</text>
  <text class="fa-t fa-e" x="949.0" y="295" text-anchor="middle">deviennent égaux devant la loi.</text>
  <circle cx="949.0" cy="190" r="6.5" fill="var(--schema-accent)" stroke="var(--surface)" stroke-width="2"/>
</svg>
