<svg viewBox="0 0 1100 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="La chaîne de l'hydroélectricité, du barrage qui retient la rivière jusqu'à la consommation, en passant par la centrale et les lignes à haute tension">
  <style>
    .hy-t { font-family: Archivo, sans-serif; }
    .hy-c { font-size: 11px; font-weight: 600; fill: var(--encre-doux); }
    .hy-h1 { font-size: 16px; font-weight: 700; fill: var(--bloc-pale-texte); }
    .hy-h2 { font-size: 16px; font-weight: 700; fill: var(--surface); }
    .hy-p1 { font-size: 12px; fill: var(--bloc-pale-texte); }
    .hy-p2 { font-size: 12px; fill: var(--surface); }
    .hy-h3 { font-size: 16px; font-weight: 700; fill: var(--bloc-texte); }
    .hy-p3 { font-size: 12px; fill: var(--bloc-texte); }
    .hy-bt { font-size: 14.5px; font-weight: 700; fill: var(--encre); }
    .hy-bp { font-size: 12.5px; fill: var(--encre); }
  </style>

  <text class="hy-t hy-c" x="292" y="45" text-anchor="middle">Exploitation</text>
  <text class="hy-t hy-c" x="567" y="45" text-anchor="middle">Transformation</text>
  <text class="hy-t hy-c" x="842" y="45" text-anchor="middle">Transport</text>

  <rect x="40" y="60" width="230" height="90" rx="5" fill="var(--bloc-pale)"/>
  <text class="hy-t hy-h1" x="58" y="92">Le barrage</text>
  <text class="hy-t hy-p1" x="58" y="115">Il retient la rivière et</text>
  <text class="hy-t hy-p1" x="58" y="133">crée un réservoir.</text>

  <path d="M 278 105 L 308 105 M 300 99 L 308 105 L 300 111" fill="none"
        stroke="var(--schema-trait)" stroke-width="2"/>

  <rect x="315" y="60" width="230" height="90" rx="5" fill="var(--bloc)"/>
  <text class="hy-t hy-h3" x="333" y="92">La centrale</text>
  <text class="hy-t hy-p3" x="333" y="115">L'eau fait tourner des</text>
  <text class="hy-t hy-p3" x="333" y="133">turbines et des alternateurs.</text>

  <path d="M 553 105 L 583 105 M 575 99 L 583 105 L 575 111" fill="none"
        stroke="var(--schema-trait)" stroke-width="2"/>

  <rect x="590" y="60" width="230" height="90" rx="5" fill="var(--schema-cle)"/>
  <text class="hy-t hy-h2" x="608" y="92">Le transport</text>
  <text class="hy-t hy-p2" x="608" y="115">Des lignes à 735 000 volts</text>
  <text class="hy-t hy-p2" x="608" y="133">portent le courant au sud.</text>

  <path d="M 828 105 L 858 105 M 850 99 L 858 105 L 850 111" fill="none"
        stroke="var(--schema-trait)" stroke-width="2"/>

  <rect x="865" y="60" width="230" height="90" rx="5" fill="var(--schema-accent)"/>
  <text class="hy-t hy-h2" x="883" y="92">La consommation</text>
  <text class="hy-t hy-p2" x="883" y="115">Maisons, usines, écoles</text>
  <text class="hy-t hy-p2" x="883" y="133">et véhicules électriques.</text>

  <rect x="40" y="195" width="1055" height="66" rx="5" fill="var(--matiere-voile)"/>
  <text class="hy-t hy-bt" x="62" y="222">L'évacuateur de crues, à côté de la chaîne</text>
  <text class="hy-t hy-bp" x="62" y="245">Il ne produit pas d'électricité. Quand le réservoir monte trop haut, il ouvre à l'eau en trop une sortie contrôlée.</text>
</svg>
