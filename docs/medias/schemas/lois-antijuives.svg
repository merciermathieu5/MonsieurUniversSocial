<svg viewBox="0 0 1100 340" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Les lois antijuives adoptées en Allemagne de 1933 à 1939, année par année, selon la chronologie du Musée de l'Holocauste Montréal">
  <style>
    .nz-t { font-family: Archivo, sans-serif; }
    .nz-d { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; fill: var(--bloc-pale-texte); }
    .nz-e { font-size: 12.5px; fill: var(--bloc-pale-texte); }
    .nz-d8 { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; fill: var(--surface); }
    .nz-e8 { font-size: 12.5px; fill: var(--surface); }
  </style>

  <rect x="20" y="40" width="196" height="250" rx="6" fill="var(--bloc-pale)"/>
  <text class="nz-t nz-d" x="118" y="76" text-anchor="middle">1933</text>
  <text class="nz-t nz-e" x="118" y="108" text-anchor="middle">Fonction publique</text>
  <text class="nz-t nz-e" x="118" y="128" text-anchor="middle">Barreau</text>
  <text class="nz-t nz-e" x="118" y="148" text-anchor="middle">Quota de 1,5 % à</text>
  <text class="nz-t nz-e" x="118" y="168" text-anchor="middle">l'université</text>
  <text class="nz-t nz-e" x="118" y="188" text-anchor="middle">Arts, presse, radio</text>
  <text class="nz-t nz-e" x="118" y="208" text-anchor="middle">Propriété agricole</text>

  <rect x="236" y="40" width="196" height="250" rx="6" fill="var(--bloc-pale)"/>
  <text class="nz-t nz-d" x="334" y="76" text-anchor="middle">1935</text>
  <text class="nz-t nz-e" x="334" y="108" text-anchor="middle">Officiers de l'armée</text>
  <text class="nz-t nz-e" x="334" y="128" text-anchor="middle">Lois de Nuremberg :</text>
  <text class="nz-t nz-e" x="334" y="148" text-anchor="middle">mariage interdit,</text>
  <text class="nz-t nz-e" x="334" y="168" text-anchor="middle">citoyenneté retirée</text>

  <rect x="452" y="40" width="196" height="250" rx="6" fill="var(--bloc-pale)"/>
  <text class="nz-t nz-d" x="550" y="76" text-anchor="middle">1936-1937</text>
  <text class="nz-t nz-e" x="550" y="108" text-anchor="middle">Conseil fiscal</text>
  <text class="nz-t nz-e" x="550" y="128" text-anchor="middle">Vétérinaires</text>
  <text class="nz-t nz-e" x="550" y="148" text-anchor="middle">Écoles de Berlin</text>
  <text class="nz-t nz-e" x="550" y="168" text-anchor="middle">Témoignage devant</text>
  <text class="nz-t nz-e" x="550" y="188" text-anchor="middle">les tribunaux</text>

  <rect x="668" y="40" width="196" height="250" rx="6" fill="var(--schema-accent)"/>
  <text class="nz-t nz-d8" x="766" y="76" text-anchor="middle">1938</text>
  <text class="nz-t nz-e8" x="766" y="108" text-anchor="middle">Biens à déclarer</text>
  <text class="nz-t nz-e8" x="766" y="128" text-anchor="middle">Médecins, avocats</text>
  <text class="nz-t nz-e8" x="766" y="148" text-anchor="middle">Prénom Israël ou</text>
  <text class="nz-t nz-e8" x="766" y="168" text-anchor="middle">Sarah imposé</text>
  <text class="nz-t nz-e8" x="766" y="188" text-anchor="middle">Passeport marqué J</text>
  <text class="nz-t nz-e8" x="766" y="208" text-anchor="middle">Entreprises fermées</text>
  <text class="nz-t nz-e8" x="766" y="228" text-anchor="middle">Écoles publiques</text>
  <text class="nz-t nz-e8" x="766" y="248" text-anchor="middle">Liberté de mouvement</text>

  <rect x="884" y="40" width="196" height="250" rx="6" fill="var(--bloc-pale)"/>
  <text class="nz-t nz-d" x="982" y="76" text-anchor="middle">1939</text>
  <text class="nz-t nz-e" x="982" y="108" text-anchor="middle">Vente de billets de</text>
  <text class="nz-t nz-e" x="982" y="128" text-anchor="middle">loterie interdite</text>
</svg>
