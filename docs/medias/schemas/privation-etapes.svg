<svg viewBox="0 0 1100 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Les cinq étapes de la privation des droits en Allemagne, de l'exclusion de 1933 à l'extermination à partir de 1941">
  <style>
    .nz-t { font-family: Archivo, sans-serif; }
    .nz-d { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; fill: var(--bloc-pale-texte); }
    .nz-e { font-size: 13px; fill: var(--bloc-pale-texte); }
    .nz-d5 { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; fill: var(--surface); }
    .nz-e5 { font-size: 13px; fill: var(--surface); }
    .nz-l { stroke: var(--schema-trait); stroke-width: 2; fill: none; }
  </style>

  <rect x="20" y="60" width="190" height="150" rx="6" fill="var(--bloc-pale)"/>
  <text class="nz-t nz-d" x="115" y="96" text-anchor="middle">1933</text>
  <text class="nz-t nz-e" x="115" y="126" text-anchor="middle">Exclusion de la</text>
  <text class="nz-t nz-e" x="115" y="146" text-anchor="middle">fonction publique</text>
  <text class="nz-t nz-e" x="115" y="166" text-anchor="middle">et boycottage des</text>
  <text class="nz-t nz-e" x="115" y="186" text-anchor="middle">commerces.</text>

  <rect x="238" y="60" width="190" height="150" rx="6" fill="var(--bloc-pale)"/>
  <text class="nz-t nz-d" x="333" y="96" text-anchor="middle">1935</text>
  <text class="nz-t nz-e" x="333" y="126" text-anchor="middle">Perte de la</text>
  <text class="nz-t nz-e" x="333" y="146" text-anchor="middle">citoyenneté par les</text>
  <text class="nz-t nz-e" x="333" y="166" text-anchor="middle">lois de Nuremberg.</text>

  <rect x="456" y="60" width="190" height="150" rx="6" fill="var(--bloc-pale)"/>
  <text class="nz-t nz-d" x="551" y="96" text-anchor="middle">1938</text>
  <text class="nz-t nz-e" x="551" y="126" text-anchor="middle">Violences de la</text>
  <text class="nz-t nz-e" x="551" y="146" text-anchor="middle">Nuit de Cristal et</text>
  <text class="nz-t nz-e" x="551" y="166" text-anchor="middle">confiscation des</text>
  <text class="nz-t nz-e" x="551" y="186" text-anchor="middle">biens.</text>

  <rect x="674" y="60" width="190" height="150" rx="6" fill="var(--bloc-pale)"/>
  <text class="nz-t nz-d" x="769" y="96" text-anchor="middle">1940</text>
  <text class="nz-t nz-e" x="769" y="126" text-anchor="middle">Enfermement dans</text>
  <text class="nz-t nz-e" x="769" y="146" text-anchor="middle">les ghettos, dont</text>
  <text class="nz-t nz-e" x="769" y="166" text-anchor="middle">celui de Varsovie.</text>

  <rect x="892" y="60" width="190" height="150" rx="6" fill="var(--schema-accent)"/>
  <text class="nz-t nz-d5" x="987" y="96" text-anchor="middle">1941</text>
  <text class="nz-t nz-e5" x="987" y="126" text-anchor="middle">Fusillades de masse</text>
  <text class="nz-t nz-e5" x="987" y="146" text-anchor="middle">puis camps</text>
  <text class="nz-t nz-e5" x="987" y="166" text-anchor="middle">d'extermination.</text>

  <path class="nz-l" d="M 210 135 L 226 135"/>
  <path d="M 226 127 L 238 135 L 226 143 Z" fill="var(--schema-trait)"/>
  <path class="nz-l" d="M 428 135 L 444 135"/>
  <path d="M 444 127 L 456 135 L 444 143 Z" fill="var(--schema-trait)"/>
  <path class="nz-l" d="M 646 135 L 662 135"/>
  <path d="M 662 127 L 674 135 L 662 143 Z" fill="var(--schema-trait)"/>
  <path class="nz-l" d="M 864 135 L 880 135"/>
  <path d="M 880 127 L 892 135 L 880 143 Z" fill="var(--schema-trait)"/>
</svg>
