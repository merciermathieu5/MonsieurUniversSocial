    cycle: Premier cycle du secondaire
    couleur: histoire
    unite: réalité sociale
    parcours_titre: Réalités sociales
    documents:
      - titre: Programme d'études
        url: https://cdn-contenu.quebec.ca/cdn-contenu/education/pfeq/secondaire/programmes/PFEQ-histoire-education-citoyennete-secondaire.pdf
      - titre: Progression des apprentissages
        url: https://cdn-contenu.quebec.ca/cdn-contenu/education/pfeq/secondaire/progressions-apprentissages/PFEQ-progression-apprentissages-histoire-education-citoyennete-secondaire.pdf
      - titre: Cadre d'évaluation des apprentissages
        url: https://cdn-contenu.quebec.ca/cdn-contenu/education/pfeq/cadres-evaluation/secondaire/francais/PFEQ-cadre-evaluation-histoire-education-citoyennete.pdf
