titre: Monsieur Univers social
sous_titre: Site pédagogique de Mathieu Mercier
description: >-
  Ressources d'histoire et de géographie pour le premier cycle du secondaire,
  au Centre de services scolaire de Kamouraska - Rivière-du-Loup.
url: https://merciermathieu5.github.io/muniverssocial
courriel: mmercier@csskamloup.gouv.qc.ca

# Le dossier de sortie. Il est régénéré à chaque construction.
sortie: docs

sections:
  histoire:
    titre: Histoire et éducation à la citoyenneté
    court: Histoire
    cycle: Premier cycle du secondaire
    couleur: histoire
    intro: >-
      Les douze réalités sociales du programme, de la sédentarisation au
      Néolithique jusqu'à la reconnaissance des libertés et des droits civils.
    # Sert à grouper les fiches sur la page d'index.
    groupes:
      - cle: antiquite
        titre: Des premières sociétés à l'Antiquité
      - cle: moyen-age
        titre: Le Moyen Âge et la Renaissance
      - cle: moderne
        titre: Le monde moderne et contemporain
      - cle: outils
        titre: Pour commencer

  geographie:
    titre: Géographie et éducation à la citoyenneté
    court: Géographie
    cycle: Premier cycle du secondaire
    couleur: geographie
    intro: >-
      Les types de territoires du programme, étudiés à partir de cas concrets
      d'ici et d'ailleurs.
    groupes:
      - cle: outils
        titre: Pour commencer
      - cle: urbain
        titre: Territoire urbain
      - cle: region
        titre: Territoire région
      - cle: agricole
        titre: Territoire agricole
      - cle: autochtone
        titre: Territoire autochtone
      - cle: protege
        titre: Territoire protégé
