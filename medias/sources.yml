# Registre des illustrations.
#
# Deux façons de désigner une image :
#   commons    le nom exact du fichier, si tu le connais
#   recherche  une description en clair, et le script trouve le fichier
#
# Les champs titre, auteur, licence et lien sont remplis automatiquement à
# partir de Commons. Ne les écris pas à la main, ce sont eux qui composent le
# crédit affiché sous l'image.
#
#   python outils\images.py
#   python outils\images.py --chercher "neolithic sickle"

# --- Situer -----------------------------------------------------------------

croissant-fertile.png:
  cadrage: large
  fiche: 01-sedentarisation
  commons: "File:Croissant fertile carte.png"
  recherche: "fertile crescent map"
  role: "Situer la région sur une carte en français."

sites-neolithiques.jpg:
  cadrage: large
  fiche: 01-sedentarisation
  commons: "File:Siti neolitici del Vicino Oriente.jpg"
  recherche: "neolithic sites near east map"
  role: "Localiser Mureybet, Mallaha et Çatal Höyük les uns par rapport aux autres."

