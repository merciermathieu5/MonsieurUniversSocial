# Registre des illustrations.
#
# Chaque entrée fait le lien entre un fichier local et sa source. Les champs
# auteur, licence et lien sont remplis automatiquement par outils/images.py à
# partir de l'API de Wikimedia Commons. Ne les remplis pas à la main : ils
# doivent refléter exactement ce que dit la page source, c'est ce qui rend
# l'attribution valable.
#
# Pour ajouter une image :
#   1. trouve son fichier sur commons.wikimedia.org
#   2. ajoute une entrée ici avec le nom exact « File:... »
#   3. lance python3 outils/images.py
#   4. réfère l'image dans la fiche : ![Légende](../medias/<fiche>/<fichier>)

