<svg viewBox="0 0 1100 352" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Ligne du temps de la christianisation de l'Occident, de la naissance du christianisme au Ier siècle à la fin traditionnelle du Moyen Âge en 1492">
  <style>
    .ch-t { font-family: Archivo, sans-serif; }
    .ch-e { font-size: 13.5px; fill: var(--encre); }
    .ch-d { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; fill: var(--schema-accent); }
    .ch-p1 { font-size: 14px; font-weight: 600; fill: var(--bloc-pale-texte); }
    .ch-p2 { font-size: 14px; font-weight: 600; fill: var(--surface); }
  </style>
  <rect x="70" y="178" width="306.3" height="34" fill="var(--bloc-pale)"/>
  <rect x="376.3" y="178" width="653.7" height="34" fill="var(--schema-accent)"/>
  <text class="ch-t ch-p1" x="223" y="200" text-anchor="middle">Antiquité romaine</text>
  <text class="ch-t ch-p2" x="703" y="200" text-anchor="middle">Le Moyen Âge</text>
  <line x1="89.3" y1="164" x2="89.3" y2="170" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="ch-t ch-d" x="8" y="96">Ier siècle</text>
  <text class="ch-t ch-e" x="8" y="117">Jésus de Nazareth vit en</text>
  <text class="ch-t ch-e" x="8" y="138">Palestine : le christianisme</text>
  <text class="ch-t ch-e" x="8" y="159">naît de son enseignement.</text>
  <circle cx="89.3" cy="178" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
  <line x1="271.4" y1="220" x2="271.4" y2="226" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <line x1="314.5" y1="220" x2="314.5" y2="226" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="ch-t ch-d" x="293" y="248" text-anchor="middle">313 et 380</text>
  <text class="ch-t ch-e" x="293" y="269" text-anchor="middle">Les édits de Milan puis de</text>
  <text class="ch-t ch-e" x="293" y="290" text-anchor="middle">Thessalonique : le christianisme</text>
  <text class="ch-t ch-e" x="293" y="311" text-anchor="middle">est toléré, puis devient officiel.</text>
  <circle cx="271.4" cy="212" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
  <circle cx="314.5" cy="212" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
  <line x1="383" y1="164" x2="383" y2="170" stroke="var(--schema-accent)" stroke-width="2.5"/>
  <text class="ch-t ch-d" x="383" y="96" text-anchor="middle">476 et vers 498</text>
  <text class="ch-t ch-e" x="383" y="117" text-anchor="middle">L'Empire d'Occident tombe;</text>
  <text class="ch-t ch-e" x="383" y="138" text-anchor="middle">vers 498, Clovis, roi des</text>
  <text class="ch-t ch-e" x="383" y="159" text-anchor="middle">Francs, se fait baptiser.</text>
  <circle cx="376.3" cy="178" r="5.5" fill="var(--schema-accent)" stroke="var(--surface)" stroke-width="2"/>
  <circle cx="390.4" cy="178" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
  <line x1="774.5" y1="220" x2="774.5" y2="226" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="ch-t ch-d" x="762" y="248" text-anchor="middle">1095</text>
  <text class="ch-t ch-e" x="762" y="269" text-anchor="middle">Le pape Urbain II</text>
  <text class="ch-t ch-e" x="762" y="290" text-anchor="middle">lance l'appel à la</text>
  <text class="ch-t ch-e" x="762" y="311" text-anchor="middle">première croisade.</text>
  <circle cx="774.5" cy="212" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
  <line x1="818.3" y1="164" x2="818.3" y2="170" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <line x1="838.3" y1="164" x2="838.3" y2="170" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="ch-t ch-d" x="828" y="96" text-anchor="middle">1163 et 1194</text>
  <text class="ch-t ch-e" x="828" y="117" text-anchor="middle">Les chantiers des grandes</text>
  <text class="ch-t ch-e" x="828" y="138" text-anchor="middle">cathédrales gothiques, Paris</text>
  <text class="ch-t ch-e" x="828" y="159" text-anchor="middle">et Chartres, s'ouvrent.</text>
  <circle cx="818.3" cy="178" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
  <circle cx="838.3" cy="178" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
  <line x1="1030" y1="220" x2="1030" y2="226" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="ch-t ch-d" x="1092" y="248" text-anchor="end">1492</text>
  <text class="ch-t ch-e" x="1092" y="269" text-anchor="end">La découverte de l'Amérique</text>
  <text class="ch-t ch-e" x="1092" y="290" text-anchor="end">marque la fin traditionnelle</text>
  <text class="ch-t ch-e" x="1092" y="311" text-anchor="end">du Moyen Âge.</text>
  <circle cx="1030" cy="212" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
</svg>
