<svg viewBox="0 0 1100 482" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Les grands événements du cinquième siècle athénien, des guerres médiques à la capitulation devant Sparte">
  <style>
    .cs-t { font-family: Archivo, sans-serif; }
    .cs-n { font-size: 15px; font-weight: 700; fill: var(--encre); }
    .cs-s { font-size: 13px; fill: var(--schema-cle); }
    .cs-d { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 600; fill: var(--schema-accent); }
  </style>
  <line x1="300.0" y1="32" x2="300.0" y2="438" stroke="var(--schema-trait)" stroke-width="1.2"/>
  <text class="cs-t cs-d" x="300.0" y="464" text-anchor="middle">-500</text>
  <line x1="680.0" y1="32" x2="680.0" y2="438" stroke="var(--schema-trait)" stroke-width="1.2"/>
  <text class="cs-t cs-d" x="680.0" y="464" text-anchor="middle">-450</text>
  <line x1="1060.0" y1="32" x2="1060.0" y2="438" stroke="var(--schema-trait)" stroke-width="1.2"/>
  <text class="cs-t cs-d" x="1060.0" y="464" text-anchor="middle">-400</text>
  <line x1="300" y1="438" x2="1060" y2="438" stroke="var(--bloc)" stroke-width="3"/>
  <text class="cs-t cs-n" x="272" y="64" text-anchor="end">Première guerre médique</text>
  <text class="cs-t cs-s" x="272" y="84" text-anchor="end">La victoire de Marathon.</text>
  <circle cx="376.0" cy="66" r="7" fill="var(--schema-accent)" stroke="var(--surface)" stroke-width="2"/>
  <text class="cs-t cs-d" x="392.0" y="71">-490</text>
  <text class="cs-t cs-n" x="272" y="118" text-anchor="end">Deuxième guerre médique</text>
  <text class="cs-t cs-s" x="272" y="138" text-anchor="end">Thermopyles, Salamine et Platées.</text>
  <rect x="452.0" y="106" width="7.6" height="28" rx="5" fill="var(--bloc-pale)"/>
  <text class="cs-t cs-d" x="473.6" y="125">-480 et -479</text>
  <text class="cs-t cs-n" x="272" y="172" text-anchor="end">L'âge d'or d'Athènes</text>
  <text class="cs-t cs-s" x="272" y="192" text-anchor="end">Périclès dirige la cité.</text>
  <rect x="596.4" y="160" width="243.2" height="28" rx="5" fill="var(--bloc)"/>
  <text class="cs-t cs-d" x="718.0" y="179" text-anchor="middle" fill="var(--bloc-texte)">-461 à -429</text>
  <text class="cs-t cs-n" x="272" y="226" text-anchor="end">Le trésor de la ligue de Délos</text>
  <text class="cs-t cs-s" x="272" y="246" text-anchor="end">Il est transféré à Athènes.</text>
  <circle cx="649.6" cy="228" r="7" fill="var(--schema-accent)" stroke="var(--surface)" stroke-width="2"/>
  <text class="cs-t cs-d" x="665.6" y="233">-454</text>
  <text class="cs-t cs-n" x="272" y="280" text-anchor="end">La construction du Parthénon</text>
  <text class="cs-t cs-s" x="272" y="300" text-anchor="end">Le grand chantier de l'Acropole.</text>
  <rect x="702.8" y="268" width="114.0" height="28" rx="5" fill="var(--bloc-pale)"/>
  <text class="cs-t cs-d" x="830.8" y="287">-447 à -432</text>
  <text class="cs-t cs-n" x="272" y="334" text-anchor="end">La guerre du Péloponnèse</text>
  <text class="cs-t cs-s" x="272" y="354" text-anchor="end">Athènes capitule devant Sparte.</text>
  <rect x="824.4" y="322" width="205.2" height="28" rx="5" fill="var(--bloc-pale)"/>
  <text class="cs-t cs-d" x="927.0" y="341" text-anchor="middle" fill="var(--bloc-pale-texte)">-431 à -404</text>
  <text class="cs-t cs-n" x="272" y="388" text-anchor="end">La peste d'Athènes</text>
  <text class="cs-t cs-s" x="272" y="408" text-anchor="end">Périclès en meurt en -429.</text>
  <circle cx="832.0" cy="390" r="7" fill="var(--schema-accent)" stroke="var(--surface)" stroke-width="2"/>
  <text class="cs-t cs-d" x="848.0" y="395">-430</text>
</svg>
