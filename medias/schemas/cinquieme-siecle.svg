<svg viewBox="0 0 1100 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Ligne du temps du cinquième siècle athénien : guerres médiques, âge d'or de Périclès, chantier du Parthénon, guerre du Péloponnèse et peste d'Athènes">
  <style>
    .cq-t { font-family: Archivo, sans-serif; }
    .cq-e { font-size: 13.5px; fill: var(--encre); }
    .cq-b { font-size: 14.5px; font-weight: 700; }
    .cq-p { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; }
    .cq-d { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; fill: var(--schema-accent); }
  </style>
  <rect x="70" y="175" width="960" height="40" rx="8" fill="var(--bloc-pale)" opacity=".3"/>
  <rect x="444.4" y="175" width="288.0" height="40" fill="var(--bloc)"/>
  <text class="cq-t cq-b" x="588.4" y="191" text-anchor="middle" fill="var(--bloc-texte)">L'âge d'or d'Athènes</text>
  <text class="cq-t cq-p" x="588.4" y="207" text-anchor="middle" fill="var(--bloc-texte)">-461 à -429</text>
  <rect x="732.4" y="175" width="259.2" height="40" rx="8" fill="var(--bloc-pale)"/>
  <text class="cq-t cq-b" x="862.0" y="191" text-anchor="middle" fill="var(--bloc-pale-texte)">La guerre du Péloponnèse</text>
  <text class="cq-t cq-p" x="862.0" y="207" text-anchor="middle" fill="var(--bloc-pale-texte)">-431 à -404</text>
  <text class="cq-t cq-d" x="8" y="200">-500</text>
  <text class="cq-t cq-d" x="1092" y="200" text-anchor="end">-400</text>
  <line x1="166.0" y1="157" x2="166.0" y2="167.5" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="cq-t cq-d" x="166.0" y="103" text-anchor="middle">-490</text>
  <text class="cq-t cq-e" x="166.0" y="124" text-anchor="middle">Première guerre médique :</text>
  <text class="cq-t cq-e" x="166.0" y="143" text-anchor="middle">victoire athénienne à Marathon.</text>
  <circle cx="166.0" cy="173" r="5.5" fill="var(--schema-accent)" stroke="var(--surface)" stroke-width="2"/>
  <line x1="262.0" y1="222.5" x2="262.0" y2="233" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="cq-t cq-d" x="262.0" y="255" text-anchor="middle">-480 et -479</text>
  <text class="cq-t cq-e" x="262.0" y="276" text-anchor="middle">Deuxième guerre médique :</text>
  <text class="cq-t cq-e" x="262.0" y="295" text-anchor="middle">Thermopyles, Salamine et Platées.</text>
  <circle cx="262.0" cy="217" r="5.5" fill="var(--schema-accent)" stroke="var(--surface)" stroke-width="2"/>
  <line x1="511.6" y1="157" x2="511.6" y2="167.5" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="cq-t cq-d" x="511.6" y="103" text-anchor="middle">-454</text>
  <text class="cq-t cq-e" x="511.6" y="124" text-anchor="middle">Le trésor de la ligue de</text>
  <text class="cq-t cq-e" x="511.6" y="143" text-anchor="middle">Délos arrive à Athènes.</text>
  <circle cx="511.6" cy="173" r="5.5" fill="var(--schema-accent)" stroke="var(--surface)" stroke-width="2"/>
  <line x1="578.8" y1="222.5" x2="578.8" y2="233" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="cq-t cq-d" x="578.8" y="255" text-anchor="middle">vers -447</text>
  <text class="cq-t cq-e" x="578.8" y="276" text-anchor="middle">Le grand chantier du</text>
  <text class="cq-t cq-e" x="578.8" y="295" text-anchor="middle">Parthénon commence.</text>
  <circle cx="578.8" cy="217" r="5.5" fill="var(--schema-accent)" stroke="var(--surface)" stroke-width="2"/>
  <line x1="742.0" y1="157" x2="742.0" y2="167.5" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="cq-t cq-d" x="742.0" y="103" text-anchor="middle">-430</text>
  <text class="cq-t cq-e" x="742.0" y="124" text-anchor="middle">La peste frappe Athènes.</text>
  <text class="cq-t cq-e" x="742.0" y="143" text-anchor="middle">Périclès en meurt en -429.</text>
  <circle cx="742.0" cy="173" r="5.5" fill="var(--schema-accent)" stroke="var(--surface)" stroke-width="2"/>
</svg>
