<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Comparaison entre le mode de vie nomade et le mode de vie sédentaire">
  <style>
    .t { font-family: Archivo, sans-serif; }
    .col { font-size: 22px; font-weight: 700; fill: #fff; }
    .cle { font-size: 14px; font-family: 'IBM Plex Mono', monospace; fill: var(--encre-pale); }
    .v { font-size: 17px; fill: var(--encre); }
  </style>
  <rect x="250" y="10" width="315" height="46" rx="4" fill="var(--encre-doux)"/>
  <rect x="580" y="10" width="315" height="46" rx="4" fill="var(--matiere)"/>
  <text class="t col" x="270" y="42">Nomade</text>
  <text class="t col" x="600" y="42">Sédentaire</text>
  <g>
    <text class="t cle" x="10" y="100">HABITATION</text>
    <text class="t v" x="270" y="100">abri temporaire, peaux</text>
    <text class="t v" x="600" y="100">maison de brique crue</text>
    <line x1="10" y1="118" x2="890" y2="118" stroke="var(--trait)"/>
    <text class="t cle" x="10" y="158">NOURRITURE</text>
    <text class="t v" x="270" y="158">chasse, pêche, cueillette</text>
    <text class="t v" x="600" y="158">agriculture, élevage</text>
    <line x1="10" y1="176" x2="890" y2="176" stroke="var(--trait)"/>
    <text class="t cle" x="10" y="216">RÉSERVES</text>
    <text class="t v" x="270" y="216">aucune, on suit les saisons</text>
    <text class="t v" x="600" y="216">surplus entreposés</text>
    <line x1="10" y1="234" x2="890" y2="234" stroke="var(--trait)"/>
    <text class="t cle" x="10" y="274">TRAVAIL</text>
    <text class="t v" x="270" y="274">tous cherchent à manger</text>
    <text class="t v" x="600" y="274">métiers spécialisés</text>
    <line x1="10" y1="292" x2="890" y2="292" stroke="var(--trait)"/>
    <text class="t cle" x="10" y="332">DÉCISIONS</text>
    <text class="t v" x="270" y="332">prises en groupe</text>
    <text class="t v" x="600" y="332">des chefs décident</text>
    <line x1="10" y1="350" x2="890" y2="350" stroke="var(--trait)"/>
    <text class="t cle" x="10" y="390">GROUPE</text>
    <text class="t v" x="270" y="390">quelques familles</text>
    <text class="t v" x="600" y="390">plusieurs milliers</text>
  </g>
</svg>
