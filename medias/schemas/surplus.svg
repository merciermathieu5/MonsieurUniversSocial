<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Du surplus alimentaire à la hiérarchie sociale">
  <style>
    .t { font-family: Archivo, sans-serif; }
    .b { font-size: 18px; font-weight: 600; fill: #fff; }
    .l { font-size: 15px; fill: var(--encre-doux); font-family: Archivo, sans-serif; }
    .f { fill: var(--matiere); }
  </style>
  <rect class="f" x="8" y="20" width="196" height="60" rx="4"/>
  <text class="t b" x="106" y="47" text-anchor="middle">Agriculture</text>
  <text class="t b" x="106" y="69" text-anchor="middle">et élevage</text>
  <path d="M212 50 h48 l-10 -9 M260 50 l-10 9" stroke="var(--matiere)" stroke-width="2.5" fill="none"/>
  <rect class="f" x="268" y="20" width="196" height="60" rx="4"/>
  <text class="t b" x="366" y="57" text-anchor="middle">Surplus</text>
  <path d="M472 50 h48 l-10 -9 M520 50 l-10 9" stroke="var(--matiere)" stroke-width="2.5" fill="none"/>
  <rect class="f" x="528" y="20" width="240" height="60" rx="4"/>
  <text class="t b" x="648" y="47" text-anchor="middle">Des bras libérés</text>
  <text class="t b" x="648" y="69" text-anchor="middle">de la recherche de nourriture</text>
  <path d="M648 88 v42" stroke="var(--matiere)" stroke-width="2.5" fill="none"/>
  <path d="M648 130 h-420 M648 130 h180" stroke="var(--matiere)" stroke-width="2.5" fill="none"/>
  <path d="M228 130 v34 l-9 -10 M228 164 l9 -10" stroke="var(--matiere)" stroke-width="2.5" fill="none"/>
  <path d="M648 130 v34 l-9 -10 M648 164 l9 -10" stroke="var(--matiere)" stroke-width="2.5" fill="none"/>
  <path d="M828 130 v34 l-9 -10 M828 164 l9 -10" stroke="var(--matiere)" stroke-width="2.5" fill="none"/>
  <rect x="108" y="172" width="240" height="54" rx="4" fill="var(--matiere)" opacity=".8"/>
  <text class="t b" x="228" y="205" text-anchor="middle">Artisans</text>
  <rect x="528" y="172" width="240" height="54" rx="4" fill="var(--matiere)" opacity=".8"/>
  <text class="t b" x="648" y="205" text-anchor="middle">Commerce et troc</text>
  <rect x="778" y="172" width="114" height="54" rx="4" fill="var(--matiere)" opacity=".8"/>
  <text class="t b" x="835" y="205" text-anchor="middle">Chefs</text>
  <text class="t l" x="108" y="252">potier, vannier, tisserand</text>
  <text class="t l" x="528" y="252">entre villages voisins</text>
  <text class="t l" x="778" y="252">hiérarchie</text>
  <text class="t l" x="8" y="290" font-size="14" fill="var(--encre-pale)">Une seule cause, trois conséquences : c'est le surplus qui rend tout le reste possible.</text>
</svg>
