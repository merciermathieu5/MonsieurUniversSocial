<svg viewBox="0 0 1100 380" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Ligne du temps de l'impérialisme en Afrique, de l'indépendance de l'Amérique latine en 1825 à l'entrée en guerre de 1914">
  <style>
    .im-t { font-family: Archivo, sans-serif; }
    .im-e { font-size: 13.5px; fill: var(--encre); }
    .im-d { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; fill: var(--schema-accent); }
    .im-p { font-size: 14px; font-weight: 700; fill: var(--surface); }
    .im-l { stroke: var(--schema-trait); stroke-width: 1.5; fill: none; }
  </style>
  <rect x="70" y="190" width="960" height="34" fill="var(--schema-accent)"/>
  <text class="im-t im-p" x="550" y="212" text-anchor="middle">L'Époque contemporaine</text>

  <path class="im-l" d="M 118 190 L 118 168"/>
  <text class="im-t im-d" x="118" y="102" text-anchor="middle">1825</text>
  <text class="im-t im-e" x="118" y="123" text-anchor="middle">L'Amérique latine</text>
  <text class="im-t im-e" x="118" y="144" text-anchor="middle">devient indépendante.</text>
  <circle cx="118" cy="190" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="im-l" d="M 406 190 L 406 168"/>
  <text class="im-t im-d" x="406" y="102" text-anchor="middle">1871</text>
  <text class="im-t im-e" x="406" y="123" text-anchor="middle">Stanley retrouve</text>
  <text class="im-t im-e" x="406" y="144" text-anchor="middle">Livingstone à Ujiji.</text>
  <circle cx="406" cy="190" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="im-l" d="M 694 190 L 694 168"/>
  <text class="im-t im-d" x="694" y="102" text-anchor="middle">1895</text>
  <text class="im-t im-e" x="694" y="123" text-anchor="middle">Le caoutchouc du</text>
  <text class="im-t im-e" x="694" y="144" text-anchor="middle">Congo est exploité.</text>
  <circle cx="694" cy="190" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="im-l" d="M 982 190 L 982 178 L 1006 160"/>
  <text class="im-t im-d" x="1030" y="102" text-anchor="end">1914</text>
  <text class="im-t im-e" x="1030" y="123" text-anchor="end">La guerre éclate.</text>
  <text class="im-t im-e" x="1030" y="144" text-anchor="end">Les colonies fournissent.</text>
  <circle cx="982" cy="190" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="im-l" d="M 262 224 L 262 246"/>
  <text class="im-t im-d" x="262" y="278" text-anchor="middle">1850</text>
  <text class="im-t im-e" x="262" y="299" text-anchor="middle">Les explorations</text>
  <text class="im-t im-e" x="262" y="320" text-anchor="middle">se multiplient.</text>
  <circle cx="262" cy="224" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="im-l" d="M 550 224 L 550 246"/>
  <text class="im-t im-d" x="550" y="278" text-anchor="middle">1885</text>
  <text class="im-t im-e" x="550" y="299" text-anchor="middle">La conférence de Berlin</text>
  <text class="im-t im-e" x="550" y="320" text-anchor="middle">fixe les règles du partage.</text>
  <circle cx="550" cy="224" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="im-l" d="M 838 224 L 838 246"/>
  <text class="im-t im-d" x="838" y="278" text-anchor="middle">1904</text>
  <text class="im-t im-e" x="838" y="299" text-anchor="middle">Les Héréros se</text>
  <text class="im-t im-e" x="838" y="320" text-anchor="middle">soulèvent en Namibie.</text>
  <circle cx="838" cy="224" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
</svg>
