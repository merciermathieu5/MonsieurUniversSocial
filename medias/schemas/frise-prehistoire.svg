<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Les deux périodes de la préhistoire, le moment de la sédentarisation et les moyens de subsistance de chaque période">
  <style>
    .fp-t { font-family: Archivo, sans-serif; }
    .fp-nom { font-size: 24px; font-weight: 700; }
    .fp-sur { font-size: 16px; font-weight: 600; }
    .fp-cle { font-size: 14px; font-weight: 600; fill: var(--schema-cle); }
    .fp-v { font-size: 14px; fill: var(--encre); }
    .fp-date { font-family: 'IBM Plex Mono', monospace; font-size: 14px; fill: var(--schema-cle); }
  </style>
  <rect x="8" y="46" width="574" height="60" rx="4" fill="var(--bloc-pale)"/>
  <rect x="590" y="46" width="302" height="60" rx="4" fill="var(--bloc)"/>
  <text class="fp-t fp-nom" x="34" y="84" fill="var(--bloc-pale-texte)">Le Paléolithique</text>
  <text class="fp-t fp-nom" x="616" y="84" fill="var(--bloc-texte)">Le Néolithique</text>
  <line x1="586" y1="28" x2="586" y2="118" stroke="var(--schema-accent)" stroke-width="3"/>
  <text class="fp-t fp-sur" x="586" y="20" text-anchor="middle" fill="var(--schema-accent)">La sédentarisation</text>
  <text class="fp-t fp-date" x="8" y="132">-3 000 000</text>
  <text class="fp-t fp-date" x="586" y="132" text-anchor="middle">-10 000</text>
  <text class="fp-t fp-date" x="892" y="132" text-anchor="end">-3 500</text>
  <text class="fp-t fp-sur" x="34" y="168" fill="var(--encre)">Un mode de vie nomade</text>
  <text class="fp-t fp-sur" x="616" y="168" fill="var(--encre)">Un mode de vie sédentaire</text>
  <text class="fp-t fp-cle" x="34" y="200">Moyens de subsistance :</text>
  <text class="fp-t fp-v" x="34" y="222">Chasse, pêche et cueillette.</text>
  <text class="fp-t fp-cle" x="616" y="200">Moyens de subsistance :</text>
  <text class="fp-t fp-v" x="616" y="222">Agriculture, élevage, chasse,</text>
  <text class="fp-t fp-v" x="616" y="244">pêche et cueillette.</text>
  <text class="fp-t fp-v" x="34" y="244">Le groupe se déplace au fil des saisons.</text>
  <text class="fp-t fp-v" x="616" y="266">Le village reste au même endroit.</text>
</svg>
