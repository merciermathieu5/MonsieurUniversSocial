<svg viewBox="0 0 1100 440" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Le commerce triangulaire entre l'Europe, l'Afrique et l'Amérique, avec les marchandises échangées sur chacun des trois trajets">
  <style>
    .tg-t { font-family: Archivo, sans-serif; }
    .tg-n { font-size: 15px; font-weight: 700; fill: var(--surface); }
    .tg-nb { font-size: 15px; font-weight: 700; fill: var(--bloc-texte); }
    .tg-m { font-size: 13px; fill: var(--encre); }
    .tg-c { font-size: 12.5px; font-weight: 600; fill: var(--surface); }
    .tg-cb { font-size: 12.5px; font-weight: 600; fill: var(--bloc-texte); }
    .tg-f { stroke: var(--schema-trait); stroke-width: 2.5; fill: none; }
    .tg-p { fill: var(--schema-trait); }
  </style>
  <rect x="390" y="40" width="320" height="56" rx="6" fill="var(--schema-accent)"/>
  <text class="tg-t tg-n" x="550" y="66" text-anchor="middle">L'Europe</text>
  <text class="tg-t tg-c" x="550" y="86" text-anchor="middle">La métropole, seule à faire des profits</text>
  <rect x="760" y="286" width="290" height="56" rx="6" fill="var(--bloc)"/>
  <text class="tg-t tg-nb" x="905" y="312" text-anchor="middle">L'Afrique</text>
  <text class="tg-t tg-cb" x="905" y="332" text-anchor="middle">Les côtes de la traite</text>
  <rect x="50" y="286" width="290" height="56" rx="6" fill="var(--bloc)"/>
  <text class="tg-t tg-nb" x="195" y="312" text-anchor="middle">L'Amérique</text>
  <text class="tg-t tg-cb" x="195" y="332" text-anchor="middle">Les colonies et leurs plantations</text>
  <line class="tg-f" x1="700" y1="104" x2="852" y2="278"/>
  <polygon class="tg-p" points="860,286 846,282 856,272"/>
  <text class="tg-t tg-m" x="800" y="170" text-anchor="start">Des armes, des tissus</text>
  <text class="tg-t tg-m" x="800" y="190" text-anchor="start">et de l'alcool</text>
  <line class="tg-f" x1="752" y1="314" x2="356" y2="314"/>
  <polygon class="tg-p" points="346,314 358,308 358,320"/>
  <text class="tg-t tg-m" x="550" y="378" text-anchor="middle">Des personnes réduites en esclavage,</text>
  <text class="tg-t tg-m" x="550" y="398" text-anchor="middle">entassées dans les cales des navires négriers</text>
  <line class="tg-f" x1="248" y1="278" x2="400" y2="104"/>
  <polygon class="tg-p" points="408,96 402,110 392,100"/>
  <text class="tg-t tg-m" x="300" y="170" text-anchor="end">Du sucre, du tabac, du</text>
  <text class="tg-t tg-m" x="300" y="190" text-anchor="end">rhum, du café, des métaux</text>
</svg>
