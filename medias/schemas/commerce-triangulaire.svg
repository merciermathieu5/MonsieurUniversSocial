<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Le commerce triangulaire : l'Europe envoie des produits manufacturés en Afrique, l'Afrique fournit des personnes réduites en esclavage à l'Amérique, et l'Amérique renvoie des matières premières à l'Europe, seule à encaisser les profits">
  <style>
    .tg-t { font-family: Archivo, sans-serif; }
    .tg-nom { font-size: 17px; font-weight: 700; }
    .tg-role { font-size: 12.5px; font-weight: 600; }
    .tg-etape { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 600; letter-spacing: .08em; fill: var(--schema-accent); }
    .tg-bien { font-size: 13.5px; fill: var(--encre); }
    .tg-note { font-size: 12.5px; fill: var(--encre-doux); }
    .tg-fl { fill: none; stroke-width: 3.5; stroke-linecap: round; }
  </style>

  <path class="tg-fl" d="M 690 132 Q 800 190 856 268" stroke="var(--schema-accent)"/>
  <polygon points="862,282 848,272 862,264" fill="var(--schema-accent)"/>
  <path class="tg-fl" d="M 800 356 Q 550 424 300 356" stroke="var(--bloc)"/>
  <polygon points="286,350 302,346 298,362" fill="var(--bloc)"/>
  <path class="tg-fl" d="M 244 268 Q 300 190 410 132" stroke="var(--schema-cle)"/>
  <polygon points="424,124 414,138 406,124" fill="var(--schema-cle)"/>

  <rect x="370" y="56" width="360" height="76" rx="8" fill="var(--schema-accent)"/>
  <text class="tg-t tg-nom" x="550" y="88" text-anchor="middle" fill="var(--surface)">L'Europe</text>
  <text class="tg-t tg-role" x="550" y="112" text-anchor="middle" fill="var(--surface)">La métropole, seule à encaisser les profits</text>

  <rect x="770" y="282" width="290" height="76" rx="8" fill="var(--bloc)"/>
  <text class="tg-t tg-nom" x="915" y="314" text-anchor="middle" fill="var(--bloc-texte)">L'Afrique</text>
  <text class="tg-t tg-role" x="915" y="338" text-anchor="middle" fill="var(--bloc-texte)">Les comptoirs de la traite</text>

  <rect x="40" y="282" width="290" height="76" rx="8" fill="var(--bloc)"/>
  <text class="tg-t tg-nom" x="185" y="314" text-anchor="middle" fill="var(--bloc-texte)">L'Amérique</text>
  <text class="tg-t tg-role" x="185" y="338" text-anchor="middle" fill="var(--bloc-texte)">Les colonies et leurs plantations</text>

  <text class="tg-t tg-etape" x="810" y="176" text-anchor="start">1RE ÉTAPE</text>
  <text class="tg-t tg-bien" x="810" y="198" text-anchor="start">Des armes, des tissus</text>
  <text class="tg-t tg-bien" x="810" y="218" text-anchor="start">et de l'alcool</text>

  <text class="tg-t tg-etape" x="550" y="432" text-anchor="middle">2E ÉTAPE</text>
  <text class="tg-t tg-bien" x="550" y="454" text-anchor="middle">Des personnes réduites en esclavage, entassées</text>
  <text class="tg-t tg-bien" x="550" y="474" text-anchor="middle">dans les cales des navires négriers</text>
  <text class="tg-t tg-note" x="550" y="496" text-anchor="middle">De trois à six semaines de traversée; de 10 à 20 % n'y survivent pas</text>

  <text class="tg-t tg-etape" x="290" y="176" text-anchor="end">3E ÉTAPE</text>
  <text class="tg-t tg-bien" x="290" y="198" text-anchor="end">Du sucre, du tabac, du rhum,</text>
  <text class="tg-t tg-bien" x="290" y="218" text-anchor="end">du café et des métaux précieux</text>

  <rect x="392" y="228" width="316" height="34" rx="17" fill="var(--matiere-voile)"/>
  <text class="tg-t tg-role" x="550" y="250" text-anchor="middle" fill="var(--encre)">Ce système s'appelle le mercantilisme</text>
</svg>
