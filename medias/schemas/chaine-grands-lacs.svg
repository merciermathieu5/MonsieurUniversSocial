<svg viewBox="0 0 1100 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Les cinq Grands Lacs dans l'ordre d'ouest en est, du lac Supérieur au lac Ontario, avec leur superficie">
  <style>
    .gl-t { font-family: Archivo, sans-serif; }
    .gl-c { font-size: 11px; font-weight: 600; fill: var(--encre-doux); }
    .gl-n1 { font-size: 16px; font-weight: 700; fill: var(--bloc-pale-texte); }
    .gl-n2 { font-size: 16px; font-weight: 700; fill: var(--bloc-texte); }
    .gl-n3 { font-size: 16px; font-weight: 700; fill: var(--surface); }
    .gl-s1 { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 600; fill: var(--bloc-pale-texte); }
    .gl-s2 { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 600; fill: var(--bloc-texte); }
    .gl-s3 { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 600; fill: var(--surface); }
    .gl-bt { font-size: 14.5px; font-weight: 700; fill: var(--encre); }
    .gl-bp { font-size: 12.5px; fill: var(--encre); }
    .gl-f { fill: none; stroke: var(--schema-trait); stroke-width: 2; }
  </style>

  <text class="gl-t gl-c" x="30" y="40">D'ouest en est</text>
  <text class="gl-t gl-c" x="1070" y="40" text-anchor="end">Vers le Saint-Laurent</text>

  <rect x="30" y="54" width="170" height="86" rx="5" fill="var(--bloc)"/>
  <text class="gl-t gl-n2" x="48" y="86">Supérieur</text>
  <text class="gl-t gl-s2" x="48" y="112">82 100 km²</text>
  <path class="gl-f" d="M208 97 H226 M219 91 L226 97 L219 103"/>

  <rect x="234" y="54" width="170" height="86" rx="5" fill="var(--bloc-pale)"/>
  <text class="gl-t gl-n1" x="252" y="86">Michigan</text>
  <text class="gl-t gl-s1" x="252" y="112">57 800 km²</text>
  <path class="gl-f" d="M412 97 H430 M423 91 L430 97 L423 103"/>

  <rect x="438" y="54" width="170" height="86" rx="5" fill="var(--bloc)"/>
  <text class="gl-t gl-n2" x="456" y="86">Huron</text>
  <text class="gl-t gl-s2" x="456" y="112">59 600 km²</text>
  <path class="gl-f" d="M616 97 H634 M627 91 L634 97 L627 103"/>

  <rect x="642" y="54" width="170" height="86" rx="5" fill="var(--bloc-pale)"/>
  <text class="gl-t gl-n1" x="660" y="86">Érié</text>
  <text class="gl-t gl-s1" x="660" y="112">25 700 km²</text>
  <path class="gl-f" d="M820 97 H838 M831 91 L838 97 L831 103"/>

  <rect x="846" y="54" width="170" height="86" rx="5" fill="var(--schema-cle)"/>
  <text class="gl-t gl-n3" x="864" y="86">Ontario</text>
  <text class="gl-t gl-s3" x="864" y="112">18 960 km²</text>
  <path class="gl-f" d="M1024 97 H1058 M1051 91 L1058 97 L1051 103"/>

  <rect x="30" y="176" width="1040" height="94" rx="5" fill="var(--matiere-voile)"/>
  <text class="gl-t gl-bt" x="52" y="202">Retiens l'ordre avec SMHÉO</text>
  <text class="gl-t gl-bp" x="52" y="226">Supérieur, Michigan, Huron, Érié, Ontario. L'eau descend d'ouest en est, mais pas en ligne droite : le Michigan</text>
  <text class="gl-t gl-bp" x="52" y="246">et le Supérieur se déversent tous deux dans le Huron, qui alimente l'Érié, lequel tombe dans l'Ontario par les</text>
  <text class="gl-t gl-bp" x="52" y="266">chutes du Niagara. C'est là que le canal Welland devient indispensable aux navires.</text>
</svg>
