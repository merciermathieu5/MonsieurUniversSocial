<svg viewBox="0 0 1100 520" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Carte simplifiée de l'Empire romain à son apogée au 2e siècle : le territoire encercle complètement la mer Méditerranée, de la Bretagne à l'Égypte">
  <style>
    .ce-t { font-family: Archivo, sans-serif; }
    .ce-r { font-size: 14px; font-weight: 600; fill: var(--encre); }
    .ce-m { font-size: 13px; font-style: italic; fill: var(--encre-doux); }
    .ce-l { font-size: 12.5px; fill: var(--encre-doux); }
    .ce-terre { fill: var(--fond); }
    .ce-empire { fill: var(--schema-accent); opacity: 0.3; }
    .ce-bord { fill: none; stroke: var(--schema-accent); stroke-width: 2.5; stroke-linejoin: round; }
    .ce-eau { fill: var(--bloc-pale); opacity: 0.55; }
  </style>
  <rect class="ce-terre" x="60" y="80" width="1000" height="410" rx="10"/>
  <path class="ce-empire" fill-rule="evenodd" d="M150,300 L150,240 L200,200 L240,150 L330,140
    L360,180 L430,210 L520,190 L610,200 L700,195 L840,195 L880,220 L900,260 L930,280
    L930,340 L900,380 L890,430 L860,470 L790,480 L600,470 L420,460 L300,440 L230,420
    L200,380 L185,340 L160,330 Z
    M200,335 L260,315 L340,320 L430,310 L520,315 L610,320 L700,310 L790,300 L860,310
    L880,330 L860,360 L780,380 L680,390 L570,395 L460,390 L350,380 L260,365 L215,350 Z"/>
  <path class="ce-bord" d="M150,300 L150,240 L200,200 L240,150 L330,140
    L360,180 L430,210 L520,190 L610,200 L700,195 L840,195 L880,220 L900,260 L930,280
    L930,340 L900,380 L890,430 L860,470 L790,480 L600,470 L420,460 L300,440 L230,420
    L200,380 L185,340 L160,330 Z"/>
  <path class="ce-eau" d="M200,335 L260,315 L340,320 L430,310 L520,315 L610,320 L700,310
    L790,300 L860,310 L880,330 L860,360 L780,380 L680,390 L570,395 L460,390 L350,380
    L260,365 L215,350 Z"/>
  <path class="ce-empire" d="M480,295 L500,300 L505,330 L515,355 L530,370 L545,372 L540,382
    L525,380 L512,368 L498,340 L488,315 Z"/>
  <path class="ce-empire" d="M513,386 L540,385 L528,401 Z"/>
  <path class="ce-empire" d="M600,310 L615,320 L612,340 L622,355 L615,362 L604,345 L596,325 Z"/>
  <ellipse class="ce-empire" cx="552" cy="386" rx="16" ry="5"/>
  <path class="ce-eau" d="M700,140 L790,135 L830,150 L825,180 L760,192 L705,185 Z"/>
  <path class="ce-empire" d="M252,118 L300,110 L330,130 L325,175 L295,192 L258,180 L245,148 Z"/>
  <path class="ce-bord" d="M252,118 L300,110 L330,130 L325,175 L295,192 L258,180 L245,148 Z"/>
  <line x1="247" y1="152" x2="327" y2="148" stroke="var(--schema-accent)" stroke-width="2.5" stroke-dasharray="6 4"/>
  <rect x="40" y="36" width="26" height="16" class="ce-empire"/>
  <rect x="40" y="36" width="26" height="16" fill="none" stroke="var(--schema-accent)" stroke-width="2"/>
  <text class="ce-t ce-l" x="76" y="49">Territoire de l'Empire romain à son apogée, au 2e siècle</text>
  <text class="ce-t ce-l" x="240" y="150" text-anchor="end">Le mur d'Hadrien</text>
  <text class="ce-t ce-r" x="290" y="100" text-anchor="middle">La Bretagne romaine</text>
  <text class="ce-t ce-r" x="280" y="222" text-anchor="middle">La Gaule</text>
  <text class="ce-t ce-r" x="205" y="278" text-anchor="middle">L'Hispanie</text>
  <text class="ce-t ce-r" x="430" y="270" text-anchor="middle">L'Italie</text>
  <circle cx="494" cy="312" r="5.5" fill="var(--schema-accent)" stroke="var(--surface)" stroke-width="2"/>
  <text class="ce-t ce-r" x="510" y="300">Rome, la capitale</text>
  <text class="ce-t ce-r" x="612" y="380" text-anchor="middle">La Grèce</text>
  <text class="ce-t ce-r" x="770" y="240" text-anchor="middle">L'Asie Mineure</text>
  <text class="ce-t ce-r" x="845" y="440" text-anchor="middle">L'Égypte</text>
  <text class="ce-t ce-r" x="450" y="430" text-anchor="middle">L'Afrique du Nord</text>
  <text class="ce-t ce-m" x="700" y="360" text-anchor="middle">La mer Méditerranée (Mare Nostrum)</text>
  <text class="ce-t ce-m" x="765" y="168" text-anchor="middle">La mer Noire</text>
  <text class="ce-t ce-l" x="470" y="122" text-anchor="middle">Peuples germains</text>
  <text class="ce-t ce-l" x="990" y="300" text-anchor="middle">L'Empire parthe</text>
</svg>
