<svg viewBox="0 0 1100 372" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Ligne du temps de la Révolution américaine, de la Proclamation royale de 1763 au Bill of Rights de 1791, à cheval sur les Temps modernes et l'Époque contemporaine">
  <style>
    .rv-t { font-family: Archivo, sans-serif; }
    .rv-e { font-size: 13.5px; fill: var(--encre); }
    .rv-d { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; fill: var(--schema-accent); }
    .rv-p1 { font-size: 14px; font-weight: 600; fill: var(--bloc-pale-texte); }
    .rv-p2 { font-size: 14px; font-weight: 700; fill: var(--surface); }
  </style>
  <rect x="70" y="186" width="796" height="34" fill="var(--bloc-pale)"/>
  <rect x="866" y="186" width="164" height="34" fill="var(--schema-accent)"/>
  <text class="rv-t rv-p1" x="468" y="208" text-anchor="middle">Les Temps modernes</text>
  <text class="rv-t rv-p2" x="948" y="208" text-anchor="middle">Contemporaine</text>

  <line x1="152" y1="164" x2="152" y2="180" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="rv-t rv-d" x="152" y="117" text-anchor="middle">1763</text>
  <text class="rv-t rv-e" x="152" y="138" text-anchor="middle">La Proclamation</text>
  <text class="rv-t rv-e" x="152" y="159" text-anchor="middle">royale ferme l'Ouest.</text>
  <circle cx="152" cy="186" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <line x1="427" y1="164" x2="427" y2="180" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="rv-t rv-d" x="427" y="117" text-anchor="middle">1773</text>
  <text class="rv-t rv-e" x="427" y="138" text-anchor="middle">Le Boston Tea Party</text>
  <text class="rv-t rv-e" x="427" y="159" text-anchor="middle">défie la taxe sur le thé.</text>
  <circle cx="427" cy="186" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <line x1="701" y1="164" x2="701" y2="180" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="rv-t rv-d" x="701" y="117" text-anchor="middle">1783</text>
  <text class="rv-t rv-e" x="701" y="138" text-anchor="middle">Le traité de Paris</text>
  <text class="rv-t rv-e" x="701" y="159" text-anchor="middle">reconnaît les États-Unis.</text>
  <circle cx="701" cy="186" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <line x1="921" y1="164" x2="921" y2="180" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="rv-t rv-d" x="1030" y="117" text-anchor="end">1791</text>
  <text class="rv-t rv-e" x="1030" y="138" text-anchor="end">Le Bill of Rights</text>
  <text class="rv-t rv-e" x="1030" y="159" text-anchor="end">protège les droits.</text>
  <circle cx="921" cy="186" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <line x1="344" y1="220" x2="344" y2="236" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="rv-t rv-d" x="270" y="264" text-anchor="middle">1770</text>
  <text class="rv-t rv-e" x="270" y="285" text-anchor="middle">Le massacre</text>
  <text class="rv-t rv-e" x="270" y="306" text-anchor="middle">de Boston.</text>
  <circle cx="344" cy="220" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <line x1="481" y1="220" x2="481" y2="236" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="rv-t rv-d" x="481" y="264" text-anchor="middle">1775</text>
  <text class="rv-t rv-e" x="481" y="285" text-anchor="middle">La bataille</text>
  <text class="rv-t rv-e" x="481" y="306" text-anchor="middle">de Lexington.</text>
  <circle cx="481" cy="220" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <line x1="592" y1="220" x2="592" y2="236" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="rv-t rv-d" x="640" y="264" text-anchor="middle">1776</text>
  <text class="rv-t rv-e" x="640" y="285" text-anchor="middle">La Déclaration</text>
  <text class="rv-t rv-e" x="640" y="306" text-anchor="middle">d'indépendance.</text>
  <circle cx="592" cy="220" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <line x1="866" y1="220" x2="866" y2="236" stroke="var(--schema-accent)" stroke-width="2.5"/>
  <text class="rv-t rv-d" x="880" y="264" text-anchor="middle">1789</text>
  <text class="rv-t rv-e" x="880" y="285" text-anchor="middle">Washington devient</text>
  <text class="rv-t rv-e" x="880" y="306" text-anchor="middle">le premier président.</text>
  <circle cx="866" cy="220" r="6.5" fill="var(--schema-accent)" stroke="var(--surface)" stroke-width="2"/>
</svg>
