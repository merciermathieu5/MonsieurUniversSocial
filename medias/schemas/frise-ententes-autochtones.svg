<svg viewBox="0 0 1100 320" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frise des grandes ententes entre les peuples autochtones et les gouvernements, de la Convention de la Baie-James en 1975 au transfert des responsabilités du Nunavut prévu en 2027">
  <style>
    .en-t { font-family: Archivo, sans-serif; }
    .en-a { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 700; fill: var(--encre); }
    .en-n { font-size: 12.5px; font-weight: 600; fill: var(--encre); }
    .en-d { font-size: 11.5px; fill: var(--encre-doux); }
    .en-l { stroke: var(--schema-trait); stroke-width: 2; fill: none; }
    .en-p { stroke: var(--schema-trait); stroke-width: 1.4; fill: none; }
    .en-bt { font-size: 14.5px; font-weight: 700; fill: var(--encre); }
    .en-bp { font-size: 12.5px; fill: var(--encre); }
  </style>

  <path class="en-l" d="M50 150H1050"/>

  <path class="en-p" d="M60 150V126"/>
  <circle cx="60" cy="150" r="5" fill="var(--schema-cle)"/>
  <text class="en-t en-a" x="60" y="70">1975</text>
  <text class="en-t en-n" x="60" y="90">Convention de la</text>
  <text class="en-t en-n" x="60" y="106">Baie-James</text>
  <text class="en-t en-d" x="60" y="121">Cris et Inuit</text>

  <path class="en-p" d="M117 150V174"/>
  <circle cx="117" cy="150" r="5" fill="var(--schema-cle)"/>
  <text class="en-t en-a" x="117" y="196">1978</text>
  <text class="en-t en-n" x="117" y="214">Convention du</text>
  <text class="en-t en-n" x="117" y="230">Nord-Est québécois</text>
  <text class="en-t en-d" x="117" y="245">Naskapis</text>

  <path class="en-p" d="M399 150V126"/>
  <circle cx="399" cy="150" r="5" fill="var(--schema-cle)"/>
  <text class="en-t en-a" x="399" y="70">1993</text>
  <text class="en-t en-n" x="399" y="90">Accord sur les</text>
  <text class="en-t en-n" x="399" y="106">revendications du Nunavut</text>
  <text class="en-t en-d" x="399" y="121">Inuit du Nunavut</text>

  <path class="en-p" d="M512 150V174"/>
  <circle cx="512" cy="150" r="5" fill="var(--schema-accent)"/>
  <text class="en-t en-a" x="512" y="196">1999</text>
  <text class="en-t en-n" x="512" y="214">Création du Nunavut</text>
  <text class="en-t en-d" x="512" y="231">Un nouveau territoire</text>

  <path class="en-p" d="M569 150V126"/>
  <circle cx="569" cy="150" r="5" fill="var(--schema-cle)"/>
  <text class="en-t en-a" x="569" y="70">2002</text>
  <text class="en-t en-n" x="569" y="90">Paix des Braves</text>
  <text class="en-t en-d" x="569" y="107">De nation à nation</text>

  <path class="en-p" d="M900 150V174"/>
  <circle cx="900" cy="150" r="5" fill="var(--schema-accent)"/>
  <text class="en-t en-a" x="900" y="196">2024</text>
  <text class="en-t en-n" x="900" y="214">Entente de dévolution</text>
  <text class="en-t en-d" x="900" y="231">Terres et ressources</text>

  <path class="en-p" d="M1040 150V126"/>
  <circle cx="1040" cy="150" r="5" fill="var(--schema-trait)"/>
  <text class="en-t en-a" x="1040" y="70" text-anchor="end">2027</text>
  <text class="en-t en-n" x="1040" y="90" text-anchor="end">Transfert effectif</text>
  <text class="en-t en-d" x="1040" y="107" text-anchor="end">1er avril, à venir</text>

  <rect x="50" y="264" width="1000" height="48" rx="5" fill="var(--matiere-voile)"/>
  <text class="en-t en-bt" x="72" y="286">Ces ententes ont toutes suivi une contestation</text>
  <text class="en-t en-bp" x="72" y="305">Aucune n'a été offerte spontanément. Chaque fois, ce sont les nations elles-mêmes qui ont porté l'affaire devant les tribunaux ou négocié.</text>
</svg>
