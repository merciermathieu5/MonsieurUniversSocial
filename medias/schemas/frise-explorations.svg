<svg viewBox="0 0 1100 360" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Ligne du temps des Grandes explorations : la prise de Constantinople en 1453, la fin du Moyen Âge en 1492, les routes de Dias et de Vasco de Gama, le tour du monde de Magellan, puis Cartier et l'argent de Potosí">
  <style>
    .fx-t { font-family: Archivo, sans-serif; }
    .fx-e { font-size: 13.5px; fill: var(--encre); }
    .fx-d { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; fill: var(--schema-accent); }
    .fx-p1 { font-size: 14px; font-weight: 600; fill: var(--bloc-pale-texte); }
    .fx-p2 { font-size: 14px; font-weight: 700; fill: var(--surface); }
  </style>
  <rect x="70" y="186" width="416" height="34" fill="var(--bloc-pale)"/>
  <rect x="486" y="186" width="544" height="34" fill="var(--schema-accent)"/>
  <text class="fx-t fx-p1" x="278" y="208" text-anchor="middle">Le Moyen Âge</text>
  <text class="fx-t fx-p2" x="758" y="208" text-anchor="middle">Les Temps modernes</text>

  <line x1="174" y1="164" x2="174" y2="180" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="fx-t fx-d" x="174" y="96" text-anchor="middle">1453*</text>
  <text class="fx-t fx-e" x="174" y="117" text-anchor="middle">Les Ottomans prennent</text>
  <text class="fx-t fx-e" x="174" y="138" text-anchor="middle">Constantinople : la route</text>
  <text class="fx-t fx-e" x="174" y="159" text-anchor="middle">de l'Asie devient coûteuse.</text>
  <circle cx="174" cy="186" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <line x1="486" y1="164" x2="486" y2="180" stroke="var(--schema-accent)" stroke-width="2.5"/>
  <text class="fx-t fx-d" x="486" y="138" text-anchor="middle">1492</text>
  <text class="fx-t fx-e" x="486" y="159" text-anchor="middle">Fin du Moyen Âge</text>
  <circle cx="486" cy="186" r="6.5" fill="var(--schema-accent)" stroke="var(--surface)" stroke-width="2"/>

  <line x1="702" y1="164" x2="702" y2="180" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="fx-t fx-d" x="702" y="96" text-anchor="middle">1519 à 1522</text>
  <text class="fx-t fx-e" x="702" y="117" text-anchor="middle">L'expédition de Magellan</text>
  <text class="fx-t fx-e" x="702" y="138" text-anchor="middle">réalise le premier tour</text>
  <text class="fx-t fx-e" x="702" y="159" text-anchor="middle">du monde par la mer.</text>
  <circle cx="702" cy="186" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <line x1="494" y1="220" x2="494" y2="236" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="fx-t fx-d" x="494" y="258" text-anchor="middle">1488 et 1498</text>
  <text class="fx-t fx-e" x="494" y="279" text-anchor="middle">Dias atteint le cap de</text>
  <text class="fx-t fx-e" x="494" y="300" text-anchor="middle">Bonne-Espérance, puis</text>
  <text class="fx-t fx-e" x="494" y="321" text-anchor="middle">Vasco de Gama, l'Inde.</text>
  <circle cx="454" cy="220" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
  <circle cx="534" cy="220" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <line x1="866" y1="220" x2="866" y2="236" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="fx-t fx-d" x="866" y="258" text-anchor="middle">1534 et 1545</text>
  <text class="fx-t fx-e" x="866" y="279" text-anchor="middle">Cartier atteint la baie</text>
  <text class="fx-t fx-e" x="866" y="300" text-anchor="middle">de Gaspé; l'argent de</text>
  <text class="fx-t fx-e" x="866" y="321" text-anchor="middle">Potosí part vers l'Europe.</text>
  <circle cx="822" cy="220" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
  <circle cx="910" cy="220" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
</svg>
