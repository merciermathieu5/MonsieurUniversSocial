<svg viewBox="0 0 1100 370" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Ligne du temps des grandes explorations, de la prise de Constantinople en 1453 au premier voyage de Jacques Cartier en 1534">
  <style>
    .fx-t { font-family: Archivo, sans-serif; }
    .fx-e { font-size: 13.5px; fill: var(--encre); }
    .fx-d { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; fill: var(--schema-accent); }
    .fx-p1 { font-size: 14px; font-weight: 600; fill: var(--bloc-pale-texte); }
    .fx-p2 { font-size: 14px; font-weight: 700; fill: var(--surface); }
  </style>
  <rect x="70" y="186" width="128" height="34" fill="var(--bloc-pale)"/>
  <rect x="198" y="186" width="832" height="34" fill="var(--schema-accent)"/>
  <text class="fx-t fx-p1" x="134" y="208" text-anchor="middle">Moyen Âge</text>
  <text class="fx-t fx-p2" x="614" y="208" text-anchor="middle">Les Grandes explorations</text>
  <line x1="198" y1="164" x2="198" y2="180" stroke="var(--schema-accent)" stroke-width="2.5"/>
  <text class="fx-t fx-d" x="198" y="96" text-anchor="middle">1453</text>
  <text class="fx-t fx-e" x="198" y="117" text-anchor="middle">Les Ottomans prennent</text>
  <text class="fx-t fx-e" x="198" y="138" text-anchor="middle">Constantinople : la route</text>
  <text class="fx-t fx-e" x="198" y="159" text-anchor="middle">de l'Asie devient coûteuse.</text>
  <circle cx="198" cy="186" r="6.5" fill="var(--schema-accent)" stroke="var(--surface)" stroke-width="2"/>
  <line x1="411" y1="164" x2="411" y2="180" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="fx-t fx-d" x="411" y="96" text-anchor="middle">1488 et 1498</text>
  <text class="fx-t fx-e" x="411" y="117" text-anchor="middle">Dias atteint le cap de</text>
  <text class="fx-t fx-e" x="411" y="138" text-anchor="middle">Bonne-Espérance, puis</text>
  <text class="fx-t fx-e" x="411" y="159" text-anchor="middle">Vasco de Gama, l'Inde.</text>
  <circle cx="386" cy="186" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
  <circle cx="436" cy="186" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
  <line x1="654" y1="164" x2="654" y2="180" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="fx-t fx-d" x="654" y="96" text-anchor="middle">1519 à 1522</text>
  <text class="fx-t fx-e" x="654" y="117" text-anchor="middle">L'expédition de Magellan</text>
  <text class="fx-t fx-e" x="654" y="138" text-anchor="middle">réalise le premier tour</text>
  <text class="fx-t fx-e" x="654" y="159" text-anchor="middle">du monde par la mer.</text>
  <circle cx="654" cy="186" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
  <line x1="311" y1="220" x2="311" y2="236" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="fx-t fx-d" x="311" y="258" text-anchor="middle">1492 et 1494</text>
  <text class="fx-t fx-e" x="311" y="279" text-anchor="middle">Colomb atteint les</text>
  <text class="fx-t fx-e" x="311" y="300" text-anchor="middle">Antilles; le traité de</text>
  <text class="fx-t fx-e" x="311" y="321" text-anchor="middle">Tordesillas partage le monde.</text>
  <circle cx="311" cy="220" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
  <line x1="561" y1="220" x2="561" y2="236" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="fx-t fx-d" x="561" y="258" text-anchor="middle">1521</text>
  <text class="fx-t fx-e" x="561" y="279" text-anchor="middle">Cortés s'empare de</text>
  <text class="fx-t fx-e" x="561" y="300" text-anchor="middle">Tenochtitlan, capitale</text>
  <text class="fx-t fx-e" x="561" y="321" text-anchor="middle">de l'Empire aztèque.</text>
  <circle cx="561" cy="220" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
  <line x1="826" y1="220" x2="826" y2="236" stroke="var(--schema-trait)" stroke-width="1.5"/>
  <text class="fx-t fx-d" x="826" y="258" text-anchor="middle">1534 et 1545</text>
  <text class="fx-t fx-e" x="826" y="279" text-anchor="middle">Cartier atteint la baie</text>
  <text class="fx-t fx-e" x="826" y="300" text-anchor="middle">de Gaspé; l'argent de</text>
  <text class="fx-t fx-e" x="826" y="321" text-anchor="middle">Potosí part vers l'Europe.</text>
  <circle cx="801" cy="220" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
  <circle cx="856" cy="220" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
</svg>
