<svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Ce qu'Athènes vend aux autres cités et ce qu'elle achète à l'étranger, au marché de l'agora">
  <style>
    .ca-t { font-family: Archivo, sans-serif; }
    .ca-col { font-size: 17px; font-weight: 700; }
    .ca-v { font-size: 14.5px; fill: var(--encre); }
  </style>
  <rect x="8" y="16" width="472" height="44" rx="4" fill="var(--bloc)"/>
  <text class="ca-t ca-col" x="244" y="45" text-anchor="middle" fill="var(--bloc-texte)">Athènes vend aux autres cités</text>
  <rect x="520" y="16" width="472" height="44" rx="4" fill="var(--bloc-pale)"/>
  <text class="ca-t ca-col" x="756" y="45" text-anchor="middle" fill="var(--bloc-pale-texte)">Athènes achète à l'étranger</text>
  <rect x="24" y="92" width="56" height="56" rx="10" fill="var(--bloc-pale)" opacity=".32"/>
  <path d="M41,100 h22 M45,104 c0,6 -8,10 -8,20 c0,10 6,16 15,16 c9,0 15,-6 15,-16 c0,-10 -8,-14 -8,-20 M45,104 h14" fill="none" stroke="var(--bloc)" stroke-width="2.6" stroke-linecap="round"/><path d="M43,110 c-7,2 -7,10 0,12 M61,110 c7,2 7,10 0,12" fill="none" stroke="var(--bloc)" stroke-width="2.4"/>
  <text class="ca-t ca-v" x="98" y="116">Le vin, l'huile d'olive, les sauces</text>
  <text class="ca-t ca-v" x="98" y="137">de poisson et la bière.</text>
  <rect x="24" y="170" width="56" height="56" rx="10" fill="var(--bloc-pale)" opacity=".32"/>
  <rect x="48" y="176" width="8" height="8" rx="2" fill="none" stroke="var(--bloc)" stroke-width="2.4"/><path d="M47,184 c-9,5 -12,12 -12,20 a17,15 0 0 0 34,0 c0,-8 -3,-15 -12,-20 z" fill="none" stroke="var(--bloc)" stroke-width="2.6" stroke-linejoin="round"/>
  <text class="ca-t ca-v" x="98" y="194">Les parfums.</text>
  <rect x="24" y="248" width="56" height="56" rx="10" fill="var(--bloc-pale)" opacity=".32"/>
  <path d="M33,278 a19,14 0 0 0 38,0 z" fill="none" stroke="var(--bloc)" stroke-width="2.6" stroke-linejoin="round"/><circle cx="44" cy="271" r="6" fill="none" stroke="var(--bloc)" stroke-width="2.4"/><circle cx="57" cy="268" r="6" fill="none" stroke="var(--bloc)" stroke-width="2.4"/><circle cx="65" cy="274" r="5" fill="none" stroke="var(--bloc)" stroke-width="2.2"/>
  <text class="ca-t ca-v" x="98" y="272">Les figues, l'orge</text>
  <text class="ca-t ca-v" x="98" y="293">et les fromages.</text>
  <rect x="24" y="326" width="56" height="56" rx="10" fill="var(--bloc-pale)" opacity=".32"/>
  <path d="M40,334 h24 M44,338 c0,4 -8,7 -8,15 a16,14 0 0 0 32,0 c0,-8 -8,-11 -8,-15 M42,370 h20 M46,366 h12" fill="none" stroke="var(--bloc)" stroke-width="2.6" stroke-linecap="round"/>
  <text class="ca-t ca-v" x="98" y="350">La poterie fine, réputée dans</text>
  <text class="ca-t ca-v" x="98" y="371">toute la Méditerranée.</text>
  <rect x="536" y="92" width="56" height="56" rx="10" fill="var(--bloc-pale)" opacity=".32"/>
  <path d="M564,140 V102" stroke="var(--bloc)" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M564,104 q-9,-2 -12,-9 q10,-1 12,9 M564,104 q9,-2 12,-9 q-10,-1 -12,9" fill="none" stroke="var(--bloc)" stroke-width="2.2"/><path d="M564,111 q-9,-2 -12,-9 q10,-1 12,9 M564,111 q9,-2 12,-9 q-10,-1 -12,9" fill="none" stroke="var(--bloc)" stroke-width="2.2"/><path d="M564,118 q-9,-2 -12,-9 q10,-1 12,9 M564,118 q9,-2 12,-9 q-10,-1 -12,9" fill="none" stroke="var(--bloc)" stroke-width="2.2"/><path d="M564,125 q-9,-2 -12,-9 q10,-1 12,9 M564,125 q9,-2 12,-9 q-10,-1 -12,9" fill="none" stroke="var(--bloc)" stroke-width="2.2"/>
  <text class="ca-t ca-v" x="610" y="116">Le blé et les céréales de la</text>
  <text class="ca-t ca-v" x="610" y="137">mer Noire, ainsi que les épices.</text>
  <rect x="536" y="170" width="56" height="56" rx="10" fill="var(--bloc-pale)" opacity=".32"/>
  <rect x="548" y="186" width="32" height="24" fill="none" stroke="var(--bloc)" stroke-width="2.4"/><circle cx="548" cy="198" r="6" fill="none" stroke="var(--bloc)" stroke-width="2.4"/><circle cx="580" cy="198" r="6" fill="none" stroke="var(--bloc)" stroke-width="2.4"/><path d="M558,193 h12 M558,198 h12 M558,203 h8" stroke="var(--bloc)" stroke-width="1.8"/>
  <text class="ca-t ca-v" x="610" y="194">Le papyrus d'Égypte.</text>
  <rect x="536" y="248" width="56" height="56" rx="10" fill="var(--bloc-pale)" opacity=".32"/>
  <path d="M546,290 l5,-10 h12 l5,10 z M562,290 l5,-10 h12 l5,10 z M554,278 l5,-10 h12 l5,10 z" fill="none" stroke="var(--bloc)" stroke-width="2.4" stroke-linejoin="round"/>
  <text class="ca-t ca-v" x="610" y="272">Les métaux : l'argent, l'étain,</text>
  <text class="ca-t ca-v" x="610" y="293">le cuivre et l'or.</text>
  <rect x="536" y="326" width="56" height="56" rx="10" fill="var(--bloc-pale)" opacity=".32"/>
  <rect x="546" y="342" width="36" height="10" rx="5" fill="none" stroke="var(--bloc)" stroke-width="2.4"/><rect x="546" y="356" width="36" height="10" rx="5" fill="none" stroke="var(--bloc)" stroke-width="2.4"/><circle cx="577" cy="347" r="2" fill="var(--bloc)"/><circle cx="577" cy="361" r="2" fill="var(--bloc)"/>
  <text class="ca-t ca-v" x="610" y="350">Le bois de la Macédoine</text>
  <text class="ca-t ca-v" x="610" y="371">et de la Thrace.</text>
</svg>
