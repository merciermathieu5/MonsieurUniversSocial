<svg viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Les quatre facteurs de la course coloniale, économique, politique, technique et idéologique, qui mènent au partage de l'Afrique">
  <style>
    .mo-t { font-family: Archivo, sans-serif; }
    .mo-h { font-size: 15px; font-weight: 700; fill: var(--bloc-pale-texte); }
    .mo-e { font-size: 13px; fill: var(--bloc-pale-texte); }
    .mo-r { font-size: 20px; font-weight: 700; fill: var(--bloc-texte); }
    .mo-s { font-size: 14px; fill: var(--bloc-texte); }
    .mo-l { stroke: var(--schema-trait); stroke-width: 2; fill: none; }
  </style>

  <rect x="20" y="40" width="250" height="120" rx="6" fill="var(--bloc-pale)"/>
  <text class="mo-t mo-h" x="145" y="76" text-anchor="middle">Le facteur économique</text>
  <text class="mo-t mo-e" x="145" y="104" text-anchor="middle">Les industries européennes</text>
  <text class="mo-t mo-e" x="145" y="124" text-anchor="middle">importent du caoutchouc,</text>
  <text class="mo-t mo-e" x="145" y="144" text-anchor="middle">du coton et des métaux.</text>

  <rect x="290" y="40" width="250" height="120" rx="6" fill="var(--bloc-pale)"/>
  <text class="mo-t mo-h" x="415" y="76" text-anchor="middle">Le facteur politique</text>
  <text class="mo-t mo-e" x="415" y="104" text-anchor="middle">Les États rivalisent pour</text>
  <text class="mo-t mo-e" x="415" y="124" text-anchor="middle">le nombre de colonies et</text>
  <text class="mo-t mo-e" x="415" y="144" text-anchor="middle">les points stratégiques.</text>

  <rect x="560" y="40" width="250" height="120" rx="6" fill="var(--bloc-pale)"/>
  <text class="mo-t mo-h" x="685" y="76" text-anchor="middle">Le facteur technique</text>
  <text class="mo-t mo-e" x="685" y="104" text-anchor="middle">Bateaux à vapeur, chemins</text>
  <text class="mo-t mo-e" x="685" y="124" text-anchor="middle">de fer, quinine et armes</text>
  <text class="mo-t mo-e" x="685" y="144" text-anchor="middle">à répétition.</text>

  <rect x="830" y="40" width="250" height="120" rx="6" fill="var(--bloc-pale)"/>
  <text class="mo-t mo-h" x="955" y="76" text-anchor="middle">Le facteur idéologique</text>
  <text class="mo-t mo-e" x="955" y="104" text-anchor="middle">La mission civilisatrice et</text>
  <text class="mo-t mo-e" x="955" y="124" text-anchor="middle">le darwinisme social sont</text>
  <text class="mo-t mo-e" x="955" y="144" text-anchor="middle">invoqués pour justifier.</text>

  <path class="mo-l" d="M 145 160 L 145 230"/>
  <path class="mo-l" d="M 415 160 L 415 230"/>
  <path class="mo-l" d="M 685 160 L 685 230"/>
  <path class="mo-l" d="M 955 160 L 955 230"/>
  <path class="mo-l" d="M 145 230 L 955 230"/>
  <path class="mo-l" d="M 550 230 L 550 288"/>
  <path d="M 538 288 L 562 288 L 550 306 Z" fill="var(--schema-trait)"/>

  <rect x="20" y="310" width="1060" height="86" rx="6" fill="var(--bloc)"/>
  <text class="mo-t mo-r" x="550" y="348" text-anchor="middle">La course au partage de l'Afrique</text>
  <text class="mo-t mo-s" x="550" y="376" text-anchor="middle">En 1884, l'Europe occupe environ le cinquième du continent. En 1913, tout sauf deux États.</text>
</svg>
