<svg viewBox="0 0 1100 380" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Ligne du temps de l'industrialisation anglaise, de la machine de Newcomen en 1712 au salaire minimum de 1910, à cheval sur les Temps modernes et l'Époque contemporaine">
  <style>
    .fi-t { font-family: Archivo, sans-serif; }
    .fi-e { font-size: 13.5px; fill: var(--encre); }
    .fi-d { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; fill: var(--schema-accent); }
    .fi-p1 { font-size: 14px; font-weight: 600; fill: var(--bloc-pale-texte); }
    .fi-p2 { font-size: 14px; font-weight: 700; fill: var(--surface); }
    .fi-l { stroke: var(--schema-trait); stroke-width: 1.5; fill: none; }
  </style>
  <rect x="70" y="190" width="388" height="34" fill="var(--bloc-pale)"/>
  <rect x="458" y="190" width="572" height="34" fill="var(--schema-accent)"/>
  <text class="fi-t fi-p1" x="264" y="212" text-anchor="middle">Les Temps modernes</text>
  <text class="fi-t fi-p2" x="744" y="212" text-anchor="middle">L'Époque contemporaine</text>

  <path class="fi-l" d="M 122 190 L 122 168"/>
  <text class="fi-t fi-d" x="122" y="102" text-anchor="middle">1712</text>
  <text class="fi-t fi-e" x="122" y="123" text-anchor="middle">La machine de Newcomen</text>
  <text class="fi-t fi-e" x="122" y="144" text-anchor="middle">pompe l'eau des mines.</text>
  <circle cx="122" cy="190" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="fi-l" d="M 371 190 L 371 168"/>
  <text class="fi-t fi-d" x="371" y="102" text-anchor="middle">1769</text>
  <text class="fi-t fi-e" x="371" y="123" text-anchor="middle">Watt perfectionne la</text>
  <text class="fi-t fi-e" x="371" y="144" text-anchor="middle">machine à vapeur.</text>
  <circle cx="371" cy="190" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="fi-l" d="M 615 190 L 615 168"/>
  <text class="fi-t fi-d" x="615" y="102" text-anchor="middle">1825</text>
  <text class="fi-t fi-e" x="615" y="123" text-anchor="middle">Le rail relie Stockton</text>
  <text class="fi-t fi-e" x="615" y="144" text-anchor="middle">à Darlington.</text>
  <circle cx="615" cy="190" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="fi-l" d="M 816 190 L 816 168"/>
  <text class="fi-t fi-d" x="816" y="102" text-anchor="middle">1871</text>
  <text class="fi-t fi-e" x="816" y="123" text-anchor="middle">Les syndicats sont</text>
  <text class="fi-t fi-e" x="816" y="144" text-anchor="middle">reconnus par la loi.</text>
  <circle cx="816" cy="190" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="fi-l" d="M 188 224 L 188 246"/>
  <text class="fi-t fi-d" x="188" y="278" text-anchor="middle">1727</text>
  <text class="fi-t fi-e" x="188" y="299" text-anchor="middle">Les lois de l'enclosure</text>
  <text class="fi-t fi-e" x="188" y="320" text-anchor="middle">clôturent les terres.</text>
  <circle cx="188" cy="224" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="fi-l" d="M 415 224 L 415 246"/>
  <text class="fi-t fi-d" x="415" y="278" text-anchor="middle">1779</text>
  <text class="fi-t fi-e" x="415" y="299" text-anchor="middle">Crompton invente</text>
  <text class="fi-t fi-e" x="415" y="320" text-anchor="middle">la mule-jenny.</text>
  <circle cx="415" cy="224" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="fi-l" d="M 690 224 L 690 246"/>
  <text class="fi-t fi-d" x="690" y="278" text-anchor="middle">1842</text>
  <text class="fi-t fi-e" x="690" y="299" text-anchor="middle">Une loi ferme la mine</text>
  <text class="fi-t fi-e" x="690" y="320" text-anchor="middle">aux enfants.</text>
  <circle cx="690" cy="224" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>

  <path class="fi-l" d="M 986 224 L 986 236 L 1010 254"/>
  <text class="fi-t fi-d" x="1030" y="278" text-anchor="end">1910</text>
  <text class="fi-t fi-e" x="1030" y="299" text-anchor="end">Le salaire minimum</text>
  <text class="fi-t fi-e" x="1030" y="320" text-anchor="end">est établi.</text>
  <circle cx="986" cy="224" r="5.5" fill="var(--bloc)" stroke="var(--surface)" stroke-width="2"/>
</svg>
