# Lexique de classement des articles d'actualité, géographie seulement.
#
# L'histoire a été retirée après essai : un mot-clé ne sait pas lire une date.
# « épave », « empire », « colonisation », « démocratie » rangeaient des
# articles sous la bonne réalité sociale avec quatre siècles d'écart. Le défaut
# ne se répare pas en ajoutant des termes, alors la page s'en tient aux
# territoires, qui eux parlent du présent.
#
# Chaque territoire porte deux listes. Un terme « fort » décide presque à lui
# seul, un terme « faible » ne décide de rien tout seul. La comparaison se
# fait sans accents, en minuscules, et tolère le pluriel sur chaque mot :
# écrire « coupe forestiere » au singulier suffit.
#
# Un article est proposé de deux façons :
#
#     par le titre     un terme fort dans le titre (2 points), et 2 points
#                      au total, le faible du titre valant 1.
#     par le résumé    aucun terme fort dans le titre, mais un terme fort dans
#                      le résumé que le fil donne sous le titre ET au moins un
#                      terme faible dans le titre. Le résumé ne décide jamais
#                      seul : il confirme ce que le titre annonce.
#
# Un terme fort trouvé dans le résumé ajoute 1 point, ce qui aide à départager
# deux territoires.
#
# Écrire des termes longs plutôt que courts. « foret » attrape « la foret des
# sondages », « coupe forestiere » n'attrape que ce qu'on veut.
#
# Révision du 30 septembre 2026, faite sur 295 jugements (162 O, 133 N) :
# retrait des termes qui n'ont jamais mené à un O (itinérance, autoroute,
# ruelle verte, camping, escapade, plein air, idée de sortie, traverse
# frontalière), tourisme, touriste, agricole et agriculteur passés forts,
# territoire industriel élargi à l'acier, à l'aluminium, à l'automobile et
# aux ports, ville patrimoniale élargie au patrimoine religieux de Québec.
# « python outils\articles.py --bilan » refait ce calcul à tout moment.
#
# Correction du 8 octobre 2026, après 97 propositions jugées (42 O, 55 N) :
# les noms d'entreprises (Stelco, Stellantis, ArcelorMittal) amenaient des
# grèves et des mises à pied, 0 O sur 9; ils ne décident plus seuls et les
# conflits de travail sont des pièges. L'apprentissage, trop prudent, n'avait
# rien rétrogradé : il réagit maintenant aussi aux sujets refusés en série
# sur deux semaines. « rempart » attrapait les Remparts de Québec, retiré.

# Les fils à interroger. Les cinq de La Presse ont répondu, les adresses de
# Radio-Canada en rss.radio-canada.ca sont mortes : ce sous-domaine ne répond
# plus du tout. Va lire les adresses courantes sur ici.radio-canada.ca/info/rss
# et colle-les ici, l'outil n'a pas besoin d'être modifié.
fils:
  "La Presse · actualités": https://www.lapresse.ca/actualites/rss
  "La Presse · environnement": https://www.lapresse.ca/actualites/environnement/rss
  "La Presse · national": https://www.lapresse.ca/actualites/national/rss
  "La Presse · international": https://www.lapresse.ca/international/rss
  "La Presse · affaires": https://www.lapresse.ca/affaires/rss
  # Éprouvés le 15 août 2026, dix items chacun. Voyage et régional portent
  # les territoires que les grands titres ignorent : touristique, protégé,
  # forestier régional. Politique et économie ont été retirés volontairement :
  # ils chargeaient la page de commerce et de partis sans jamais nommer un
  # territoire, et le fil affaires suffit pour l'industriel.
  "La Presse · Grand Montréal": https://www.lapresse.ca/actualites/grand-montreal/rss
  "La Presse · sciences": https://www.lapresse.ca/actualites/sciences/rss
  "La Presse · régional": https://www.lapresse.ca/actualites/regional/rss
  "La Presse · voyage": https://www.lapresse.ca/voyage/rss
  # Radio-Canada a abandonné ses fils numérotés : les adresses sont
  # maintenant en clair, sous /info/rss/. La liste complète (51 fils, dont
  # chaque région) vit sur ici.radio-canada.ca/info/rss. Les cinq d'ici ont
  # été éprouvés le 15 août 2026, de 22 à 50 items chacun. Bas-Saint-Laurent
  # ancre la page dans la région des élèves; Gaspésie nourrit le territoire
  # touristique, retire sa ligne si elle apporte trop de faits divers.
  "Radio-Canada · grands titres": https://ici.radio-canada.ca/info/rss/info/a-la-une
  "Radio-Canada · environnement": https://ici.radio-canada.ca/info/rss/environnement/en-continu
  "Radio-Canada · science": https://ici.radio-canada.ca/info/rss/science/en-continu
  "Radio-Canada · Bas-Saint-Laurent": https://ici.radio-canada.ca/info/rss/bas-saint-laurent/en-continu
  "Radio-Canada · Gaspésie": https://ici.radio-canada.ca/info/rss/gaspesie-iles-de-la-madeleine/en-continu
  # Ajoutés le 30 septembre 2026 pour les territoires les moins couverts,
  # 50 items chacun. Économie : usines, acier, agriculteurs. Toronto et
  # Windsor : le cœur industriel des Grands Lacs (Stelco à Hamilton,
  # l'automobile à Windsor). Québec : le Vieux-Québec et son patrimoine
  # religieux. Côte-Nord : Tadoussac et l'achalandage touristique.
  # Saguenay–Lac-Saint-Jean : l'aluminium et les terres du Lac.
  "Radio-Canada · économie": https://ici.radio-canada.ca/info/rss/economie/en-continu
  "Radio-Canada · Québec": https://ici.radio-canada.ca/info/rss/quebec/en-continu
  "Radio-Canada · Côte-Nord": https://ici.radio-canada.ca/info/rss/cote-nord/en-continu
  "Radio-Canada · Saguenay–Lac-Saint-Jean": https://ici.radio-canada.ca/info/rss/saguenay-lac-saint-jean/en-continu
  "Radio-Canada · Toronto": https://ici.radio-canada.ca/info/rss/ontario/toronto/en-continu
  "Radio-Canada · Windsor": https://ici.radio-canada.ca/info/rss/ontario/windsor/en-continu

  # Journal de Montréal, fils demandés et éprouvés le 15 août 2026, 15 ou
  # 16 items chacun. Le fil environnement bouge lentement (parfois rien
  # pendant des semaines) : normal, pas une panne. Transport urbain n'a pas
  # été ajouté : son fil appartenait à la défunte section 24 heures et
  # répond 404 partout. Argent ajouté le 30 septembre 2026, 18 items : le
  # journal n'a pas de fil affaires, c'est celui-là qui en tient lieu.
  "Journal de Montréal · transports": https://www.journaldemontreal.com/actualite/transports/rss.xml
  "Journal de Montréal · environnement": https://www.journaldemontreal.com/actualite/environnement/rss.xml
  "Journal de Montréal · société": https://www.journaldemontreal.com/actualite/societe/rss.xml
  "Journal de Montréal · Asie-Pacifique": https://www.journaldemontreal.com/monde/asie-pacifique/rss.xml
  "Journal de Montréal · argent": https://www.journaldemontreal.com/argent/rss.xml

# Veto de sécurité. Un seul de ces termes dans le titre ou le résumé écarte
# l'article avant le classement, quel que soit son score. La page s'adresse à
# des élèves de 12 à 14 ans et un fil de nouvelles brut charrie de tout.
exclure:
  - meurtre
  - homicide
  - agression sexuelle
  - agression armee
  - violence conjugale
  - proces pour
  - accuse de
  - corps retrouve
  - accident mortel
  - fusillade
  - attentat
  - suicide
  - surdose
  - maltraitance
  - pornographie
  - tuerie
  - poignarde
  - tue par balle
  - otage
  - torture
  - perd la vie
  - perdu la vie

# Rubriques à écarter, lues dans le chapeau du titre (« Chapeau | Titre »).
# Ce sont des chroniques qui reviennent chaque semaine et que tu as refusées
# chaque fois : résumés de la veille, circulation en direct, conseils de
# plein air, jeux-questionnaires.
rubriques_exclues:
  - boite de reception
  - ce qu on suit
  - ce que vous avez manque
  - transports en direct
  - ruelles vertes
  - pendant que vous etes la
  - multicolore
  - quiz
  - pme croissance

# Apprentissage. Un terme fort qui a mené à au moins « minimum » jugements
# avec un taux d'acceptation sous « taux » est traité comme faible au passage
# suivant : il ne décide plus seul. Même règle sur les « jours_recents »
# derniers jours, avec ses propres seuils : un sujet qui revient tous les
# jours et que tu refuses chaque fois (une grève, une campagne électorale)
# cesse d'être proposé, puis revient quand les refus sortent de la fenêtre.
# Le calcul se refait à chaque recherche à partir du registre, il suit donc
# tes O et tes N sans que tu touches à ce fichier. --bilan montre les termes
# rétrogradés.
apprentissage:
  minimum: 5
  taux: 0.25
  jours_recents: 14
  minimum_recent: 3
  taux_recent: 0.25

