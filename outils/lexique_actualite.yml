# Lexique de classement des articles d'actualité, géographie seulement.
#
# L'histoire a été retirée après essai : un mot-clé ne sait pas lire une date.
# « épave », « empire », « colonisation », « démocratie » rangeaient des
# articles sous la bonne réalité sociale avec quatre siècles d'écart. Le défaut
# ne se répare pas en ajoutant des termes, alors la page s'en tient aux
# territoires, qui eux parlent du présent.
#
# Chaque territoire porte deux listes. Un terme « fort » décide presque à lui
# seul, un terme « faible » ne décide de rien tout seul. Un article n'est
# proposé que s'il touche au moins un terme fort ET atteint 2 points, le fort
# valant 2 et le faible 1.
#
# La comparaison se fait sans accents, en minuscules, sur le titre, et tolère
# le pluriel sur chaque mot : écrire « coupe forestiere » au singulier suffit.
#
# Écrire des termes longs plutôt que courts. « foret » attrape « la foret des
# sondages », « coupe forestiere » n'attrape que ce qu'on veut.

# Les fils à interroger. Les cinq de La Presse ont répondu, les adresses de
# Radio-Canada en rss.radio-canada.ca sont mortes : ce sous-domaine ne répond
# plus du tout. Va lire les adresses courantes sur ici.radio-canada.ca/info/rss
# et colle-les ici, l'outil n'a pas besoin d'être modifié.
fils:
  "La Presse · actualités": https://www.lapresse.ca/actualites/rss
  "La Presse · environnement": https://www.lapresse.ca/actualites/environnement/rss
  "La Presse · national": https://www.lapresse.ca/actualites/national/rss
  "La Presse · international": https://www.lapresse.ca/international/rss
  "La Presse · affaires": https://www.lapresse.ca/affaires/rss
  # Éprouvés le 15 août 2026, dix items chacun. Voyage et régional portent
  # les territoires que les grands titres ignorent : touristique, protégé,
  # forestier régional. Politique et économie ont été retirés volontairement :
  # ils chargeaient la page de commerce et de partis sans jamais nommer un
  # territoire, et le fil affaires suffit pour l'industriel.
  "La Presse · Grand Montréal": https://www.lapresse.ca/actualites/grand-montreal/rss
  "La Presse · sciences": https://www.lapresse.ca/actualites/sciences/rss
  "La Presse · régional": https://www.lapresse.ca/actualites/regional/rss
  "La Presse · voyage": https://www.lapresse.ca/voyage/rss
  # Radio-Canada a abandonné ses fils numérotés : les adresses sont
  # maintenant en clair, sous /info/rss/. La liste complète (51 fils, dont
  # chaque région) vit sur ici.radio-canada.ca/info/rss. Les cinq d'ici ont
  # été éprouvés le 15 août 2026, de 22 à 50 items chacun. Bas-Saint-Laurent
  # ancre la page dans la région des élèves; Gaspésie nourrit le territoire
  # touristique, retire sa ligne si elle apporte trop de faits divers.
  "Radio-Canada · grands titres": https://ici.radio-canada.ca/info/rss/info/a-la-une
  "Radio-Canada · environnement": https://ici.radio-canada.ca/info/rss/environnement/en-continu
  "Radio-Canada · science": https://ici.radio-canada.ca/info/rss/science/en-continu
  "Radio-Canada · Bas-Saint-Laurent": https://ici.radio-canada.ca/info/rss/bas-saint-laurent/en-continu
  "Radio-Canada · Gaspésie": https://ici.radio-canada.ca/info/rss/gaspesie-iles-de-la-madeleine/en-continu

  # Journal de Montréal, fils demandés et éprouvés le 15 août 2026, 15 ou
  # 16 items chacun. Le fil environnement bouge lentement (parfois rien
  # pendant des semaines) : normal, pas une panne. Transport urbain n'a pas
  # été ajouté : son fil appartenait à la défunte section 24 heures et
  # répond 404 partout.
  "Journal de Montréal · transports": https://www.journaldemontreal.com/actualite/transports/rss.xml
  "Journal de Montréal · environnement": https://www.journaldemontreal.com/actualite/environnement/rss.xml
  "Journal de Montréal · société": https://www.journaldemontreal.com/actualite/societe/rss.xml
  "Journal de Montréal · Asie-Pacifique": https://www.journaldemontreal.com/monde/asie-pacifique/rss.xml

# Veto de sécurité. Un seul de ces termes dans un titre écarte l'article avant
# le classement, quel que soit son score. La page s'adresse à des élèves de 12
# à 14 ans et un fil de nouvelles brut charrie de tout.
exclure:
  - meurtre
  - homicide
  - agression sexuelle
  - agression armee
  - violence conjugale
  - proces pour
  - accuse de
  - corps retrouve
  - accident mortel
  - fusillade
  - attentat
  - suicide
  - surdose
  - maltraitance
  - pornographie
  - tuerie
  - poignarde
  - tue par balle
  - otage
  - torture

