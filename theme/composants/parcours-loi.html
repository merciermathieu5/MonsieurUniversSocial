        {
          cle: "boule", court: "La boulè prépare", qui: "500 citoyens tirés au sort",

          texte: "Une quarantaine de fois par année, les citoyens se réunissent en plein air sur la colline de la Pnyx. Chaque citoyen peut demander la parole et parler du haut de la tribune. Les bons orateurs ont un net avantage : ils savent convaincre la foule.",

      billes.push(bille);
    }
    bloc.appendChild(urne);

      b.classList.toggle("est-courant", courant);
      b.classList.toggle("est-passe", !surSpecial && k < rang);
      if (courant) { b.setAttribute("aria-current", "step"); } else { b.removeAttribute("aria-current"); }
    });
    if (reg.special) {
      reg.special.bouton.classList.toggle("est-courant", !!surSpecial);
      if (surSpecial) { reg.special.bouton.setAttribute("aria-current", "true"); } else { reg.special.bouton.removeAttribute("aria-current"); }
    }
    var panneau = surSpecial ? reg.special.panneau : reg.panneaux[rang];
    panneau.classList.add("est-visible");
    precedent.disabled = !surSpecial && rang === 0;
    suivant.disabled = !surSpecial && rang === reg.boutons.length - 1;
    suivant.textContent = surSpecial ? "Revenir au parcours" : "Étape suivante";
    placerProgres(vue);
  }

  construirePiste("athenes");
  construirePiste("quebec");
  construireComparaison();

  onglets.forEach(function (o) {
    o.addEventListener("click", function () {
      etat.vue = o.getAttribute("data-vue");
      etat.special = false;
      afficher();
    });
  });
  racine.querySelector(".pdl__onglets").addEventListener("keydown", function (e) {
    var rang = onglets.indexOf(document.activeElement);
    if (rang < 0) { return; }
    var cible = null;
    if (e.key === "ArrowRight") { cible = (rang + 1) % onglets.length; }
    else if (e.key === "ArrowLeft") { cible = (rang - 1 + onglets.length) % onglets.length; }
    else if (e.key === "Home") { cible = 0; }
    else if (e.key === "End") { cible = onglets.length - 1; }
    if (cible === null) { return; }
    e.preventDefault();
    etat.vue = onglets[cible].getAttribute("data-vue");
    etat.special = false;
    afficher();
    onglets[cible].focus();
  });
  precedent.addEventListener("click", function () {
    if (etat.special) { etat.special = false; afficher(); return; }
    if (etat.rangs[etat.vue] > 0) { etat.rangs[etat.vue] -= 1; afficher(); }
  });
  suivant.addEventListener("click", function () {
    if (etat.special) { etat.special = false; afficher(); return; }
    if (etat.rangs[etat.vue] < registre[etat.vue].boutons.length - 1) { etat.rangs[etat.vue] += 1; afficher(); }
  });
  replier.addEventListener("click", function () {
    var masque = racine.classList.toggle("texte-masque");
    replier.setAttribute("aria-expanded", masque ? "false" : "true");
    replier.textContent = masque ? "Afficher le texte" : "Masquer le texte";
  });
  window.addEventListener("resize", function () { if (etat.vue !== "comparer") { placerProgres(etat.vue); } });
  document.addEventListener("fullscreenchange", function () { setTimeout(function () { if (etat.vue !== "comparer") { placerProgres(etat.vue); } }, 60); });

  afficher();
  racine.classList.add("est-pret");
})();
</script>
</section>
