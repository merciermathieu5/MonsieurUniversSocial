<style>

.qec__precedent, .qec__suivant { font-size: .9rem; border-radius: 100px; padding: .5rem 1.15rem; border: 1px solid var(--trait); background: var(--surface); color: var(--encre-doux); }

.qec__replier { position: absolute; top: .65rem; right: .65rem; z-index: 2; font-size: .78rem; color: var(--encre-doux); background: var(--surface); border: 1px solid var(--trait); border-radius: 100px; padding: .3rem .8rem; }

</style>

<div class="qec__entete">

</div>

<div class="qec__corps">
  <div class="qec__scene">

    <p class="qec__compte"></p>
    <svg class="qec__grille" viewBox="0 0 400 500" role="img" aria-label="Grille de 100 silhouettes"></svg>
    <p class="qec__echelle"></p>
    <div class="qec__nav">
      <button type="button" class="qec__precedent">Étape précédente</button>
      <button type="button" class="qec__suivant">Premier critère</button>

  <div class="qec__cote">

<script>
(function () {
  var racine = document.getElementById("qui-est-citoyen");
  if (!racine || racine.getAttribute("data-pret") === "1") { return; }
  racine.setAttribute("data-pret", "1");

  var NS = "http://www.w3.org/2000/svg";
  var COLONNES = 10;
  var CASE_L = 40;
  var CASE_H = 50;

  /* Les groupes occupent des bandes continues, lues de gauche à droite. */
  var GROUPES = {
    esclaves: [0, 25], meteques: [25, 45], femmes: [45, 90], citoyens: [90, 100],
    exclus: [0, 30], abstention: [30, 53], votants: [53, 100]
  };
  var ETIQUETTES = {
    esclaves: "Esclaves", meteques: "Métèques", femmes: "Femmes et enfants",
    exclus: "Ne peuvent pas voter", abstention: "N'ont pas voté"
  };

  var etapes = [
    {
      court: "Tous les habitants", pays: "athenes",
      surtitre: "Athènes, à l'époque de Périclès",
      titre: "Environ 400 000 habitants",
      texte: "À l'époque de Périclès, environ 400 000 personnes vivent en Attique, le territoire d'Athènes. Chaque silhouette en représente 4 000. Qui, parmi elles, a le droit de voter? Applique les critères de citoyenneté un à un.",
      compte: ["100", "silhouettes sur 100"], suivant: "Premier critère",
      retires: [], droit: [], vote: [], bandes: []
    },
    {
      court: "Être libre", pays: "athenes",
      surtitre: "Premier critère",
      titre: "Être libre",
      texte: "Les esclaves forment plus du quart de la population. Ils appartiennent à leur propriétaire et n'ont aucun droit politique. On les retire. Il reste 75 silhouettes sur 100.",
      compte: ["75", "silhouettes sur 100"], suivant: "Critère suivant",
      retires: ["esclaves"], droit: [], vote: [], bandes: ["esclaves"]
    },
    {
      court: "Avoir des parents athéniens", pays: "athenes",
      surtitre: "Deuxième critère",
      titre: "Être né de parents athéniens",
      texte: "Depuis une loi de Périclès, en -451, il faut être né d'un père athénien et d'une mère fille de citoyen. Les métèques, environ 20 % des habitants, sont des étrangers libres. Ils paient des impôts et font leur service militaire, mais ils ne votent pas. Il reste 55 silhouettes.",
      compte: ["55", "silhouettes sur 100"], suivant: "Critère suivant",
      retires: ["esclaves", "meteques"], droit: [], vote: [], bandes: ["esclaves", "meteques"]
    },
    {
      court: "Être un homme adulte et soldat", pays: "athenes",
      surtitre: "Troisième critère",
      titre: "Avoir plus de 18 ans et avoir fait son service militaire",
      texte: "Les enfants sont trop jeunes. Les femmes ne font pas de service militaire et n'ont aucun droit politique. Ensemble, les femmes et les enfants des familles de citoyens forment environ 45 % de la population. Il reste les citoyens : 10 silhouettes, environ 40 000 hommes.",
      compte: ["10", "silhouettes ont le droit de voter"], suivant: "Qui vient à l'ecclésia?",
      retires: ["esclaves", "meteques", "femmes"], droit: ["citoyens"], vote: [], bandes: ["esclaves", "meteques", "femmes"]
    },
    {
      court: "Venir à l'ecclésia", pays: "athenes",
      surtitre: "Un jour d'assemblée",
      titre: "Avoir le droit de voter ne veut pas dire voter",
      texte: "L'ecclésia se réunit sur la colline de la Pnyx, qui peut accueillir environ 6 000 citoyens. Beaucoup de citoyens sont des paysans qui peuvent difficilement quitter leurs terres. Un jour d'assemblée, au plus 1,5 habitant sur 100 décide donc pour toute la cité.",
      compte: ["1,5", "silhouette, au plus, décide ce jour-là"], suivant: "Et au Québec?",
      retires: ["esclaves", "meteques", "femmes"], droit: ["citoyens"], vote: [], present: true, bandes: ["esclaves", "meteques", "femmes"]
    },
    {
      court: "Qui peut voter?", pays: "quebec",
      surtitre: "Et au Québec?",
      titre: "7 habitants sur 10 peuvent voter",
      texte: "Pour voter au Québec, il faut avoir 18 ans, avoir la citoyenneté canadienne, habiter au Québec depuis au moins six mois et être inscrit sur la liste électorale. Ce droit s'est élargi peu à peu : les femmes votent depuis 1940, les Autochtones qui vivent dans les réserves depuis 1969. En 2026, environ 6,4 millions de personnes étaient inscrites, sur environ 9,1 millions d'habitants.",
      compte: ["70", "silhouettes peuvent voter"], suivant: "Qui a voté?",
      retires: ["exclus"], droit: ["abstention", "votants"], vote: [], bandes: ["exclus"]
    },
    {
      court: "Qui a voté?", pays: "quebec",
      surtitre: "Le 5 octobre 2026",
      titre: "Un peu moins de la moitié des habitants a voté",
      texte: "Aux élections du 5 octobre 2026, 66,93 % des personnes inscrites ont voté, soit environ 4,3 millions de personnes. Elles n'ont pas voté les lois elles-mêmes : elles ont élu les 127 députés de l'Assemblée nationale, qui voteront les lois en leur nom.",
      etToi: "À ton âge, tu ne pourrais voter ni à Athènes ni au Québec. Au Québec, tu pourras voter à 18 ans, que tu sois une fille ou un garçon.",
      compte: ["47", "silhouettes ont voté"], suivant: "Recommencer",
      retires: ["exclus"], droit: ["abstention"], vote: ["votants"], bandes: ["exclus", "abstention"]
    }
  ];

  var PAYS = {
    athenes: { lieu: "L'Attique à l'époque de Périclès", echelle: "1 silhouette = 4 000 personnes" },
    quebec: { lieu: "Le Québec en 2026", echelle: "1 silhouette = environ 90 000 personnes" }
  };

  var BILANS = {
    athenes: [
      { de: 0, signe: "", nb: "100", nom: "Habitants de l'Attique", pers: "environ 400 000", genre: "neutre" },
      { de: 1, signe: "\u2212", nb: "25", nom: "Esclaves", pers: "plus de 100 000", genre: "retire" },
      { de: 2, signe: "\u2212", nb: "20", nom: "Métèques", pers: "environ 80 000", genre: "retire" },
      { de: 3, signe: "\u2212", nb: "45", nom: "Femmes et enfants des familles de citoyens", pers: "environ 180 000", genre: "retire" },
      { de: 3, signe: "=", nb: "10", nom: "Citoyens", pers: "environ 40 000", genre: "droit", fort: true },
      { de: 4, signe: "", nb: "1,5", nom: "Présents à l'ecclésia, au plus", pers: "environ 6 000", genre: "vote", fort: true }
    ],
    quebec: [
      { de: 5, signe: "", nb: "100", nom: "Habitants du Québec", pers: "environ 9,1 millions", genre: "neutre" },
      { de: 5, signe: "\u2212", nb: "30", nom: "Ne peuvent pas voter ou ne sont pas inscrits", pers: "environ 2,7 millions", genre: "retire" },
      { de: 5, signe: "=", nb: "70", nom: "Électeurs inscrits", pers: "environ 6,4 millions", genre: "droit", fort: true },
      { de: 6, signe: "\u2212", nb: "23", nom: "N'ont pas voté le 5 octobre 2026", pers: "environ 2,1 millions", genre: "droit" },
      { de: 6, signe: "=", nb: "47", nom: "Ont voté", pers: "environ 4,3 millions", genre: "vote", fort: true }
    ]
  };

  function typo(s) {
    return String(s).replace(/ ([:»])/g, "\u00a0$1").replace(/« /g, "«\u00a0").replace(/(\d) (\d{3})\b/g, "$1\u00a0$2").replace(/(\d) %/g, "$1\u00a0%");
  }
  function el(nom, classe, texte) {
    var n = document.createElement(nom);
    if (classe) { n.className = classe; }
    if (texte !== undefined) { n.textContent = typo(texte); }
    return n;
  }
  function svgEl(nom, attributs) {
    var n = document.createElementNS(NS, nom);
    Object.keys(attributs || {}).forEach(function (cle) { n.setAttribute(cle, attributs[cle]); });
    return n;
  }
  function dessinerSilhouette(parent) {
    parent.appendChild(svgEl("circle", { cx: "20", cy: "13", r: "7" }));
    parent.appendChild(svgEl("path", { d: "M8 46v-11a12 12 0 0 1 24 0v11z" }));
  }
  function dansGroupes(i, liste) {
    return liste.some(function (nom) { var g = GROUPES[nom]; return i >= g[0] && i < g[1]; });
  }

  var grille = racine.querySelector(".qec__grille");
  var lieu = racine.querySelector(".qec__lieu");
  var compte = racine.querySelector(".qec__compte");
  var echelle = racine.querySelector(".qec__echelle");
  var precedent = racine.querySelector(".qec__precedent");
  var suivant = racine.querySelector(".qec__suivant");
  var listeEtapes = racine.querySelector(".qec__etapes");
  var surtitre = racine.querySelector(".qec__surtitre");
  var titre = racine.querySelector(".qec__titre-etape");
  var explication = racine.querySelector(".qec__explication");
  var etToi = racine.querySelector(".qec__et-toi");
  var bilan = racine.querySelector(".qec__bilan");
  var replier = racine.querySelector(".qec__replier");

  /* ------------------------------------------------- la grille de silhouettes */

  var defs = svgEl("defs");
  var clip = svgEl("clipPath", { id: "qec-moitie" });
  clip.appendChild(svgEl("rect", { x: "0", y: "0", width: "20", height: "50" }));
  defs.appendChild(clip);
  grille.appendChild(defs);

  var figures = [];
  for (var i = 0; i < 100; i += 1) {
    var col = i % COLONNES;
    var rang = Math.floor(i / COLONNES);
    var g = svgEl("g", { "class": "qec__fig", transform: "translate(" + (col * CASE_L) + " " + (rang * CASE_H) + ")" });
    g.style.setProperty("--qec-delai", (col * 18) + "ms");
    dessinerSilhouette(g);
    grille.appendChild(g);
    figures.push(g);
  }
  /* La moitié de silhouette : 6 000 présents sur 40 000 citoyens, soit 1,5 sur 10. */
  var demi = svgEl("g", { "class": "qec__demi", transform: "translate(" + (1 * CASE_L) + " " + (9 * CASE_H) + ")" });
  var demiInterieur = svgEl("g", { "clip-path": "url(#qec-moitie)" });
  dessinerSilhouette(demiInterieur);
  demi.appendChild(demiInterieur);
  grille.appendChild(demi);

  var bandes = {};
  Object.keys(ETIQUETTES).forEach(function (nom) {
    var bornes = GROUPES[nom];
    var sx = 0;
    var sy = 0;
    for (var k = bornes[0]; k < bornes[1]; k += 1) {
      sx += (k % COLONNES) * CASE_L + CASE_L / 2;
      sy += Math.floor(k / COLONNES) * CASE_H + CASE_H / 2;
    }
    var n = bornes[1] - bornes[0];
    var cx = Math.round(sx / n);
    var cy = Math.round(sy / n);
    var texte = ETIQUETTES[nom];
    var largeur = Math.round(texte.length * 7.4 + 22);
    var groupe = svgEl("g", { "class": "qec__bande", "data-bande": nom, "aria-hidden": "true" });
    groupe.appendChild(svgEl("rect", { "class": "qec__bande-fond", x: String(cx - largeur / 2), y: String(cy - 12), width: String(largeur), height: "24", rx: "12" }));
    var t = svgEl("text", { "class": "qec__bande-texte", x: String(cx), y: String(cy + 4.5), "text-anchor": "middle" });
    t.textContent = texte;
    groupe.appendChild(t);
    grille.appendChild(groupe);
    bandes[nom] = groupe;
  });

  /* ----------------------------------------------------- la liste des étapes */

  var boutonsEtapes = [];
  etapes.forEach(function (etape, index) {
    if (index === 0 || etapes[index - 1].pays !== etape.pays) {
      listeEtapes.appendChild(el("li", "qec__groupe", etape.pays === "athenes" ? "À Athènes" : "Au Québec"));
    }
    var li = el("li");
    var bouton = el("button", "qec__etape");
    bouton.type = "button";
    bouton.setAttribute("data-etape", String(index));
    var num = el("span", "qec__num", String(index + 1));
    num.setAttribute("aria-hidden", "true");
    bouton.appendChild(num);
    bouton.appendChild(el("span", "qec__etape-nom", etape.court));
    bouton.setAttribute("aria-label", typo("Étape " + (index + 1) + " : " + etape.court));
    bouton.addEventListener("click", function () { aller(index); });
    li.appendChild(bouton);
    listeEtapes.appendChild(li);
    boutonsEtapes.push(bouton);
  });

  /* ------------------------------------------------------------ l'affichage */

  var courante = -1;

  function remplirBilan(index) {
    var pays = etapes[index].pays;
    var precedentes = bilan.getAttribute("data-pays") === pays ? Number(bilan.getAttribute("data-etape")) : -1;
    bilan.textContent = "";
    bilan.setAttribute("data-pays", pays);
    bilan.setAttribute("data-etape", String(index));
    BILANS[pays].forEach(function (ligne) {
      if (ligne.de > index) { return; }
      var li = el("li", "qec__ligne qec__ligne--" + ligne.genre + (ligne.fort ? " est-fort" : ""));
      if (ligne.de > precedentes && precedentes >= 0) { li.classList.add("est-neuf"); }
      var pastille = el("span", "qec__pastille");
      pastille.setAttribute("aria-hidden", "true");
      li.appendChild(pastille);
      li.appendChild(el("span", "qec__nb", (ligne.signe ? ligne.signe + " " : "") + ligne.nb));
      li.appendChild(el("span", "qec__nom-ligne", ligne.nom));
      li.appendChild(el("span", "qec__pers", ligne.pers));
      bilan.appendChild(li);
    });
  }

  function aller(index) {
    if (index < 0 || index >= etapes.length) { return; }
    var etape = etapes[index];
    courante = index;
    racine.setAttribute("data-etape", String(index + 1));
    figures.forEach(function (fig, k) {
      var classe = "qec__fig";
      if (dansGroupes(k, etape.retires)) { classe += " est-retire"; }
      else if (etape.present && k === 90) { classe += " est-vote"; }
      else if (dansGroupes(k, etape.vote)) { classe += " est-vote"; }
      else if (dansGroupes(k, etape.droit)) { classe += " est-droit"; }
      fig.setAttribute("class", classe);
    });
    demi.setAttribute("class", "qec__demi" + (etape.present ? " est-visible" : ""));
    Object.keys(bandes).forEach(function (nom) {
      bandes[nom].setAttribute("class", "qec__bande" + (etape.bandes.indexOf(nom) >= 0 ? " est-visible" : ""));
    });
    var pays = PAYS[etape.pays];
    lieu.textContent = typo(pays.lieu);
    echelle.textContent = typo(pays.echelle);
    compte.textContent = "";
    compte.appendChild(el("strong", "", etape.compte[0]));
    compte.appendChild(document.createTextNode(typo(etape.compte[1])));
    grille.setAttribute("aria-label", typo("Grille de 100 silhouettes, " + pays.lieu + " : " + etape.compte[0] + " " + etape.compte[1] + "."));
    surtitre.textContent = typo(etape.surtitre);
    titre.textContent = typo(etape.titre);
    explication.textContent = typo(etape.texte);
    if (etape.etToi) {
      etToi.textContent = "";
      etToi.appendChild(el("strong", "", "Et toi? "));
      etToi.appendChild(document.createTextNode(typo(etape.etToi)));
      etToi.hidden = false;
    } else {
      etToi.hidden = true;
    }
    boutonsEtapes.forEach(function (b, k) {
      if (k === index) { b.setAttribute("aria-current", "step"); } else { b.removeAttribute("aria-current"); }
      b.classList.toggle("est-passe", k < index);
    });
    remplirBilan(index);
    precedent.disabled = index === 0;
    suivant.textContent = typo(etape.suivant);
  }

  precedent.addEventListener("click", function () { aller(courante - 1); });
  suivant.addEventListener("click", function () {
    aller(courante === etapes.length - 1 ? 0 : courante + 1);
  });
  replier.addEventListener("click", function () {
    var masque = racine.classList.toggle("texte-masque");
    replier.setAttribute("aria-expanded", masque ? "false" : "true");
    replier.textContent = masque ? "Afficher le texte" : "Masquer le texte";
  });

  aller(0);
  racine.classList.add("est-pret");
})();
</script>
</section>
