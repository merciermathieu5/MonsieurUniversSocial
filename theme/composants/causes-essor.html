     l'identifiant de la section, le titre de l'en-tête et le bloc DONNEES.

     source, note), affichée dans le panneau. Le fichier vient du dossier
     DONNEES.medias; son crédit est composé par build.py à partir de
     medias/sources.yml, dans le bloc caché .cau__credits. Une image absente
     laisse sa légende seule, sans cadre vide.
     Les faits suivent l'ordre chronologique. Chaque fait nomme ses causes,
     qui doivent le précéder, avec le texte qui explique le lien. Un fait
     sans cause est un point de départ. Le bloc pieges, facultatif, donne
     une rétroaction précise pour une mauvaise réponse prévisible. */
  var DONNEES = {
    "faits": [
      {
        "id": "paix",
        "date": "Vers l'an 1000",
        "titre": "La Paix de Dieu",
        "texte": "L'Église demande aux seigneurs et aux chevaliers de respecter des moments de paix. Il est interdit d'attaquer les paysans, le bétail et les moulins.",
        "causes": []
      },
      {

     la taille du texte des cartes se règle pour que tous les faits y
     tiennent, entre 15 et 26 pixels. Le calcul se refait seulement quand
     la taille du composant change, pour que les cartes ne bougent pas
     pendant le jeu. */
  function ajusterEchelle() {
    racine.classList.add("est-mesure");
    mesurerEchelle();
    racine.classList.remove("est-mesure");
  }
  function mesurerEchelle() {
    liste.style.removeProperty("font-size");
    if (!racine.classList.contains("est-plein-ecran") || impression) { return; }
    if (window.matchMedia && window.matchMedia("(max-width: 48rem)").matches) { return; }
    var style = window.getComputedStyle(chaine);
    var dispo = chaine.clientHeight - (parseFloat(style.paddingTop) || 0) - (parseFloat(style.paddingBottom) || 0);
    if (!(dispo > 0)) { return; }
    var caches = [];
    elements.forEach(function (e) { if (e.li.hidden) { caches.push(e.li); e.li.hidden = false; } });
    liste.style.minHeight = "0px";
    var taille = parseFloat(window.getComputedStyle(liste).fontSize) || 16;
    for (var k = 0; k < 3; k++) {
      var h = liste.offsetHeight;
      if (!(h > 0)) { break; }
      taille = Math.max(15, Math.min(26, taille * dispo / h));
      liste.style.fontSize = taille.toFixed(2) + "px";
    }
    liste.style.removeProperty("min-height");
    caches.forEach(function (li) { li.hidden = true; });
  }

  var dessinPrevu = false;
  function planifierDessin() {
    if (dessinPrevu) { return; }
    dessinPrevu = true;
    var rappel = function () { dessinPrevu = false; dessiner(); };
    if (window.requestAnimationFrame) { window.requestAnimationFrame(rappel); } else { setTimeout(rappel, 16); }
  }
  function forme(nom, attributs, classes) {
    var n = document.createElementNS(SVGNS, nom);
    Object.keys(attributs).forEach(function (k) { n.setAttribute(k, attributs[k]); });
    n.setAttribute("class", classes);
    return n;
  }
  function dessiner() {
    while (svg.firstChild) { svg.removeChild(svg.firstChild); }
    var style = window.getComputedStyle(chaine);
    var gauche = parseFloat(style.paddingLeft) || 0;
    var hauteur = liste.offsetTop + liste.offsetHeight + (parseFloat(style.paddingBottom) || 0);
    svg.setAttribute("width", String(Math.max(0, Math.round(gauche))));
    svg.setAttribute("height", String(Math.max(0, Math.round(hauteur))));
    var x0 = gauche - 5;
    var explorer = etat.mode === "explorer";
    var tout = explorer || impression;
    var choisi = explorer ? etat.choisi : null;
    var cible = !explorer && etat.courant >= 0 ? faits[etat.courant].id : null;
    liens.forEach(function (l) {
      var k = cle(l.de, l.vers);
      if (!tout && !etat.trouves[k]) { return; }
      var a = elements[rang[l.de]].carte;
      var b = elements[rang[l.vers]].carte;
      if (elements[rang[l.de]].li.hidden || elements[rang[l.vers]].li.hidden) { return; }
      var ya = a.offsetTop + a.offsetHeight * 0.66;
      var yb = b.offsetTop + b.offsetHeight * 0.34;
      var d = rang[l.vers] - rang[l.de];
      var bombe = Math.max(8, Math.min(10 + (d - 1) * 8, x0 - 6));
      var classes = "";
      if (choisi) {
        classes = l.vers === choisi ? " est-cause" : l.de === choisi ? " est-consequence" : " est-attenue";
      } else if (cible && l.vers === cible) {
        classes = " est-cause";
      }
      var chemin = forme("path", {
        d: "M" + x0 + " " + ya.toFixed(1) + " C" + (x0 - bombe) + " " + ya.toFixed(1) + " " + (x0 - bombe) + " " + yb.toFixed(1) + " " + x0 + " " + yb.toFixed(1),
        "data-de": l.de, "data-vers": l.vers
      }, "cau__lien" + classes);
      svg.appendChild(chemin);
      svg.appendChild(forme("circle", { cx: x0, cy: ya.toFixed(1), r: 2.6 }, "cau__origine" + classes));
      svg.appendChild(forme("path", {
        d: "M" + (x0 + 3) + " " + yb.toFixed(1) + " L" + (x0 - 4) + " " + (yb - 4.5).toFixed(1) + " L" + (x0 - 4) + " " + (yb + 4.5).toFixed(1) + " Z"
      }, "cau__pointe" + classes));
      if (etat.nouveau === k && !explorer && !reduit && chemin.getTotalLength) {
        var longueur = chemin.getTotalLength();
        if (longueur > 0) {
          chemin.style.transition = "none";
          chemin.style.strokeDasharray = longueur;
          chemin.style.strokeDashoffset = longueur;
          chemin.getBoundingClientRect();
          chemin.style.transition = "";
          chemin.style.strokeDashoffset = "0";
        }
        etat.nouveau = null;
      }
    });
  }

  panneau.addEventListener("click", function (e) {
    var cibleClic = e.target.closest ? e.target.closest("[data-action], [data-aller]") : null;
    if (!cibleClic) { return; }
    var nom = cibleClic.getAttribute("data-action");
    if (nom === "suivant") {
      avancer();
      etat.premier = false;
      rendre();
      var carte = elements[etat.courant].carte;
      if (carte.scrollIntoView) { carte.scrollIntoView({ block: "nearest", behavior: reduit ? "auto" : "smooth" }); }
      panneau.focus({ preventScroll: true });
    } else if (nom === "explorer") {
      etat.mode = "explorer";
      etat.choisi = null;
      rendre();
    } else if (nom === "recommencer") {
      demarrer();
      rendre();
    } else if (cibleClic.hasAttribute("data-aller")) {
      etat.choisi = cibleClic.getAttribute("data-aller");
      rendre();
      var c = elements[rang[etat.choisi]].carte;
      if (c.scrollIntoView) { c.scrollIntoView({ block: "nearest", behavior: reduit ? "auto" : "smooth" }); }
      c.focus({ preventScroll: true });
    }
  });
  boutonsMode.forEach(function (b) {
    b.addEventListener("click", function () {
      etat.mode = b.getAttribute("data-mode");
      rendre();
    });
  });
  recommencer.addEventListener("click", function () { demarrer(); rendre(); });
  replier.addEventListener("click", function () {
    var masque = racine.classList.toggle("texte-masque");
    replier.setAttribute("aria-expanded", masque ? "false" : "true");
    replier.textContent = masque ? "Afficher le texte" : "Masquer le texte";
    planifierDessin();
  });

  var largeurConnue = -1;
  var cadreConnu = "";
  function surRedimension() {
    var w = racine.clientWidth;
    if (w !== largeurConnue) { largeurConnue = w; placerPanneau(); }
    var plein = racine.classList.contains("est-plein-ecran");
    var cadre = plein ? w + "x" + racine.clientHeight : "";
    if (cadre !== cadreConnu) { cadreConnu = cadre; ajusterEchelle(); }
    planifierDessin();
  }
  if (window.ResizeObserver) {
    var observateur = new window.ResizeObserver(surRedimension);
    observateur.observe(racine);
    observateur.observe(liste);
  } else {
    window.addEventListener("resize", surRedimension);
  }
  if (window.MutationObserver) {
    var pleinAvant = false;
    new window.MutationObserver(function () {
      var plein = racine.classList.contains("est-plein-ecran");
      if (plein === pleinAvant) { return; }
      pleinAvant = plein;
      placerPanneau();
      cadreConnu = plein ? racine.clientWidth + "x" + racine.clientHeight : "";
      ajusterEchelle();
      chaine.scrollTop = 0;
      cote.scrollTop = 0;
      planifierDessin();
    }).observe(racine, { attributes: true, attributeFilter: ["class"] });
  }
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(function () { ajusterEchelle(); planifierDessin(); }); }
  window.addEventListener("beforeprint", function () { impression = true; rendre(); dessiner(); });
  window.addEventListener("afterprint", function () { impression = false; rendre(); });

  demarrer();
  rendre();
  racine.classList.add("est-pret");
})();
</script>
