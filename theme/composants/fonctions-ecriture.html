<section class="fnc" id="fonctions-ecriture" aria-roledescription="carrousel" aria-label="Les fonctions de l'écriture dans la société mésopotamienne">
<style>
.fnc { margin: 1.2rem 0 2rem; border: 1px solid var(--trait); border-radius: var(--rayon); background: var(--surface); overflow: hidden; }
.fnc__entete { background: var(--matiere-fonce); color: #fff; padding: .9rem 1.4rem; display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.fnc__titre { margin: 0; font-family: var(--titre); font-weight: 700; font-size: 1.05rem; letter-spacing: -.01em; }
.fnc__consigne { margin: 0; font-family: var(--donnee); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.65); }
.fnc__piste { position: relative; }
.fnc__fiche { display: none; padding: 1.4rem 1.6rem 1.2rem; }
.fnc__fiche.est-visible { display: block; }
.fnc__haut { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; border-bottom: 3px solid var(--matiere); padding-bottom: .7rem; margin-bottom: 1rem; flex-wrap: wrap; }
.fnc__objet { margin: 0; font-family: var(--titre); font-weight: 700; font-size: 1.35rem; letter-spacing: -.02em; }
.fnc__wiki { font-family: var(--titre); font-weight: 600; font-size: .74rem; text-decoration: none; color: var(--matiere-fonce); background: var(--matiere-voile); padding: .28rem .75rem; border-radius: 100px; white-space: nowrap; }
.fnc__wiki:hover { background: var(--matiere); color: #fff; }
.fnc__contenu { display: grid; grid-template-columns: minmax(0, 1fr) 15rem; gap: 1.3rem; align-items: start; }
.fnc__figure { margin: 0; grid-column: 2; grid-row: 1 / span 4; }
.fnc__figure img { width: 100%; height: auto; display: block; border-radius: var(--rayon); border: 1px solid var(--trait); background: #fff; }
.fnc__figure figcaption { margin-top: .45rem; }
.fnc__figure.est-absente { display: none; }
@media (max-width: 52rem) { .fnc__contenu { grid-template-columns: 1fr; } .fnc__figure { grid-column: 1; grid-row: auto; max-width: 17rem; } }
.fnc__grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(11.5rem, 1fr)); gap: .8rem 1.4rem; margin-bottom: 1.1rem; }
.fnc__grille dt { font-family: var(--donnee); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--encre-pale); margin-bottom: .12rem; }
.fnc__grille dd { margin: 0; font-family: var(--titre); font-weight: 500; font-size: .92rem; line-height: 1.35; }
.fnc__description { margin: 0 0 1.1rem; padding: .8rem 1.1rem; background: var(--surface-2); border-left: 3px solid var(--matiere); font-style: italic; font-size: .98rem; line-height: 1.6; border-radius: 0 var(--rayon) var(--rayon) 0; }
.fnc__reveler { display: inline-flex; align-items: center; gap: .55rem; font-family: var(--titre); font-weight: 600; font-size: .92rem; color: #fff; background: var(--matiere-fonce); border: 0; border-radius: 100px; padding: .6rem 1.25rem; cursor: pointer; transition: transform .15s, box-shadow .15s; }
.fnc__reveler:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(26,37,48,.25); }
.fnc__reveler[aria-expanded="true"] { display: none; }
.fnc__reponse { display: none; margin: 0; padding: 1rem 1.2rem; background: var(--matiere-fonce); color: #fff; border-radius: var(--rayon); font-size: .98rem; line-height: 1.65; }
.fnc__reponse.est-visible { display: block; }
.fnc__etiquette { display: inline-block; font-family: var(--donnee); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; background: var(--signal); color: #1A2530; padding: .18rem .6rem; border-radius: 100px; margin-bottom: .55rem; }
.fnc__nav { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .85rem 1.4rem; border-top: 1px solid var(--trait); background: var(--surface-2); flex-wrap: wrap; }
.fnc__bouton { font-family: var(--titre); font-weight: 600; font-size: .88rem; color: var(--matiere-fonce); background: var(--surface); border: 1px solid var(--trait); border-radius: 100px; padding: .5rem 1.15rem; cursor: pointer; transition: background .15s, color .15s; }
.fnc__bouton:hover { background: var(--matiere); border-color: var(--matiere); color: #fff; }
.fnc__points { display: flex; gap: .55rem; align-items: center; }
.fnc__point { width: .8rem; height: .8rem; padding: 0; border-radius: 50%; border: 0; background: var(--trait); cursor: pointer; transition: transform .15s, background .15s; }
.fnc__point.est-actif { background: var(--matiere); transform: scale(1.35); }
.fnc__compteur { font-family: var(--donnee); font-size: .74rem; color: var(--encre-doux); min-width: 3.2rem; text-align: right; }
html[data-sombre="on"] .fnc__reveler, html[data-sombre="on"] .fnc__reponse, html[data-sombre="on"] .fnc__entete { background: var(--matiere-voile); color: var(--encre); }
html[data-sombre="on"] .fnc__consigne { color: var(--encre-pale); }
@media (max-width: 40rem) { .fnc__fiche { padding: 1.1rem 1rem 1rem; } .fnc__nav { padding: .75rem 1rem; } }
@media print { .fnc__fiche { display: block; page-break-inside: avoid; } .fnc__reponse { display: block; background: none; color: inherit; border: 1px solid #999; } .fnc__reveler, .fnc__nav { display: none; } }
</style>
<header class="fnc__entete">
<h3 class="fnc__titre">Les fonctions de l'écriture dans la société mésopotamienne</h3>
<p class="fnc__consigne">Observe chaque document, devine sa fonction, puis vérifie</p>
</header>
<div class="fnc__medias" hidden>
<figure class="fnc__figure" data-fnc-figure="0">
<img src="../medias/02-emergence-civilisation/code-hammourabi.jpg" alt="La stèle du Code d'Hammourabi, au Louvre" loading="lazy"
     onerror="this.closest('.fnc__figure').classList.add('est-absente')">

<figure class="fnc__figure" data-fnc-figure="1">
<img src="../medias/02-emergence-civilisation/cadastre-shulgi.jpg" alt="Liste d'inventaire de l'époque de Shulgi, musée d'Istanbul" loading="lazy"
     onerror="this.closest('.fnc__figure').classList.add('est-absente')">
<figcaption>{{credit:cadastre-shulgi.jpg}}</figcaption>
</figure>
<figure class="fnc__figure" data-fnc-figure="2">
<img src="../medias/02-emergence-civilisation/plimpton-322.jpg" alt="La tablette Plimpton 322, Université Columbia" loading="lazy"
     onerror="this.closest('.fnc__figure').classList.add('est-absente')">
<figcaption>{{credit:plimpton-322.jpg}}</figcaption>

<img src="../medias/02-emergence-civilisation/stele-mesha.jpg" alt="La stèle de Mesha, au Louvre" loading="lazy"
     onerror="this.closest('.fnc__figure').classList.add('est-absente')">
<figcaption>{{credit:stele-mesha.jpg}}</figcaption>

<img src="../medias/02-emergence-civilisation/traite-qadesh.jpg" alt="La tablette du traité de Qadesh, musée d'Istanbul" loading="lazy"
     onerror="this.closest('.fnc__figure').classList.add('est-absente')">
<figcaption>{{credit:traite-qadesh.jpg}}</figcaption>
</figure>
<figure class="fnc__figure" data-fnc-figure="5">
<img src="../medias/02-emergence-civilisation/tablette-gilgamesh.jpg" alt="La tablette du Déluge, British Museum" loading="lazy"
     onerror="this.closest('.fnc__figure').classList.add('est-absente')">
<figcaption>{{credit:tablette-gilgamesh.jpg}}</figcaption>
</figure>
</div>
<div class="fnc__piste"></div>
<div class="fnc__nav">
<button type="button" class="fnc__bouton" data-fnc="prec">&#10094; Précédent</button>
<div class="fnc__points" role="tablist" aria-label="Choisir un document"></div>
<span class="fnc__compteur" aria-hidden="true"></span>
<button type="button" class="fnc__bouton" data-fnc="suiv">Suivant &#10095;</button>
</div>
<script>
(function () {
  "use strict";
  var FICHES = [
    { objet: "Le Code d'Hammourabi",
      wiki: "https://fr.wikipedia.org/wiki/Code_de_Hammurabi",
      infos: [["Type", "Stèle de lois"], ["Datation", "Vers 1755 à 1750 av. J.-C."],
              ["Matériau", "Basalte noir"], ["Dimensions", "2,25 mètres de hauteur"],
              ["Lieu de découverte", "Suse, Iran (1901)"], ["Conservation", "Musée du Louvre, Paris"]],
      description: "Le Code d'Hammourabi constitue l'un des codes de lois les plus anciens et les mieux conservés de l'Antiquité. Cette stèle monumentale offre un aperçu crucial de la structure sociale et judiciaire de la Mésopotamie babylonienne.",
      fonction: "politique et judiciaire",
      reponse: "Afin de faire régner l'ordre dans les villes mésopotamiennes, Hammourabi, le roi de Babylone, a fait graver l'ensemble de ses lois sur une stèle de basalte. Il y inclut même les jugements, qui varient selon le statut social du coupable. En fixant ses lois, il rend la justice plus prévisible et permet sa diffusion, grâce aux scribes, à travers tout son royaume." },
    { objet: "Les textes cadastraux de Shulgi",
      wiki: "https://fr.wikipedia.org/wiki/Shulgi",
      infos: [["Type", "Tablettes administratives"], ["Datation", "Vers 2094 à 2047 av. J.-C."],
              ["Matériau", "Tablettes d'argile"], ["Période", "Troisième dynastie d'Ur (Ur III)"],
              ["Lieu de découverte", "Ur, Nippur, Puzrish-Dagan"], ["Conservation", "Louvre, British Museum, Penn Museum"]],
      description: "Les textes cadastraux de Shulgi témoignent du niveau extraordinaire de bureaucratie et de gestion centralisée de l'empire d'Ur III. Ces documents administratifs sont fondamentaux pour comprendre l'économie et l'administration mésopotamiennes à leur apogée.",
      fonction: "économique et administrative",
      reponse: "Les premiers cadastres apparaissent vers 3000 av. J.-C. Ils servaient à marquer les divisions territoriales et à déterminer à qui appartenait la propriété. Grâce à l'écriture, l'État peut compter, enregistrer et percevoir : rien ne se perd, tout laisse une trace." },
    { objet: "La tablette Plimpton 322",
      wiki: "https://fr.wikipedia.org/wiki/Plimpton_322",
      infos: [["Type", "Tablette mathématique"], ["Datation", "Vers 1800 av. J.-C."],
              ["Matériau", "Tablette d'argile"], ["Période", "Paléo-babylonienne"],
              ["Lieu de découverte", "Probablement Larsa, Irak"], ["Conservation", "Université Columbia, New York"]],
      description: "La tablette Plimpton 322 représente l'un des textes mathématiques les plus célèbres de l'Antiquité. Elle prouve que les Babyloniens maîtrisaient la géométrie et la théorie des nombres bien avant les Grecs.",
      fonction: "culturelle et scientifique",
      reponse: "Cette tablette, rédigée vers 1800 av. J.-C., comporte un tableau de nombres cunéiformes rangés en 4 colonnes sur 15 lignes. Ces nombres correspondent à ce qu'on appelle aujourd'hui des triplets pythagoriciens, c'est-à-dire des nombres entiers a, b et c qui vérifient la relation a² + b² = c², comme 3, 4 et 5. L'écriture permet ici la diffusion du savoir et l'avancement des connaissances." },
    { objet: "La stèle de Mesha",
      wiki: "https://fr.wikipedia.org/wiki/St%C3%A8le_de_Mesha",
      infos: [["Type", "Stèle de victoire"], ["Datation", "Vers 840 av. J.-C."],
              ["Matériau", "Basalte noir"], ["Dimensions", "Environ 1 mètre de hauteur"],
              ["Lieu de découverte", "Dhiban, Jordanie (1868)"], ["Conservation", "Musée du Louvre, Paris"]],
      description: "La stèle de Mesha est une source majeure qui corrobore, du point de vue moabite, des événements décrits dans la Bible. Cette inscription mentionne Israël et le roi Omri.",
      fonction: "politique",
      reponse: "Sur cette stèle de basalte est gravée une inscription de trente-quatre lignes remontant à l'époque du roi Mesha. Elle raconte les victoires de Mesha au cours de sa révolte contre le royaume d'Israël. L'écriture est ici utilisée afin de montrer la puissance du roi et de faire durer sa gloire bien après son règne." },
    { objet: "Le traité de Qadesh",
      wiki: "https://fr.wikipedia.org/wiki/Trait%C3%A9_de_paix_%C3%A9gypto-hittite",
      infos: [["Type", "Traité de paix"], ["Datation", "Vers 1259 av. J.-C."],
              ["Matériau", "Pierre (Égypte) et argile (Hittites)"], ["Signataires", "Ramsès II et Hattusili III"],
              ["Lieu de découverte", "Karnak, Abydos et Hattusa"], ["Conservation", "Sur place (Égypte) et Istanbul (Turquie)"]],
      description: "Le traité de Qadesh est le plus ancien traité de paix international dont les textes nous soient parvenus. Il a été conclu vers 1259 av. J.-C. entre l'Empire égyptien de Ramsès II et l'Empire hittite d'Hattusili III, mettant fin à un long conflit pour le contrôle du Levant.",
      fonction: "diplomatique et politique",
      reponse: "Ce traité met fin au conflit qui a suivi la bataille de Qadesh. Il établit une paix éternelle, un pacte de non-agression, une alliance défensive mutuelle et des clauses sur l'extradition des réfugiés politiques. En fixant l'entente par écrit, dans les deux langues, chaque empire peut exiger de l'autre qu'il respecte sa parole." },
    { objet: "L'épopée de Gilgamesh",
      wiki: "https://fr.wikipedia.org/wiki/%C3%89pop%C3%A9e_de_Gilgamesh",
      infos: [["Type", "Poème épique"], ["Datation", "1300 à 1000 av. J.-C. (version standard)"],
              ["Matériau", "Tablettes d'argile"], ["Structure", "12 tablettes (version akkadienne)"],
              ["Lieu de découverte", "Bibliothèque d'Assurbanipal, Ninive"], ["Conservation", "British Museum, Londres"]],
      description: "L'épopée de Gilgamesh est une oeuvre fondatrice qui explore des thèmes universels comme l'amitié, la peur de la mort et la quête de sens. La tablette XI contient un récit du Déluge qui présente des parallèles frappants avec le récit biblique de Noé.",
      fonction: "religieuse et littéraire",
      reponse: "Écrite en caractères cunéiformes sur des tablettes d'argile, l'épopée raconte les aventures de Gilgamesh, roi d'Uruk. Les historiens ne s'entendent pas sur sa réelle existence, mais ce récit fait de lui une figure divine de la Mésopotamie. L'écriture permet ici de transmettre un récit mythique et des croyances de génération en génération." }
  ];

  var racine = document.getElementById("fonctions-ecriture");
  if (!racine) return;
  var piste = racine.querySelector(".fnc__piste");
  var points = racine.querySelector(".fnc__points");
  var compteur = racine.querySelector(".fnc__compteur");
  var courante = 0;

  function texte(tag, classe, contenu) {
    var el = document.createElement(tag);
    if (classe) el.className = classe;
    if (contenu) el.textContent = contenu;
    return el;
  }

  FICHES.forEach(function (f, i) {
    var fiche = texte("article", "fnc__fiche");
    fiche.setAttribute("role", "group");
    fiche.setAttribute("aria-roledescription", "document");
    fiche.setAttribute("aria-label", f.objet + ", document " + (i + 1) + " de " + FICHES.length);

    var haut = texte("div", "fnc__haut");
    haut.appendChild(texte("h4", "fnc__objet", f.objet));
    var wiki = texte("a", "fnc__wiki", "Page Wikipédia");
    wiki.href = f.wiki; wiki.target = "_blank"; wiki.rel = "noopener noreferrer";
    haut.appendChild(wiki);
    fiche.appendChild(haut);

    var contenu = texte("div", "fnc__contenu");
    var grille = texte("dl", "fnc__grille");
    f.infos.forEach(function (paire) {
      var d = texte("div");
      d.appendChild(texte("dt", "", paire[0]));
      d.appendChild(texte("dd", "", paire[1]));
      grille.appendChild(d);
    });
    contenu.appendChild(grille);
    contenu.appendChild(texte("p", "fnc__description", f.description));
    var figure = racine.querySelector('[data-fnc-figure="' + i + '"]');
    if (figure) contenu.appendChild(figure);

    var reponse = texte("div", "fnc__reponse");
    reponse.id = "fnc-reponse-" + i;
    reponse.appendChild(texte("span", "fnc__etiquette", "Fonction " + f.fonction));
    reponse.appendChild(texte("p", "", f.reponse));
    reponse.lastChild.style.margin = "0";

    var reveler = texte("button", "fnc__reveler", "Quelle est la fonction de l'écriture ici ? Révèle la réponse");
    reveler.type = "button";
    reveler.setAttribute("aria-expanded", "false");
    reveler.setAttribute("aria-controls", reponse.id);
    reveler.addEventListener("click", function () {
      reveler.setAttribute("aria-expanded", "true");
      reponse.classList.add("est-visible");
    });
    contenu.appendChild(reveler);
    contenu.appendChild(reponse);
    fiche.appendChild(contenu);
    piste.appendChild(fiche);

    var point = texte("button", "fnc__point");
    point.type = "button";
    point.setAttribute("aria-label", "Document " + (i + 1) + " : " + f.objet);
    point.addEventListener("click", function () { montrer(i); });
    points.appendChild(point);
  });

  var fiches = piste.children;
  var pastilles = points.children;

  function montrer(i) {
    courante = (i + FICHES.length) % FICHES.length;
    Array.prototype.forEach.call(fiches, function (f, j) {
      f.classList.toggle("est-visible", j === courante);
    });
    Array.prototype.forEach.call(pastilles, function (p, j) {
      p.classList.toggle("est-actif", j === courante);
      p.setAttribute("aria-current", j === courante ? "true" : "false");
    });
    compteur.textContent = (courante + 1) + " / " + FICHES.length;
  }

  racine.querySelector('[data-fnc="prec"]').addEventListener("click", function () { montrer(courante - 1); });
  racine.querySelector('[data-fnc="suiv"]').addEventListener("click", function () { montrer(courante + 1); });

  racine.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { montrer(courante - 1); e.stopPropagation(); }
    if (e.key === "ArrowRight") { montrer(courante + 1); e.stopPropagation(); }
  });

  var departX = null;
  piste.addEventListener("touchstart", function (e) { departX = e.touches[0].clientX; }, { passive: true });
  piste.addEventListener("touchend", function (e) {
    if (departX === null) return;
    var ecart = departX - e.changedTouches[0].clientX;
    if (Math.abs(ecart) > 50) montrer(courante + (ecart > 0 ? 1 : -1));
    departX = null;
  }, { passive: true });

  var reserve = racine.querySelector(".fnc__medias");
  if (reserve) reserve.remove();
  montrer(0);
})();
</script>
</section>
