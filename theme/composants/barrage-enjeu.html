  Pour créer une nouvelle instance (une autre fiche, un autre enjeu) :

  3. remplacer seulement le bloc JSON (mêmes clés : titre, consigne, question, intro, documents,
     criteres, groupes, echelle, textes). Les libellés absents de « textes » prennent
     une valeur par défaut.

          '<p class="enj__question-pos">' + echapper(T.quelCritere) + '</p><div class="enj__choix" role="group" aria-label="' + echapper(T.quelCritere) + '">' +
          CRITERES.map(function (c) { return '<button type="button" class="enj__outil" data-priorite="' + echapper(c.cle) + '" aria-pressed="' + (etat.priorite === c.cle ? "true" : "false") + '">' + echapper(c.court || c.nom) + "</button>"; }).join("") + "</div>" +
          '<p class="enj__question-pos"><label for="' + racine.id + '-justif">' + echapper(T.justifier) + "</label></p>" +
          '<textarea class="enj__justif" id="' + racine.id + '-justif" rows="4"></textarea><p class="enj__amorce">' + echapper(T.amorce || "") + "</p>" +
          '<div class="enj__actions"><button type="button" class="enj__principal" data-action="synthese">' + echapper(T.voirSynthese) + "</button></div>" +
          '<div class="enj__synthese" hidden aria-live="polite"></div>' +
        "</div>";
    }

    // Rétroaction : aucune bonne réponse imposée, des pistes pour mieux justifier.
    function retroactions() {
      var r = [], g = etat.appui ? PAR_CLE[etat.appui] : null, c = null;
      CRITERES.forEach(function (x) { if (x.cle === etat.priorite) { c = x; } });
      var evalues = complets();
      if (!g) { r.push(["attention", "Choisis la proposition que tu appuies."]); return r; }
      if (nbNotes(g.cle) < CRITERES.length) { r.push(["attention", "Évalue d'abord la proposition que tu appuies selon les " + CRITERES.length + " critères."]); }
      if (evalues.length < 2) { r.push(["attention", "Évalue au moins une autre proposition pour pouvoir comparer."]); }
      if (!c) { r.push(["attention", "Indique le critère qui compte le plus pour toi."]); }
      var n = etat.notes[g.cle] || {};
      if (c && n[c.cle] === 0) { r.push(["attention", "Tu dis que «" + NB + (c.court || c.nom) + NB + "» compte le plus, mais tu juges que cette proposition ne le respecte pas. Explique ce choix ou revois ton évaluation."]); }
      if (c && n[c.cle] === MAX) { r.push(["ok", "Ton choix est cohérent avec ton critère le plus important."]); }
      var meilleur = null;
      evalues.forEach(function (x) { if (x.cle !== g.cle && total(x.cle) > total(g.cle) && (!meilleur || total(x.cle) > total(meilleur.cle))) { meilleur = x; } });
      if (meilleur && nbNotes(g.cle) === CRITERES.length) { r.push(["attention", "La proposition «" + NB + (meilleur.court || meilleur.nom) + NB + "» obtient un meilleur score (" + total(meilleur.cle) + " points contre " + total(g.cle) + "). Explique pourquoi tu préfères quand même la tienne."]); }
      var mots = (justifTexte || "").trim().split(/\s+/).filter(Boolean).length;
      if (mots === 0) { r.push(["attention", "Écris ta justification."]); }
      else if (mots < 20) { r.push(["attention", "Ta justification est courte. Ajoute un fait tiré d'un document ou d'un argument de groupe."]); }
      else { r.push(["ok", "Ta justification est assez développée. Vérifie qu'elle s'appuie sur au moins un fait."]); }
      return r;
    }
    function phrasePiste() {
      var g = etat.appui ? PAR_CLE[etat.appui] : null;
      if (!g || !nbNotes(g.cle)) { return ""; }
      var n = etat.notes[g.cle] || {}, pour = [], contre = [];
      CRITERES.forEach(function (c) { if (n[c.cle] === MAX) { pour.push(c.oui); } else if (n[c.cle] === 0) { contre.push(c.non); } });
      var p = "J'appuie la proposition de «" + NB + (g.court || g.nom) + NB + "»";
      if (pour.length) { p += " parce qu'elle " + pour.join(" et qu'elle ") + "."; } else { p += "."; }
      if (contre.length) { p += " Elle a toutefois une limite" + NB + ": elle " + contre[0] + "."; }
      return p;
    }
    function rendreSynthese() {
      var boite = fenetre.querySelector(".enj__synthese");
      if (!boite) { return; }
      if (!etat.synthese) { boite.hidden = true; boite.innerHTML = ""; return; }
      var g = etat.appui ? PAR_CLE[etat.appui] : null, c = null;
      CRITERES.forEach(function (x) { if (x.cle === etat.priorite) { c = x; } });
      var piste = phrasePiste();
      boite.innerHTML =
        '<p class="enj__section-nom">' + echapper(T.synthese) + "</p>" +
        '<p class="enj__synthese-ligne"><strong>Proposition appuyée' + NB + ":</strong> " + echapper(g ? g.nom : "aucune") + (g && nbNotes(g.cle) ? " (" + total(g.cle) + NB + "/" + NB + (MAX * CRITERES.length) + ")" : "") + "</p>" +
        '<p class="enj__synthese-ligne"><strong>Critère le plus important' + NB + ":</strong> " + echapper(c ? c.nom : "aucun") + "</p>" +
        '<p class="enj__synthese-ligne"><strong>' + echapper(T.evaluees) + NB + ":</strong> " + complets().length + " " + T.sur + " " + GROUPES.length + "</p>" +
        ((justifTexte || "").trim() ? '<p class="enj__synthese-ligne"><strong>Ma justification' + NB + ":</strong></p><p class=\"enj__citation\">" + echapper(justifTexte.trim()) + "</p>" : "") +
        (piste ? '<p class="enj__synthese-ligne"><strong>Une phrase pour démarrer' + NB + ":</strong> " + echapper(piste) + "</p>" : "") +
        '<ul class="enj__retro">' + retroactions().map(function (x) { return '<li class="est-' + x[0] + '">' + echapper(x[1]) + "</li>"; }).join("") + "</ul>";
      boite.hidden = false;
    }

    // ------------------------------------------------------------ rendu d'ensemble
    function rendreEtapes() {
      chaque(zoneEtapes.querySelectorAll(".enj__etape"), function (b) {
        var i = Number(b.getAttribute("data-fenetre"));
        if (i === etat.fenetre) { b.setAttribute("aria-current", "step"); } else { b.removeAttribute("aria-current"); }
        if (i >= 1 && i <= GROUPES.length) {
          var k = nbNotes(GROUPES[i - 1].cle);
          b.classList.toggle("est-complete", k === CRITERES.length);
          b.classList.toggle("est-partielle", k > 0 && k < CRITERES.length);
          b.setAttribute("title", etatEval(GROUPES[i - 1]));
        }
      });
    }
    function rendreNav() {
      var f = etat.fenetre;
      btPrec.hidden = f === 0;
      btSuiv.hidden = f === DERNIERE;
      btSuiv.textContent = f === 0 ? T.commencer : (f === GROUPES.length ? T.voirBilan : T.suivant);
      milieu.textContent = f === 0 ? T.depart : (f === DERNIERE ? T.bilanFenetre : T.groupe + " " + f + " " + T.sur + " " + GROUPES.length);
    }
    function rendreFenetre() {
      var f = etat.fenetre;
      fenetre.innerHTML = f === 0 ? fenetreDepart() : (f === DERNIERE ? fenetreBilan() : fenetreGroupe(f));
      var titre = fenetre.querySelector(".enj__fenetre-titre");
      if (titre) { titre.id = titreId(); }
      fenetre.setAttribute("aria-labelledby", titreId());
      var j = fenetre.querySelector(".enj__justif");
      if (j) { j.value = justifTexte; j.addEventListener("input", function () { justifTexte = j.value; if (etat.synthese) { rendreSynthese(); } }); }
      rendreSynthese();
    }
    function tout() { rendreEtapes(); rendreNav(); rendreFenetre(); }

    function aller(i, avecFocus) {
      i = Math.max(0, Math.min(DERNIERE, Number(i) || 0));
      var sens = i >= etat.fenetre ? 1 : -1;
      etat.fenetre = i;
      tout();
      scene.scrollTop = 0;
      if (!reduit) {
        fenetre.style.setProperty("--enj-dx", (sens * 12) + "px");
        fenetre.classList.remove("est-entree"); void fenetre.offsetWidth; fenetre.classList.add("est-entree");
      }
      if (avecFocus) {
        var t = fenetre.querySelector(".enj__fenetre-titre");
        if (t && t.focus) { t.focus({ preventScroll: true }); }
        var haut = racine.getBoundingClientRect ? racine.getBoundingClientRect().top : 0;
        if (haut < 0 && racine.scrollIntoView && !racine.classList.contains("est-plein-ecran")) { racine.scrollIntoView({ block: "start", behavior: reduit ? "auto" : "smooth" }); }
      }
      dire(i === 0 ? T.depart : (i === DERNIERE ? T.bilanFenetre : T.groupe + " " + i + " " + T.sur + " " + GROUPES.length + NB + ": " + GROUPES[i - 1].nom));
    }
    function noter(critere, valeur) {
      var f = etat.fenetre;
      if (f < 1 || f > GROUPES.length) { return; }
      var cle = GROUPES[f - 1].cle;
      var n = etat.notes[cle] || (etat.notes[cle] = {});
      if (n[critere] === valeur) { delete n[critere]; } else { n[critere] = valeur; }
      rendreEtapes();
      chaque(fenetre.querySelectorAll('.enj__note[data-critere="' + critere + '"]'), function (b) { b.setAttribute("aria-pressed", n[critere] === Number(b.getAttribute("data-valeur")) ? "true" : "false"); });
      var e = fenetre.querySelector(".enj__etat-eval");
      if (e) { e.textContent = etatEval(GROUPES[f - 1]); e.classList.toggle("est-complete", nbNotes(cle) === CRITERES.length); }
    }
    function reinitialiser() {
      etat = etatDepart();
      justifTexte = "";
      tout();
      scene.scrollTop = 0;
      dire(T.annonceReinit);
    }

    racine.addEventListener("click", function (ev) {
      var cible = ev.target.closest ? ev.target.closest("button") : null;
      if (!cible || !racine.contains(cible)) { return; }
      if (cible.classList.contains("plein-ecran") || cible.classList.contains("reinitialiser")) { return; }
      if (cible.hasAttribute("data-fenetre")) {
        var i = Number(cible.getAttribute("data-fenetre"));
        // Un second clic sur l'étape en cours ramène au départ (désélection).
        if (cible.classList.contains("enj__etape") && i === etat.fenetre && i !== 0) { aller(0, true); return; }
        aller(i, true); return;
      }
      if (cible.hasAttribute("data-critere")) { noter(cible.getAttribute("data-critere"), Number(cible.getAttribute("data-valeur"))); return; }
      if (cible.hasAttribute("data-appui")) { var a = cible.getAttribute("data-appui"); etat.appui = etat.appui === a ? null : a; chaque(fenetre.querySelectorAll("[data-appui]"), function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-appui") === etat.appui ? "true" : "false"); }); var tb = fenetre.querySelector(".enj__tableau-bloc"); if (tb) { tb.innerHTML = tableau(); } if (etat.synthese) { rendreSynthese(); } return; }
      if (cible.hasAttribute("data-priorite")) { var p = cible.getAttribute("data-priorite"); etat.priorite = etat.priorite === p ? null : p; chaque(fenetre.querySelectorAll("[data-priorite]"), function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-priorite") === etat.priorite ? "true" : "false"); }); if (etat.synthese) { rendreSynthese(); } return; }
      var action = cible.getAttribute("data-action");
      if (action === "precedent") { aller(etat.fenetre - 1, true); return; }
      if (action === "suivant") { aller(etat.fenetre + 1, true); return; }
      if (action === "synthese") { etat.synthese = true; rendreSynthese(); var bx = fenetre.querySelector(".enj__synthese"); if (bx && bx.scrollIntoView) { bx.scrollIntoView({ block: "nearest", behavior: reduit ? "auto" : "smooth" }); } return; }
      if (action === "texte") {
        var masque = racine.classList.toggle("texte-masque");
        cible.setAttribute("aria-expanded", masque ? "false" : "true");
        cible.textContent = masque ? T.afficher : T.masquer;
      }
    });
    racine.addEventListener("keydown", function (ev) {
      var tag = ev.target && ev.target.tagName;
      if (tag === "TEXTAREA" || tag === "INPUT") { return; }
      if (ev.key === "ArrowRight" && etat.fenetre < DERNIERE) { ev.preventDefault(); aller(etat.fenetre + 1, true); }
      else if (ev.key === "ArrowLeft" && etat.fenetre > 0) { ev.preventDefault(); aller(etat.fenetre - 1, true); }
      else if (ev.key === "Escape" && etat.fenetre !== 0) { aller(0, true); }
    });
    racine.addEventListener("reinitialiser", reinitialiser);

    tout();
    // Accès pour les essais automatiques.
    racine.enjeu = { aller: aller, noter: noter, reinitialiser: reinitialiser, donnees: D,
      suivant: function () { aller(etat.fenetre + 1); }, precedent: function () { aller(etat.fenetre - 1); },
      etat: function () { return { fenetre: etat.fenetre, notes: JSON.parse(JSON.stringify(etat.notes)), appui: etat.appui, priorite: etat.priorite, synthese: etat.synthese, justification: justifTexte }; },
      total: total, retroactions: retroactions, phrasePiste: phrasePiste, derniere: DERNIERE };
  }

  chaque(document.querySelectorAll("section.enj"), function (racine) {
    if (racine.getAttribute("data-pret") === "1") { return; }
    var bloc = racine.querySelector("script.enj__donnees");
    if (!bloc) { return; }
    var D;
    try { D = JSON.parse(bloc.textContent); } catch (err) { racine.setAttribute("data-erreur", "données illisibles"); return; }
    racine.setAttribute("data-pret", "1");
    racine.classList.add("est-pret");
    demarrer(racine, D);
  });
})();
</script>
</section>
