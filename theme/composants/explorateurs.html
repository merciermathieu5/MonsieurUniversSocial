<section class="xpl" id="explorateurs" aria-roledescription="carrousel" aria-label="Les explorateurs des Grandes découvertes">
<style>
.xpl { margin: 1.2rem 0 2rem; border: 1px solid var(--trait); border-radius: var(--rayon); background: var(--surface); overflow: hidden; }
.xpl .xpl__entete { background: var(--matiere-fonce); color: #fff; padding: .55rem 1.2rem; display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.xpl .xpl__titre { margin: 0; font-family: var(--titre); font-weight: 700; font-size: .95rem; letter-spacing: -.01em; color: #fff; }
html[data-sombre="on"] .xpl .xpl__titre { color: var(--encre); }
.xpl__consigne { margin: 0; font-family: var(--donnee); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.65); }
.xpl__piste { position: relative; }
.xpl__fiche { display: none; padding: 1.4rem 1.6rem 1.2rem; }
.xpl__fiche.est-visible { display: block; }
.xpl__haut { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; border-bottom: 3px solid var(--matiere); padding-bottom: .7rem; margin-bottom: 1rem; flex-wrap: wrap; }
.xpl__nom { margin: 0; font-family: var(--titre); font-weight: 700; font-size: 1.35rem; letter-spacing: -.02em; }
.xpl__pavillon { font-family: var(--titre); font-weight: 600; font-size: .74rem; color: var(--matiere-fonce); background: var(--matiere-voile); padding: .28rem .75rem; border-radius: 100px; white-space: nowrap; }
.xpl__contenu { display: grid; grid-template-columns: minmax(0, 1fr) 14rem; gap: 1.3rem; align-items: start; }
.xpl__figure { margin: 0; grid-column: 2; grid-row: 1 / span 4; }
.xpl__figure img { width: 100%; height: auto; display: block; border-radius: var(--rayon); border: 1px solid var(--trait); background: #fff; }
.xpl__figure figcaption { margin-top: .45rem; }
.xpl__figure.est-absente { display: none; }
@media (max-width: 52rem) { .xpl__contenu { grid-template-columns: 1fr; } .xpl__figure { grid-column: 1; grid-row: auto; max-width: 16rem; } }
.xpl__grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); gap: .8rem 1.4rem; margin-bottom: 1.1rem; }
.xpl__grille dt { font-family: var(--donnee); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--encre-pale); margin-bottom: .12rem; }
.xpl__grille dd { margin: 0; font-family: var(--titre); font-weight: 500; font-size: .92rem; line-height: 1.35; }
.xpl__recit { margin: 0 0 1.1rem; padding: .8rem 1.1rem; background: var(--surface-2); border-left: 3px solid var(--matiere); font-size: .98rem; line-height: 1.6; border-radius: 0 var(--rayon) var(--rayon) 0; }
.xpl__reveler { display: inline-flex; align-items: center; gap: .55rem; font-family: var(--titre); font-weight: 600; font-size: .92rem; color: #fff; background: var(--matiere-fonce); border: 0; border-radius: 100px; padding: .6rem 1.25rem; cursor: pointer; transition: transform .15s, box-shadow .15s; }
.xpl__reveler:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(26,37,48,.25); }
.xpl__reveler[aria-expanded="true"] { display: none; }
.xpl__reponse { display: none; margin: 0; padding: 1rem 1.2rem; background: var(--matiere-fonce); color: #fff; border-radius: var(--rayon); font-size: .98rem; line-height: 1.65; }
.xpl__reponse.est-visible { display: block; }
.xpl__etiquette { display: inline-block; font-family: var(--donnee); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; background: var(--signal); color: #1A2530; padding: .18rem .6rem; border-radius: 100px; margin-bottom: .55rem; }
.xpl__nav { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .85rem 1.4rem; border-top: 1px solid var(--trait); background: var(--surface-2); flex-wrap: wrap; }
.xpl__bouton { font-family: var(--titre); font-weight: 600; font-size: .88rem; color: var(--matiere-fonce); background: var(--surface); border: 1px solid var(--trait); border-radius: 100px; padding: .5rem 1.15rem; cursor: pointer; transition: background .15s, color .15s; }
.xpl__bouton:hover { background: var(--matiere); border-color: var(--matiere); color: #fff; }
.xpl__points { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.xpl__point { width: .8rem; height: .8rem; padding: 0; border-radius: 50%; border: 0; background: var(--trait); cursor: pointer; transition: transform .15s, background .15s; }
.xpl__point.est-actif { background: var(--matiere); transform: scale(1.35); }
.xpl__point--defi { width: 1.5rem; border-radius: 100px; background: var(--signal); }
.xpl__compteur { font-family: var(--donnee); font-size: .74rem; color: var(--encre-doux); min-width: 3.2rem; text-align: right; }
.xpl__indice { margin: 0 0 1.1rem; padding: 1rem 1.2rem; background: var(--matiere-voile); border-radius: var(--rayon); font-size: 1.02rem; line-height: 1.6; }
.xpl__choix { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .6rem; margin-bottom: 1rem; }
.xpl__choix button { font-family: var(--titre); font-weight: 600; font-size: .9rem; color: var(--encre); background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); padding: .7rem .9rem; cursor: pointer; text-align: left; transition: background .15s, border-color .15s; }
.xpl__choix button:hover:not(:disabled) { border-color: var(--matiere); background: var(--matiere-voile); }
.xpl__choix button:disabled { cursor: default; opacity: .55; }
.xpl__choix button.est-juste { background: var(--matiere-fonce); border-color: var(--matiere-fonce); color: #fff; opacity: 1; }
.xpl__choix button.est-faux { border-color: var(--signal); background: var(--signal); color: #1A2530; opacity: 1; }
.xpl__score { font-family: var(--donnee); font-size: .82rem; color: var(--encre-doux); margin: 0; }
.xpl__bilan { margin: .9rem 0 0; padding: 1rem 1.2rem; background: var(--matiere-fonce); color: #fff; border-radius: var(--rayon); font-size: 1rem; line-height: 1.6; display: none; }
.xpl__bilan.est-visible { display: block; }
html[data-sombre="on"] .xpl__reveler, html[data-sombre="on"] .xpl__reponse, html[data-sombre="on"] .xpl__entete, html[data-sombre="on"] .xpl__bilan { background: var(--matiere-voile); color: var(--encre); }
html[data-sombre="on"] .xpl__consigne { color: var(--encre-pale); }
@media (max-width: 40rem) { .xpl__fiche { padding: 1.1rem 1rem 1rem; } .xpl__nav { padding: .75rem 1rem; } }
@media print { .xpl__fiche { display: block; page-break-inside: avoid; } .xpl__reponse { display: block; background: none; color: inherit; border: 1px solid #999; } .xpl__reveler, .xpl__nav, .xpl__choix { display: none; } }
</style>
<header class="xpl__entete">
<h3 class="xpl__titre">Les explorateurs des Grandes découvertes</h3>
<p class="xpl__consigne">Parcours les sept fiches, puis relève le défi</p>
</header>
<div class="xpl__medias" hidden>
<figure class="xpl__figure" data-xpl-figure="0">
<img src="../medias/08-expansion-europeenne/dias.jpg" alt="Portrait de Bartolomeu Dias" loading="lazy"
     onerror="this.closest('.xpl__figure').classList.add('est-absente')">
<figcaption>{{credit:dias.jpg}}</figcaption>
</figure>
<figure class="xpl__figure" data-xpl-figure="1">
<img src="../medias/08-expansion-europeenne/colomb.jpg" alt="Portrait de Christophe Colomb" loading="lazy"
     onerror="this.closest('.xpl__figure').classList.add('est-absente')">
<figcaption>{{credit:colomb.jpg}}</figcaption>
</figure>
<figure class="xpl__figure" data-xpl-figure="2">
<img src="../medias/08-expansion-europeenne/vasco-de-gama.png" alt="Portrait de Vasco de Gama" loading="lazy"
     onerror="this.closest('.xpl__figure').classList.add('est-absente')">
<figcaption>{{credit:vasco-de-gama.png}}</figcaption>
</figure>
<figure class="xpl__figure" data-xpl-figure="3">
<img src="../medias/08-expansion-europeenne/cabot.jpg" alt="Portrait de Jean Cabot" loading="lazy"
     onerror="this.closest('.xpl__figure').classList.add('est-absente')">
<figcaption>{{credit:cabot.jpg}}</figcaption>
</figure>
<figure class="xpl__figure" data-xpl-figure="4">
<img src="../medias/08-expansion-europeenne/cabral.png" alt="Portrait de Pedro Alvares Cabral" loading="lazy"
     onerror="this.closest('.xpl__figure').classList.add('est-absente')">
<figcaption>{{credit:cabral.png}}</figcaption>
</figure>
<figure class="xpl__figure" data-xpl-figure="5">
<img src="../medias/08-expansion-europeenne/magellan.jpg" alt="Portrait de Fernand de Magellan" loading="lazy"
     onerror="this.closest('.xpl__figure').classList.add('est-absente')">
<figcaption>{{credit:magellan.jpg}}</figcaption>
</figure>
<figure class="xpl__figure" data-xpl-figure="6">
<img src="../medias/08-expansion-europeenne/cartier.jpg" alt="Portrait de Jacques Cartier" loading="lazy"
     onerror="this.closest('.xpl__figure').classList.add('est-absente')">
<figcaption>{{credit:cartier.jpg}}</figcaption>
</figure>
</div>
<div class="xpl__piste" data-xpl="piste"></div>
<div class="xpl__nav">
<button class="xpl__bouton" type="button" data-xpl="prec">Précédent</button>
<div class="xpl__points" data-xpl="points"></div>
<button class="xpl__bouton" type="button" data-xpl="suiv">Suivant</button>
<span class="xpl__compteur" data-xpl="compteur"></span>
</div>
<script>
(function () {
  var racine = document.getElementById("explorateurs");
  if (!racine || racine.dataset.pret) return;
  racine.dataset.pret = "1";

  var FICHES = [
    {
      nom: "Bartolomeu Dias",
      pavillon: "Pour le Portugal",
      infos: [["Origine", "Portugal"], ["Expédition", "1487 et 1488"], ["Financement", "Le roi du Portugal"]],
      recit: "Chargé de trouver un moyen de contourner l'Afrique, il part de Lisbonne et longe la côte ouest-africaine jusqu'à la pointe sud du continent.",
      question: "Quel cap atteint-il le premier?",
      reponse: "Le cap de Bonne-Espérance, en février 1488. Il ne le franchit pas, mais sa découverte ouvre la route des Indes aux Portugais.",
      indice: "Je suis le premier Européen à atteindre la pointe sud de l'Afrique, sans oser la dépasser."
    },
    {
      nom: "Christophe Colomb",
      pavillon: "Pour l'Espagne",
      infos: [["Origine", "Italie"], ["Expédition", "1492"], ["Navires", "La Niña, la Pinta, la Santa Maria"]],
      recit: "Il veut atteindre les Indes en naviguant vers l'ouest. Il croira jusqu'à sa mort y être parvenu.",
      question: "Où arrive-t-il réellement?",
      reponse: "Aux Bahamas, puis à Cuba et à Hispaniola. Ses voyages entraînent l'esclavage et des épidémies chez les Autochtones.",
      indice: "Je suis parti chercher les Indes vers l'ouest et j'ai buté sur un continent que je n'ai jamais reconnu."
    },
    {
      nom: "Vasco de Gama",
      pavillon: "Pour le Portugal",
      infos: [["Origine", "Portugal"], ["Expédition", "1497 et 1498"], ["Financement", "Le royaume du Portugal"]],
      recit: "Il reprend la route ouverte par Dias, contourne le cap de Bonne-Espérance et poursuit vers l'est.",
      question: "Quelle route ouvre-t-il?",
      reponse: "La route maritime vers l'Inde, atteinte en 1498. Elle évite les routes terrestres, dangereuses et coûteuses.",
      indice: "J'ai été le premier Européen à atteindre l'Inde par la mer."
    },
    {
      nom: "Jean Cabot",
      pavillon: "Pour l'Angleterre",
      infos: [["Origine", "Italie"], ["Expéditions", "1497 et 1498"], ["Financement", "Le royaume d'Angleterre"]],
      recit: "Comme Colomb, il cherche l'Asie vers l'ouest, mais beaucoup plus au nord.",
      question: "Quelles côtes atteint-il?",
      reponse: "Le Labrador, Terre-Neuve et le golfe du Saint-Laurent, soit les côtes de l'Amérique du Nord.",
      indice: "Italien au service de l'Angleterre, j'ai longé Terre-Neuve et le Labrador."
    },
    {
      nom: "Pedro Alvares Cabral",
      pavillon: "Pour le Portugal",
      infos: [["Origine", "Portugal"], ["Expédition", "1500"], ["Financement", "Le royaume du Portugal"]],
      recit: "En route vers les Indes, il s'écarte largement vers l'ouest dans l'Atlantique.",
      question: "Quel territoire revendique-t-il?",
      reponse: "Le Brésil, revendiqué au nom du roi du Portugal. Le traité de Tordesillas lui donnait déjà ce territoire.",
      indice: "En visant les Indes, j'ai revendiqué le futur Brésil pour mon roi."
    },
    {
      nom: "Fernand de Magellan",
      pavillon: "Pour l'Espagne",
      infos: [["Origine", "Portugal"], ["Expédition", "1519 à 1522"], ["Flotte", "Cinq navires, un seul revenu"]],
      recit: "Il franchit en 1520 le détroit qui porte aujourd'hui son nom, puis traverse le Pacifique. Il meurt aux Philippines en 1521.",
      question: "Qu'accomplit son expédition?",
      reponse: "Le premier tour du monde par la mer, achevé en 1522 par le Victoria. Elle confirme aussi que la Terre est ronde.",
      indice: "Mon expédition a fait le tour du monde, mais je ne suis jamais rentré."
    },
    {
      nom: "Jacques Cartier",
      pavillon: "Pour la France",
      infos: [["Origine", "France"], ["Expéditions", "1534, 1535 et 1541"], ["Financement", "Le roi François 1er"]],
      recit: "Il cherche un passage vers l'Asie en contournant l'Amérique et remonte un grand fleuve vers l'intérieur du continent.",
      question: "Quels villages atteint-il?",
      reponse: "Stadaconé et Hochelaga, sur le Saint-Laurent. Ses voyages ouvrent la voie à la colonisation française en Amérique du Nord.",
      indice: "J'ai remonté le Saint-Laurent jusqu'à Stadaconé et Hochelaga."
    }
  ];

  var piste = racine.querySelector('[data-xpl="piste"]');
  var points = racine.querySelector('[data-xpl="points"]');
  var compteur = racine.querySelector('[data-xpl="compteur"]');
  var courante = 0;
  var TOTAL = FICHES.length + 1;

  function el(balise, classe, contenu) {
    var n = document.createElement(balise);
    if (classe) n.className = classe;
    if (contenu) n.textContent = contenu;
    return n;
  }

  FICHES.forEach(function (f, i) {
    var fiche = el("article", "xpl__fiche");
    fiche.setAttribute("role", "group");
    fiche.setAttribute("aria-roledescription", "fiche");
    fiche.setAttribute("aria-label", f.nom + ", fiche " + (i + 1) + " de " + FICHES.length);

    var haut = el("div", "xpl__haut");
    haut.appendChild(el("h4", "xpl__nom", f.nom));
    haut.appendChild(el("span", "xpl__pavillon", f.pavillon));
    fiche.appendChild(haut);

    var contenu = el("div", "xpl__contenu");
    var grille = el("dl", "xpl__grille");
    f.infos.forEach(function (paire) {
      var d = el("div");
      d.appendChild(el("dt", "", paire[0]));
      d.appendChild(el("dd", "", paire[1]));
      grille.appendChild(d);
    });
    contenu.appendChild(grille);
    contenu.appendChild(el("p", "xpl__recit", f.recit));
    var figure = racine.querySelector('[data-xpl-figure="' + i + '"]');
    if (figure) contenu.appendChild(figure);

    var reponse = el("div", "xpl__reponse");
    reponse.id = "xpl-reponse-" + i;
    reponse.appendChild(el("span", "xpl__etiquette", "Sa découverte"));
    var texte = el("p", "", f.reponse);
    texte.style.margin = "0";
    reponse.appendChild(texte);

    var reveler = el("button", "xpl__reveler", f.question + " Révèle la réponse");
    reveler.type = "button";
    reveler.setAttribute("aria-expanded", "false");
    reveler.setAttribute("aria-controls", reponse.id);
    reveler.addEventListener("click", function () {
      reveler.setAttribute("aria-expanded", "true");
      reponse.classList.add("est-visible");
    });
    contenu.appendChild(reveler);
    contenu.appendChild(reponse);
    fiche.appendChild(contenu);
    piste.appendChild(fiche);

    var point = el("button", "xpl__point");
    point.type = "button";
    point.setAttribute("aria-label", "Fiche " + (i + 1) + " : " + f.nom);
    point.addEventListener("click", function () { montrer(i); });
    points.appendChild(point);
  });

  // ------------------------------------------------------------ le défi
  var defi = el("article", "xpl__fiche");
  defi.setAttribute("role", "group");
  defi.setAttribute("aria-label", "Défi : qui suis-je?");
  var hautDefi = el("div", "xpl__haut");
  hautDefi.appendChild(el("h4", "xpl__nom", "Défi : qui suis-je?"));
  hautDefi.appendChild(el("span", "xpl__pavillon", "Sept indices"));
  defi.appendChild(hautDefi);
  var indice = el("p", "xpl__indice");
  var choix = el("div", "xpl__choix");
  var score = el("p", "xpl__score");
  var bilan = el("div", "xpl__bilan");
  bilan.setAttribute("role", "status");
  var rejouer = el("button", "xpl__reveler", "Recommencer le défi");
  rejouer.type = "button";
  rejouer.style.display = "none";
  defi.appendChild(indice);
  defi.appendChild(choix);
  defi.appendChild(score);
  defi.appendChild(bilan);
  defi.appendChild(rejouer);
  piste.appendChild(defi);

  var pointDefi = el("button", "xpl__point xpl__point--defi");
  pointDefi.type = "button";
  pointDefi.setAttribute("aria-label", "Défi : qui suis-je?");
  pointDefi.addEventListener("click", function () { montrer(FICHES.length); });
  points.appendChild(pointDefi);

  var ordre = [], rang = 0, reussites = 0;

  function melanger(liste) {
    var copie = liste.slice();
    for (var i = copie.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = copie[i]; copie[i] = copie[j]; copie[j] = t;
    }
    return copie;
  }

  function lancerDefi() {
    ordre = melanger(FICHES.map(function (f, i) { return i; }));
    rang = 0; reussites = 0;
    bilan.classList.remove("est-visible");
    rejouer.style.display = "none";
    poserQuestion();
  }

  function poserQuestion() {
    if (rang >= ordre.length) {
      indice.textContent = "Défi terminé.";
      choix.innerHTML = "";
      score.textContent = "";
      bilan.textContent = reussites + " bonne(s) réponse(s) sur " + ordre.length +
        (reussites === ordre.length ? ". Sans faute, bravo!" : ". Reprends les fiches pour les revoir.");
      bilan.classList.add("est-visible");
      rejouer.style.display = "inline-flex";
      return;
    }
    var bonne = ordre[rang];
    indice.textContent = "« " + FICHES[bonne].indice + " »";
    score.textContent = "Question " + (rang + 1) + " sur " + ordre.length + " · " + reussites + " bonne(s) réponse(s)";
    choix.innerHTML = "";
    melanger(FICHES.map(function (f, i) { return i; })).forEach(function (i) {
      var b = el("button", "", FICHES[i].nom);
      b.type = "button";
      b.addEventListener("click", function () {
        Array.prototype.forEach.call(choix.children, function (autre) { autre.disabled = true; });
        if (i === bonne) { b.classList.add("est-juste"); reussites++; }
        else {
          b.classList.add("est-faux");
          Array.prototype.forEach.call(choix.children, function (autre) {
            if (autre.textContent === FICHES[bonne].nom) autre.classList.add("est-juste");
          });
        }
        score.textContent = (i === bonne ? "Juste. " : "Non, c'était " + FICHES[bonne].nom + ". ") +
          FICHES[bonne].reponse;
        rang++;
        setTimeout(poserQuestion, 2600);
      });
      choix.appendChild(b);
    });
  }

  rejouer.addEventListener("click", lancerDefi);

  // ------------------------------------------------------- la navigation
  var fiches = piste.children;
  var pastilles = points.children;

  function montrer(i) {
    courante = (i + TOTAL) % TOTAL;
    Array.prototype.forEach.call(fiches, function (f, j) {
      f.classList.toggle("est-visible", j === courante);
    });
    Array.prototype.forEach.call(pastilles, function (p, j) {
      p.classList.toggle("est-actif", j === courante);
      p.setAttribute("aria-current", j === courante ? "true" : "false");
    });
    compteur.textContent = courante === FICHES.length ? "Défi" : (courante + 1) + " / " + FICHES.length;
    if (courante === FICHES.length && !ordre.length) lancerDefi();
  }

  racine.querySelector('[data-xpl="prec"]').addEventListener("click", function () { montrer(courante - 1); });
  racine.querySelector('[data-xpl="suiv"]').addEventListener("click", function () { montrer(courante + 1); });

  racine.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { montrer(courante - 1); e.stopPropagation(); }
    if (e.key === "ArrowRight") { montrer(courante + 1); e.stopPropagation(); }
  });

  var departX = null;
  piste.addEventListener("touchstart", function (e) { departX = e.touches[0].clientX; }, { passive: true });
  piste.addEventListener("touchend", function (e) {
    if (departX === null) return;
    var ecart = departX - e.changedTouches[0].clientX;
    if (Math.abs(ecart) > 50) montrer(courante + (ecart > 0 ? 1 : -1));
    departX = null;
  }, { passive: true });

  var reserve = racine.querySelector(".xpl__medias");
  if (reserve) reserve.remove();
  montrer(0);
})();
</script>
</section>
