<section class="xpl" id="explorateurs" aria-label="Les explorateurs des Grandes découvertes">
<style>
.xpl { margin: 1.2rem 0 2rem; border: 1px solid var(--trait); border-radius: var(--rayon); background: var(--surface); overflow: hidden; }
.xpl .xpl__entete { background: var(--matiere-fonce); color: #fff; padding: .55rem 1.2rem; display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.xpl .xpl__titre { margin: 0; font-family: var(--titre); font-weight: 700; font-size: .95rem; letter-spacing: -.01em; color: #fff; }
html[data-sombre="on"] .xpl .xpl__titre { color: var(--encre); }
.xpl__consigne { margin: 0; font-family: var(--donnee); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.65); }
.xpl__galerie { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); gap: .7rem; padding: 1rem 1.2rem; background: var(--surface-2); border-bottom: 1px solid var(--trait); }
.xpl__vignette { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 0; padding: 0; border: 1px solid var(--trait); border-radius: var(--rayon); background: var(--surface); cursor: pointer; overflow: hidden; transition: transform .15s, box-shadow .15s, border-color .15s; font-family: var(--titre); }
.xpl__vignette:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(26,37,48,.16); }
.xpl__vignette.est-actif { border-color: var(--matiere); box-shadow: 0 0 0 2px var(--matiere); }
.xpl__pavillon { display: flex; height: .5rem; }
.xpl__pavillon span { flex: 1; }
.xpl__portrait { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; object-position: center 18%; display: block; background: var(--matiere-voile); }
.xpl__portrait.est-absent { display: none; }
.xpl__initiales { display: none; align-items: center; justify-content: center; aspect-ratio: 1 / 1; font-size: 1.6rem; font-weight: 700; color: var(--matiere-fonce); background: var(--matiere-voile); }
.xpl__portrait.est-absent + .xpl__initiales { display: flex; }
.xpl__legende { padding: .45rem .5rem .55rem; font-size: .78rem; font-weight: 600; line-height: 1.25; color: var(--encre); text-align: center; }
.xpl__couronne { display: block; font-family: var(--donnee); font-size: .6rem; letter-spacing: .06em; text-transform: uppercase; color: var(--encre-pale); margin-top: .15rem; }
.xpl__panneau { padding: 1.4rem 1.6rem 1.2rem; }
.xpl__haut { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; border-bottom: 3px solid var(--matiere); padding-bottom: .7rem; margin-bottom: 1rem; flex-wrap: wrap; }
.xpl__nom { margin: 0; font-family: var(--titre); font-weight: 700; font-size: 1.35rem; letter-spacing: -.02em; }
.xpl__service { font-family: var(--titre); font-weight: 600; font-size: .74rem; color: #fff; padding: .28rem .8rem; border-radius: 100px; white-space: nowrap; }
.xpl__grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); gap: .8rem 1.4rem; margin-bottom: 1.1rem; }
.xpl__grille dt { font-family: var(--donnee); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--encre-pale); margin-bottom: .12rem; }
.xpl__grille dd { margin: 0; font-family: var(--titre); font-weight: 500; font-size: .92rem; line-height: 1.35; }
.xpl__texte p { margin: 0 0 .9rem; font-size: .99rem; line-height: 1.7; }
.xpl__texte p:last-child { margin-bottom: 0; }
.xpl__pied { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .85rem 1.4rem; border-top: 1px solid var(--trait); background: var(--surface-2); flex-wrap: wrap; }
.xpl__bouton { font-family: var(--titre); font-weight: 600; font-size: .88rem; color: var(--matiere-fonce); background: var(--surface); border: 1px solid var(--trait); border-radius: 100px; padding: .5rem 1.15rem; cursor: pointer; transition: background .15s, color .15s; }
.xpl__bouton:hover { background: var(--matiere); border-color: var(--matiere); color: #fff; }
.xpl__bouton--defi { background: var(--matiere-fonce); border-color: var(--matiere-fonce); color: #fff; }
.xpl__bouton--defi:hover { background: var(--matiere); }
.xpl__compteur { font-family: var(--donnee); font-size: .74rem; color: var(--encre-doux); }
.xpl__defi { display: none; padding: 1.4rem 1.6rem 1.2rem; }
.xpl__defi.est-visible { display: block; }
.xpl__indice { margin: 0 0 1.1rem; padding: 1rem 1.2rem; background: var(--matiere-voile); border-radius: var(--rayon); font-size: 1.05rem; line-height: 1.6; }
.xpl__choix { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .6rem; margin-bottom: 1rem; }
.xpl__choix button { font-family: var(--titre); font-weight: 600; font-size: .9rem; color: var(--encre); background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); padding: .7rem .9rem; cursor: pointer; text-align: left; transition: background .15s, border-color .15s; }
.xpl__choix button:hover:not(:disabled) { border-color: var(--matiere); background: var(--matiere-voile); }
.xpl__choix button:disabled { cursor: default; opacity: .55; }
.xpl__choix button.est-juste { background: var(--matiere-fonce); border-color: var(--matiere-fonce); color: #fff; opacity: 1; }
.xpl__choix button.est-faux { border-color: var(--signal); background: var(--signal); color: #1A2530; opacity: 1; }
.xpl__verdict { font-size: .95rem; line-height: 1.6; margin: 0 0 .9rem; color: var(--encre); min-height: 3rem; }
.xpl__score { font-family: var(--donnee); font-size: .78rem; color: var(--encre-doux); margin: 0; }
html[data-sombre="on"] .xpl__entete { background: var(--matiere-voile); color: var(--encre); }
html[data-sombre="on"] .xpl__consigne { color: var(--encre-pale); }
@media (max-width: 40rem) { .xpl__panneau, .xpl__defi { padding: 1.1rem 1rem 1rem; } .xpl__galerie { padding: .8rem; gap: .5rem; grid-template-columns: repeat(auto-fit, minmax(6rem, 1fr)); } }
@media print { .xpl__galerie, .xpl__pied, .xpl__defi { display: none; } .xpl__panneau { display: block; } }
</style>
<header class="xpl__entete">
<h3 class="xpl__titre">Les explorateurs des Grandes découvertes</h3>
<p class="xpl__consigne">Choisis un visage, puis relève le défi</p>
</header>
<div class="xpl__medias" hidden>
<img data-xpl-portrait="0" src="../medias/08-expansion-europeenne/dias.jpg" alt="Portrait de Bartolomeu Dias">
<img data-xpl-portrait="1" src="../medias/08-expansion-europeenne/colomb.jpg" alt="Portrait de Christophe Colomb">
<img data-xpl-portrait="2" src="../medias/08-expansion-europeenne/vasco-de-gama.png" alt="Portrait de Vasco de Gama">
<img data-xpl-portrait="3" src="../medias/08-expansion-europeenne/cabot.jpg" alt="Portrait de Jean Cabot">
<img data-xpl-portrait="4" src="../medias/08-expansion-europeenne/cabral.png" alt="Portrait de Pedro Alvares Cabral">
<img data-xpl-portrait="5" src="../medias/08-expansion-europeenne/magellan.jpg" alt="Portrait de Fernand de Magellan">
<img data-xpl-portrait="6" src="../medias/08-expansion-europeenne/cartier.jpg" alt="Portrait de Jacques Cartier">
</div>
<div class="xpl__galerie" data-xpl="galerie" role="tablist" aria-label="Les sept explorateurs"></div>
<div class="xpl__panneau" data-xpl="panneau"></div>
<div class="xpl__defi" data-xpl="defi">
<div class="xpl__haut"><h4 class="xpl__nom">Défi : qui suis-je?</h4></div>
<p class="xpl__indice" data-xpl="indice"></p>
<div class="xpl__choix" data-xpl="choix"></div>
<p class="xpl__verdict" data-xpl="verdict" role="status"></p>
<p class="xpl__score" data-xpl="score"></p>
</div>
<div class="xpl__pied">
<button class="xpl__bouton xpl__bouton--defi" type="button" data-xpl="basculer">Passer au défi</button>
<span class="xpl__compteur" data-xpl="compteur"></span>
</div>
<script>
(function () {
  var racine = document.getElementById("explorateurs");
  if (!racine || racine.dataset.pret) return;
  racine.dataset.pret = "1";

  var COURONNES = {
    portugal: { nom: "Portugal", bandes: ["#006600", "#FF0000"], teinte: "#006600" },
    espagne:  { nom: "Espagne",  bandes: ["#AA151B", "#F1BF00", "#AA151B"], teinte: "#AA151B" },
    angleterre: { nom: "Angleterre", bandes: ["#FFFFFF", "#CE1124", "#FFFFFF"], teinte: "#CE1124" },
    france:   { nom: "France",   bandes: ["#002395", "#FFFFFF", "#ED2939"], teinte: "#002395" }
  };

  var FICHES = [
    {
      nom: "Bartolomeu Dias", couronne: "portugal", initiales: "BD",
      infos: [["Origine", "Portugal"], ["Expédition", "1487 et 1488"], ["Financement", "Le roi du Portugal"]],
      texte: [
        "Bartolomeu Dias est un navigateur portugais du 15e siècle, surtout connu pour ses expéditions le long de la côte de l'Afrique.",
        "En 1487, il est chargé par le roi du Portugal de trouver un moyen de contourner l'Afrique et d'atteindre les Indes par voie maritime. Son expédition part de Lisbonne et longe la côte ouest-africaine. Il atteint la pointe sud de l'Afrique, connue aujourd'hui comme le cap de Bonne-Espérance, en février 1488. Il est le premier navigateur européen à atteindre cette région, bien qu'il n'ait pas réussi à franchir le cap.",
        "Sa découverte a été un élément clé dans l'établissement de la route des Indes par les Portugais."
      ],
      indice: "Je suis le premier Européen à atteindre la pointe sud de l'Afrique, sans oser la dépasser."
    },
    {
      nom: "Christophe Colomb", couronne: "espagne", initiales: "CC",
      infos: [["Origine", "Italie"], ["Expédition", "1492"], ["Navires", "La Niña, la Pinta, la Santa Maria"]],
      texte: [
        "Christophe Colomb est un explorateur italien au service de l'Espagne. Ses voyages ont été financés par les Rois Catholiques d'Espagne, la reine Isabelle de Castille et le roi Ferdinand d'Aragon.",
        "Sa première expédition quitte l'Espagne en 1492 avec trois navires : la Niña, la Pinta et la Santa Maria. Son objectif était de trouver une nouvelle route maritime vers les Indes en naviguant vers l'ouest.",
        "Bien qu'il ait cru avoir trouvé une route vers les Indes, il a plutôt atteint des terres inconnues des Européens, qui correspondent aux Bahamas, à Cuba et à Hispaniola, aujourd'hui Haïti et la République dominicaine. Au cours de ses autres expéditions, il atteint la Jamaïque, Porto Rico, les côtes vénézuéliennes, le Honduras et le Panama.",
        "Bien qu'on lui attribue la découverte de l'Amérique, il est important de rappeler que ses voyages ont également eu des conséquences négatives pour les Autochtones : esclavage et épidémies."
      ],
      indice: "Je suis parti chercher les Indes vers l'ouest et j'ai buté sur un continent que je n'ai jamais reconnu."
    },
    {
      nom: "Vasco de Gama", couronne: "portugal", initiales: "VG",
      infos: [["Origine", "Portugal"], ["Expédition", "1497 et 1498"], ["Financement", "Le royaume du Portugal"]],
      texte: [
        "Vasco de Gama est un célèbre explorateur portugais du 15e siècle. Il est célèbre aujourd'hui pour avoir ouvert la voie aux routes commerciales maritimes entre l'Europe et les Indes.",
        "Sa première expédition a lieu en 1497. Il navigue le long de la côte africaine, contourne le cap de Bonne-Espérance et atteint finalement la côte ouest de l'Inde en 1498. La découverte d'un passage par le sud de l'Afrique a permis d'éviter les routes terrestres, dangereuses et coûteuses.",
        "Ses principales découvertes comprennent la route maritime vers les Indes, l'établissement de relations commerciales avec les royaumes africains et indiens et l'ouverture de nouvelles possibilités commerciales pour le Portugal. Ses expéditions ont également contribué à l'expansion de l'empire colonial portugais en Asie."
      ],
      indice: "J'ai été le premier Européen à atteindre l'Inde par la mer."
    },
    {
      nom: "Jean Cabot", couronne: "angleterre", initiales: "JC",
      infos: [["Origine", "Italie"], ["Expéditions", "1497 et 1498"], ["Financement", "Le royaume d'Angleterre"]],
      texte: [
        "Jean Cabot était un explorateur italien du 15e siècle. Il a réalisé plusieurs expéditions maritimes pour le royaume d'Angleterre.",
        "Ses principales découvertes maritimes incluent les côtes de l'Amérique du Nord, notamment le Labrador, Terre-Neuve et le golfe du Saint-Laurent. Ses expéditions les plus célèbres ont eu lieu en 1497 et 1498."
      ],
      indice: "Italien au service de l'Angleterre, j'ai longé Terre-Neuve et le Labrador."
    },
    {
      nom: "Pedro Alvares Cabral", couronne: "portugal", initiales: "PC",
      infos: [["Origine", "Portugal"], ["Expédition", "1500"], ["Financement", "Le royaume du Portugal"]],
      texte: [
        "Pedro Alvares Cabral est un navigateur portugais du 15e siècle. Ses expéditions maritimes étaient principalement financées par le royaume du Portugal.",
        "L'une de ses expéditions les plus célèbres a eu lieu en 1500, lorsqu'il a navigué vers l'ouest à la recherche d'une nouvelle route maritime vers les Indes. Au cours de cette expédition, Cabral a atteint le Brésil, qu'il a revendiqué au nom du roi du Portugal.",
        "Cabral a également découvert l'archipel de Socotra, situé au large de la côte de l'actuel Yémen, lors de son voyage vers les Indes."
      ],
      indice: "En visant les Indes, j'ai revendiqué le futur Brésil pour mon roi."
    },
    {
      nom: "Fernand de Magellan", couronne: "espagne", initiales: "FM",
      infos: [["Origine", "Portugal"], ["Expédition", "1519 à 1522"], ["Flotte", "Cinq navires, un seul revenu"]],
      texte: [
        "Fernand de Magellan est un explorateur portugais au service de la couronne espagnole. Il est célèbre pour avoir dirigé la première expédition qui a réussi à naviguer autour du monde, la première circumnavigation.",
        "Sa première expédition commence en 1519. Sa flotte était composée de cinq navires. Après une traversée difficile de l'Atlantique, l'expédition a atteint le continent sud-américain. Il a découvert le détroit de Magellan, qu'il a réussi à franchir en 1520.",
        "L'expédition atteint les Philippines en 1521 après une traversée tumultueuse de l'océan Pacifique. Magellan y est malheureusement tué lors d'une bataille avec les populations locales.",
        "L'expédition se termine en 1522. Seul un navire, le Victoria, réussit à revenir en Espagne. Il devient alors le premier navire à faire le tour du monde. Cette expédition a également contribué à prouver que la Terre était ronde et a jeté les bases des futures explorations maritimes."
      ],
      indice: "Mon expédition a fait le tour du monde, mais je ne suis jamais rentré."
    },
    {
      nom: "Jacques Cartier", couronne: "france", initiales: "JC",
      infos: [["Origine", "France"], ["Expéditions", "1534, 1535 et 1541"], ["Financement", "Le roi François 1er"]],
      texte: [
        "Jacques Cartier est un explorateur français du 16e siècle qui a entrepris plusieurs expéditions maritimes au nom du royaume de France. Ses voyages visaient principalement à trouver une route maritime vers l'Asie en contournant le continent américain.",
        "Lors de sa première expédition, en 1534, il a exploré les côtes de l'Amérique du Nord, notamment Terre-Neuve et la baie de Gaspé. Durant sa deuxième expédition, de 1535 à 1536, il a navigué sur le fleuve Saint-Laurent jusqu'au village iroquoien de Stadaconé et a atteint Hochelaga. Lors de sa troisième expédition, de 1541 à 1542, il a tenté d'établir une colonie permanente, mais il a été confronté à des difficultés climatiques et à de mauvaises relations avec les Autochtones.",
        "Les expéditions de Jacques Cartier ont ouvert la voie à la colonisation française en Amérique du Nord et ont jeté les bases de la présence française dans la région."
      ],
      indice: "J'ai remonté le Saint-Laurent jusqu'à Stadaconé et Hochelaga."
    }
  ];

  var galerie = racine.querySelector('[data-xpl="galerie"]');
  var panneau = racine.querySelector('[data-xpl="panneau"]');
  var zoneDefi = racine.querySelector('[data-xpl="defi"]');
  var basculer = racine.querySelector('[data-xpl="basculer"]');
  var compteur = racine.querySelector('[data-xpl="compteur"]');
  var courante = 0;

  function el(balise, classe, contenu) {
    var n = document.createElement(balise);
    if (classe) n.className = classe;
    if (contenu) n.textContent = contenu;
    return n;
  }

  FICHES.forEach(function (f, i) {
    var c = COURONNES[f.couronne];
    var v = el("button", "xpl__vignette");
    v.type = "button";
    v.setAttribute("role", "tab");
    v.setAttribute("aria-label", f.nom + ", au service " + (c.nom === "France" ? "de la " : "du ") + c.nom);
    var pav = el("span", "xpl__pavillon");
    c.bandes.forEach(function (couleur) {
      var bande = el("span");
      bande.style.background = couleur;
      pav.appendChild(bande);
    });
    v.appendChild(pav);
    var img = racine.querySelector('[data-xpl-portrait="' + i + '"]');
    if (img) {
      img.className = "xpl__portrait";
      img.loading = "lazy";
      img.onerror = function () { img.classList.add("est-absent"); };
      v.appendChild(img);
    }
    var initiales = el("span", "xpl__initiales", f.initiales);
    v.appendChild(initiales);
    if (!img) initiales.style.display = "flex";
    var legende = el("span", "xpl__legende", f.nom);
    legende.appendChild(el("span", "xpl__couronne", c.nom));
    v.appendChild(legende);
    v.addEventListener("click", function () { montrer(i); });
    galerie.appendChild(v);
  });

  function montrer(i) {
    courante = i;
    var f = FICHES[i], c = COURONNES[f.couronne];
    zoneDefi.classList.remove("est-visible");
    panneau.style.display = "";
    basculer.textContent = "Passer au défi";
    Array.prototype.forEach.call(galerie.children, function (v, j) {
      v.classList.toggle("est-actif", j === i);
      v.setAttribute("aria-selected", j === i ? "true" : "false");
    });
    panneau.innerHTML = "";
    var haut = el("div", "xpl__haut");
    haut.appendChild(el("h4", "xpl__nom", f.nom));
    var service = el("span", "xpl__service", "Au service " + (c.nom === "France" ? "de la " : "du ") + c.nom);
    service.style.background = c.teinte;
    haut.appendChild(service);
    haut.style.borderBottomColor = c.teinte;
    panneau.appendChild(haut);
    var grille = el("dl", "xpl__grille");
    f.infos.forEach(function (paire) {
      var d = el("div");
      d.appendChild(el("dt", "", paire[0]));
      d.appendChild(el("dd", "", paire[1]));
      grille.appendChild(d);
    });
    panneau.appendChild(grille);
    var texte = el("div", "xpl__texte");
    f.texte.forEach(function (paragraphe) { texte.appendChild(el("p", "", paragraphe)); });
    panneau.appendChild(texte);
    compteur.textContent = "Explorateur " + (i + 1) + " sur " + FICHES.length;
  }

  // ------------------------------------------------------------- le défi
  var indice = racine.querySelector('[data-xpl="indice"]');
  var choix = racine.querySelector('[data-xpl="choix"]');
  var verdict = racine.querySelector('[data-xpl="verdict"]');
  var score = racine.querySelector('[data-xpl="score"]');
  var ordre = [], rang = 0, reussites = 0;

  function melanger(liste) {
    var copie = liste.slice();
    for (var i = copie.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = copie[i]; copie[i] = copie[j]; copie[j] = t;
    }
    return copie;
  }

  function lancerDefi() {
    ordre = melanger(FICHES.map(function (f, i) { return i; }));
    rang = 0; reussites = 0;
    poser();
  }

  function poser() {
    if (rang >= ordre.length) {
      indice.textContent = "Défi terminé.";
      choix.innerHTML = "";
      verdict.textContent = reussites + " bonne(s) réponse(s) sur " + ordre.length +
        (reussites === ordre.length ? ". Sans faute, bravo!" : ". Reprends les fiches pour les revoir.");
      score.textContent = "";
      var encore = el("button", "xpl__bouton xpl__bouton--defi", "Recommencer");
      encore.type = "button";
      encore.addEventListener("click", lancerDefi);
      choix.appendChild(encore);
      return;
    }
    var bonne = ordre[rang];
    indice.textContent = "« " + FICHES[bonne].indice + " »";
    verdict.textContent = "";
    score.textContent = "Question " + (rang + 1) + " sur " + ordre.length + " · " + reussites + " bonne(s) réponse(s)";
    choix.innerHTML = "";
    melanger(FICHES.map(function (f, i) { return i; })).forEach(function (i) {
      var b = el("button", "", FICHES[i].nom);
      b.type = "button";
      b.addEventListener("click", function () {
        Array.prototype.forEach.call(choix.children, function (a) { a.disabled = true; });
        if (i === bonne) { b.classList.add("est-juste"); reussites++; }
        else {
          b.classList.add("est-faux");
          Array.prototype.forEach.call(choix.children, function (a) {
            if (a.textContent === FICHES[bonne].nom) a.classList.add("est-juste");
          });
        }
        verdict.textContent = (i === bonne ? "Juste. " : "Non, c'était " + FICHES[bonne].nom + ". ") +
          FICHES[bonne].indice;
        rang++;
        setTimeout(poser, 2400);
      });
      choix.appendChild(b);
    });
  }

  basculer.addEventListener("click", function () {
    var ouvert = zoneDefi.classList.toggle("est-visible");
    panneau.style.display = ouvert ? "none" : "";
    basculer.textContent = ouvert ? "Revenir aux fiches" : "Passer au défi";
    compteur.textContent = ouvert ? "Sept indices à identifier" : "Explorateur " + (courante + 1) + " sur " + FICHES.length;
    if (ouvert && !ordre.length) lancerDefi();
  });

  var reserve = racine.querySelector(".xpl__medias");
  if (reserve) reserve.remove();
  montrer(0);
})();
</script>
</section>
