<section class="cmp" id="seismes-1906-1989" aria-label="Comparateur des séismes de 1906 et de 1989">
<style>
.cmp { margin: 1.2rem 0 2rem; border: 1px solid var(--trait); border-radius: var(--rayon); background: var(--surface); overflow: hidden; }
.cmp .cmp__entete { background: var(--matiere-fonce); color: #fff; padding: .55rem 1.2rem; display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.cmp .cmp__titre { margin: 0; font-family: var(--titre); font-weight: 700; font-size: .95rem; letter-spacing: -.01em; color: #fff; }
.cmp__legende { display: flex; gap: 1rem; margin: 0; font-family: var(--donnee); font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.85); }
.cmp__puce { display: inline-block; width: .7rem; height: .7rem; border-radius: 2px; margin-right: .35rem; vertical-align: -1px; }
.cmp__puce--1906 { background: #C79239; }
.cmp__puce--1989 { background: #2B5773; outline: 1px solid rgba(255,255,255,.45); }
.cmp__choix { padding: .9rem 1.2rem; background: var(--surface-2); border-bottom: 1px solid var(--trait); display: grid; gap: .55rem; }
.cmp__famille { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.cmp__etiquette { flex: 0 0 9.5rem; margin: 0; font-family: var(--donnee); font-size: .62rem; letter-spacing: .09em; text-transform: uppercase; color: var(--encre-pale); }
.cmp__bouton { font-family: var(--titre); font-weight: 600; font-size: .84rem; color: var(--encre); background: var(--surface); border: 1px solid var(--trait); border-radius: 100px; padding: .32rem .85rem; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
.cmp__bouton:hover { border-color: var(--matiere); }
.cmp__bouton[aria-pressed="true"] { background: var(--matiere-fonce); border-color: var(--matiere-fonce); color: #fff; }
.cmp__panneau { padding: 1.2rem 1.2rem 1.1rem; }
.cmp__nom { display: block; font-family: var(--titre); font-weight: 700; font-size: 1.12rem; letter-spacing: -.01em; color: var(--encre); }
.cmp__unite { display: block; font-family: var(--donnee); font-size: .62rem; letter-spacing: .09em; text-transform: uppercase; color: var(--encre-pale); margin: .15rem 0 .9rem; }
.cmp__barre { display: grid; grid-template-columns: 3.2rem 1fr; align-items: center; gap: .6rem; margin-bottom: .45rem; }
.cmp__annee { font-family: var(--donnee); font-size: .74rem; letter-spacing: .05em; color: var(--encre-doux); }
.cmp__piste { position: relative; height: 1.6rem; background: var(--surface-2); border: 1px solid var(--trait); border-radius: 3px; }
.cmp__remplissage { position: absolute; top: -1px; bottom: -1px; left: -1px; border: 1px solid rgba(0,0,0,.28); border-radius: 3px 0 0 3px; }
.cmp__remplissage--1906 { background: #C79239; }
.cmp__remplissage--1989 { background: #2B5773; }
.cmp__marge { position: absolute; top: -1px; bottom: -1px; border: 1px solid rgba(0,0,0,.28); border-left: none; border-radius: 0 3px 3px 0; opacity: .55; background-image: repeating-linear-gradient(135deg, currentColor 0 4px, transparent 4px 8px); }
.cmp__marge--1906 { color: #C79239; }
.cmp__marge--1989 { color: #2B5773; }
/* La valeur vit hors de la piste : posée dessus, elle devenait illisible sur
   les barres foncées, et aucune couleur de texte ne convient aux deux. */
.cmp__valeur { display: block; margin-top: .2rem; font-family: var(--donnee); font-size: .82rem; color: var(--encre); }
.cmp__inconnu { font-family: var(--corps); font-style: italic; color: var(--encre-doux); }
.cmp__mot { display: block; margin-top: .9rem; padding-top: .8rem; border-top: 1px solid var(--trait); font-size: .9rem; line-height: 1.55; color: var(--encre); }
.cmp__source { margin: 0; padding: 0 1.2rem 1.1rem; font-size: .78rem; line-height: 1.5; color: var(--encre-doux); }
html[data-sombre="on"] .cmp .cmp__entete { background: var(--matiere-voile); }
html[data-sombre="on"] .cmp .cmp__titre { color: var(--encre); }
html[data-sombre="on"] .cmp__legende { color: var(--encre-pale); }
html[data-sombre="on"] .cmp__bouton[aria-pressed="true"] { background: var(--matiere-voile); border-color: var(--matiere); color: var(--encre); }
html[data-sombre="on"] .cmp__remplissage--1906, html[data-sombre="on"] .cmp__puce--1906 { background: #E3B15A; }
html[data-sombre="on"] .cmp__remplissage--1989, html[data-sombre="on"] .cmp__puce--1989 { background: #35719C; }
html[data-sombre="on"] .cmp__marge--1906 { color: #E3B15A; }
html[data-sombre="on"] .cmp__marge--1989 { color: #35719C; }
@media (max-width: 40rem) { .cmp__etiquette { flex-basis: 100%; } .cmp__barre { grid-template-columns: 2.8rem 1fr; } }
/* À l'impression, un seul indicateur visible ferait perdre les huit autres. */
@media print { .cmp__choix { display: none; } .cmp__panneau { padding: .8rem 1.2rem; page-break-inside: avoid; border-bottom: 1px solid var(--trait); } .cmp__panneau[hidden] { display: block !important; } }
</style>
<div class="cmp__entete">
  <p class="cmp__titre" role="heading" aria-level="3">Comparer 1906 et 1989</p>
  <p class="cmp__legende">
    <span><span class="cmp__puce cmp__puce--1906"></span>1906</span>
    <span><span class="cmp__puce cmp__puce--1989"></span>1989</span>
  </p>
</div>
<div class="cmp__choix">
  <div class="cmp__famille" id="cmp-alea" role="group" aria-label="Ce que la faille a fait">
    <p class="cmp__etiquette">Ce que la faille a fait</p>
  </div>
  <div class="cmp__famille" id="cmp-vulnerabilite" role="group" aria-label="Ce que la ville a subi">
    <p class="cmp__etiquette">Ce que la ville a subi</p>
  </div>
</div>
<div id="cmp-panneaux" aria-live="polite"></div>
<p class="cmp__source">Sources : U.S. Geological Survey, California Geological Survey, Hansen et Condon pour l'estimation du bilan de 1906. Les barres hachurées marquent une fourchette, pas une précision.</p>
<script>
(function () {
  var racine = document.getElementById("seismes-1906-1989");
  if (!racine || racine.dataset.pret) return;
  racine.dataset.pret = "1";
  // Un seul indicateur paraît à la fois : neuf diagrammes empilés se
  // regardaient sans se comparer. Le bouton choisit ce qu'on compare.
  var INDICATEURS = {
    alea: [
      { nom: "Magnitude de moment", court: "Magnitude", unite: "échelle de magnitude de moment",
        a1906: [7.8, 7.9], a1989: 6.9, sansBarre: true,
        texte: "7,8 à 7,9", texte89: "6,9",
        mot: "L'échelle est logarithmique, alors deux barres se ressemblant à 13 % près donneraient une fausse idée. C'est l'énergie libérée, à la ligne suivante, qui se met en barres sans mentir." },
      { nom: "Énergie libérée", court: "Énergie", unite: "en multiples de 1989",
        a1906: [22, 32], a1989: 1,
        texte: "22 à 32 fois", texte89: "1 fois",
        mot: "Un point de magnitude vaut environ 32 fois plus d'énergie. Voilà le vrai écart entre les deux séismes, celui que la magnitude cache." },
      { nom: "Longueur de la rupture", court: "Rupture", unite: "kilomètres de faille",
        a1906: 477, a1989: 40,
        texte: "477 km", texte89: "40 km",
        mot: "En 1906, la faille a cédé du sud de San Juan Bautista jusqu'au cap Mendocino. En 1989, seulement sur la portion la plus au sud de cette même cassure." },
      { nom: "Durée de la secousse", court: "Durée", unite: "secondes",
        a1906: [45, 60], a1989: [8, 15],
        texte: "45 à 60 s", texte89: "8 à 15 s",
        mot: "Plus la secousse dure, plus les bâtiments encaissent de cycles. Quatre fois plus longtemps, c'est quatre fois plus d'occasions de céder." }
    ],
    vulnerabilite: [
      { nom: "Morts", court: "Morts", unite: "bilan humain",
        a1906: [478, 3000], a1989: 63,
        texte: "478 à plus de 3 000", texte89: "63",
        mot: "Le chiffre officiel de 1906 est resté 478 pendant des décennies. Les historiens Hansen et Condon ont établi plus de 3 000 morts. Les non-comptés étaient surtout des immigrants, et les autorités avaient intérêt à minimiser pour faire revenir le commerce. Un bilan n'est pas seulement mesuré, il est aussi construit." },
      { nom: "Blessés", court: "Blessés", unite: "personnes",
        a1906: null, a1989: 3757,
        texte: "donnée inconnue", texte89: "3 757",
        mot: "Aucun décompte fiable n'a été tenu en 1906. L'absence de barre signale une donnée manquante, pas un zéro." },
      { nom: "Personnes sans toit", court: "Sans-abri", unite: "personnes",
        a1906: [225000, 300000], a1989: 12053,
        texte: "225 000 à 300 000", texte89: "12 053",
        mot: "C'est l'écart le plus parlant. En 1906, plus de la moitié des quelque 400 000 habitants de la ville se retrouvent à la rue. En 1989, les déplacés se comptent par milliers, sur une région bien plus peuplée." },
      { nom: "Bâtiments détruits", court: "Bâtiments", unite: "bâtiments",
        a1906: 28000, a1989: 963,
        texte: "environ 28 000", texte89: "963",
        mot: "La barre ne compte que les bâtiments détruits. En 1989, il faut y ajouter 18 306 logements endommagés sans être perdus. Et en 1906, l'essentiel de la destruction vient des incendies, pas de la secousse : les conduites d'eau ayant cédé, les pompiers n'avaient plus rien pour combattre le feu." },
      { nom: "Coût des dégâts", court: "Coût", unite: "en dollars d'aujourd'hui",
        a1906: [4.8, 10], a1989: [14.5, 15.6],
        texte: "4,8 à 10 milliards", texte89: "14,5 à 15,6 milliards",
        mot: "En dollars de l'époque, 1906 coûte 400 millions et 1989 près de 6 milliards, ce qui ferait croire à un rapport de quinze. Ramenés à la même monnaie, les deux se rapprochent, et 1989 passe même devant : une ville plus riche a plus à perdre." }
    ]
  };

  function el(balise, classe, texte) {
    var noeud = document.createElement(balise);
    if (classe) noeud.className = classe;
    if (texte != null) noeud.textContent = texte;
    return noeud;
  }
  function maximum(v) { return v == null ? 0 : (Array.isArray(v) ? v[1] : v); }
  function minimum(v) { return v == null ? 0 : (Array.isArray(v) ? v[0] : v); }
  function barre(annee, valeur, texte, plafond) {
    var bloc = document.createElement("div");
    var rangee = el("div", "cmp__barre");
    rangee.appendChild(el("span", "cmp__annee", annee));
    var piste = el("div", "cmp__piste");
    if (valeur != null && plafond > 0) {
      var bas = Math.max(minimum(valeur) / plafond * 100, 1.5);
      var haut = Math.max(maximum(valeur) / plafond * 100, 1.5);
      var plein = el("div", "cmp__remplissage cmp__remplissage--" + annee);
      plein.style.width = bas + "%";
      piste.appendChild(plein);
      if (haut > bas) {
        var marge = el("div", "cmp__marge cmp__marge--" + annee);
        marge.style.left = bas + "%";
        marge.style.width = (haut - bas) + "%";
        piste.appendChild(marge);
      }
    }
    rangee.appendChild(piste);
    bloc.appendChild(rangee);
    var etiquette = el("span", "cmp__valeur", annee + " : " + texte);
    if (valeur == null) etiquette.className += " cmp__inconnu";
    bloc.appendChild(etiquette);
    return bloc;
  }
  function panneau(indicateur) {
    var bloc = el("div", "cmp__panneau");
    bloc.appendChild(el("span", "cmp__nom", indicateur.nom));
    bloc.appendChild(el("span", "cmp__unite", indicateur.unite));
    var plafond = indicateur.sansBarre ? 0
      : Math.max(maximum(indicateur.a1906), maximum(indicateur.a1989));
    bloc.appendChild(barre("1906", indicateur.sansBarre ? null : indicateur.a1906,
                           indicateur.texte, plafond));
    bloc.appendChild(barre("1989", indicateur.sansBarre ? null : indicateur.a1989,
                           indicateur.texte89, plafond));
    bloc.appendChild(el("span", "cmp__mot", indicateur.mot));
    return bloc;
  }
  var hote = document.getElementById("cmp-panneaux");
  var panneaux = [], boutons = [];
  function montrer(rang) {
    for (var i = 0; i < panneaux.length; i++) {
      panneaux[i].hidden = i !== rang;
      boutons[i].setAttribute("aria-pressed", i === rang ? "true" : "false");
    }
  }
  ["alea", "vulnerabilite"].forEach(function (famille) {
    var rangee = document.getElementById("cmp-" + famille);
    INDICATEURS[famille].forEach(function (indicateur) {
      var rang = panneaux.length;
      var bloc = panneau(indicateur);
      hote.appendChild(bloc);
      panneaux.push(bloc);
      var bouton = el("button", "cmp__bouton", indicateur.court);
      bouton.type = "button";
      bouton.setAttribute("aria-pressed", "false");
      bouton.addEventListener("click", function () { montrer(rang); });
      rangee.appendChild(bouton);
      boutons.push(bouton);
    });
  });
  montrer(0);
})();
</script>
</section>
